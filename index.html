/* ---- interactie: berichten, checklists, punten ---- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-editpost],[data-delpost],[data-postsave],[data-postdel],[data-addchecklist],[data-delcl],[data-clnewbtn],[data-togglepostitem],[data-delpostitem],[data-ptag],[data-infotag],[data-infoclear]');
  if (!t) return;
  const d = t.dataset;
  if (d.editpost) { openPostDrawer(d.editpost); return; }
  if (d.delpost) {
    if (!confirm('Dit bericht en de bijbehorende checklists verwijderen?')) return;
    S.posts = S.posts.filter(x => x.id !== d.delpost); render(); save(); toast('Bericht verwijderd'); return;
  }
  if (d.ptag) {
    ui.form.tags = ui.form.tags || [];
    const i = ui.form.tags.indexOf(d.ptag);
    if (i >= 0) ui.form.tags.splice(i, 1); else ui.form.tags.push(d.ptag);
    document.getElementById('drawerBody').innerHTML = postForm();
    return;
  }
  if (d.infotag) {
    const i = ui.infoTags.indexOf(d.infotag);
    if (i >= 0) ui.infoTags.splice(i, 1); else ui.infoTags.push(d.infotag);
    render(); return;
  }
  if (d.infoclear !== undefined) {
    ui.infoTags = []; ui.infoPerson = 'all'; ui.infoFrom = ''; ui.infoTo = '';
    render(); toast('Filters gewist'); return;
  }
  if (d.postsave !== undefined) {
    const p = ui.form;
    if (!p.title.trim()) { toast('Geef het bericht een titel'); return; }
    if (ui.editing) { const i = S.posts.findIndex(x => x.id === ui.editing); S.posts[i] = Object.assign(S.posts[i], p); }
    else { p.id = uid('post'); p.checklists = []; S.posts.push(p); }
    closeDrawer(); render(); save(); toast(ui.editing ? 'Bericht opgeslagen' : 'Bericht geplaatst'); return;
  }
  if (d.postdel !== undefined) {
    if (!confirm('Dit bericht en de bijbehorende checklists verwijderen?')) return;
    S.posts = S.posts.filter(x => x.id !== ui.editing); closeDrawer(); render(); save(); toast('Bericht verwijderd'); return;
  }
  if (d.addchecklist) {
    const post = S.posts.find(x => x.id === d.addchecklist); if (!post) return;
    const name = prompt('Titel van de nieuwe checklist', 'Nieuwe checklist');
    if (!name || !name.trim()) return;
    post.checklists = post.checklists || [];
    post.checklists.push({ id: uid('cl'), title: name.trim(), items: [] });
    render(); save(); toast('Checklist toegevoegd'); return;
  }
  if (d.delcl) {
    const [pid, clid] = d.delcl.split(':');
    const post = S.posts.find(x => x.id === pid); if (!post) return;
    if (!confirm('Deze checklist verwijderen?')) return;
    post.checklists = post.checklists.filter(c => c.id !== clid);
    render(); save(); return;
  }
  if (d.clnewbtn) { addChecklistItem(d.clnewbtn); return; }
  if (d.togglepostitem) {
    const [pid, clid, itid] = d.togglepostitem.split(':');
    const post = S.posts.find(x => x.id === pid); const cl = post && post.checklists.find(c => c.id === clid);
    const it = cl && cl.items.find(i => i.id === itid);
    if (it) { it.done = !it.done; render(); save(); }
    return;
  }
  if (d.delpostitem) {
    const [pid, clid, itid] = d.delpostitem.split(':');
    const post = S.posts.find(x => x.id === pid); const cl = post && post.checklists.find(c => c.id === clid);
    if (cl) { cl.items = cl.items.filter(i => i.id !== itid); render(); save(); }
    return;
  }
});

/* ============================================================
   18. PRESENTATIE-KIEZER — per tabblad aanvinken wat er in de
   presentatie komt, met kleine voorbeelden bij grafieken
   ============================================================ */
function miniRing(items, size) {
  size = size || 44;
  items = (items || []).filter(i => i.value > 0);
  const tot = items.reduce((a, i) => a + i.value, 0);
  if (!tot) return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${size / 2 - 3}" fill="none" stroke="${CH.grid}" stroke-width="4"/></svg>`;
  const cx = size / 2, cy = size / 2, r = size / 2 - 3, ir = r * 0.52;
  let ang = -Math.PI / 2, arcs = '';
  items.forEach(it => {
    const a = it.value / tot * Math.PI * 2, e = ang + a, large = a > Math.PI ? 1 : 0;
    const p = (rr, t) => [cx + rr * Math.cos(t), cy + rr * Math.sin(t)];
    const [x1, y1] = p(r, ang), [x2, y2] = p(r, e), [x3, y3] = p(ir, e), [x4, y4] = p(ir, ang);
    arcs += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}L${x3.toFixed(1)} ${y3.toFixed(1)}A${ir} ${ir} 0 ${large} 0 ${x4.toFixed(1)} ${y4.toFixed(1)}Z" fill="${it.color}"/>`;
    ang = e;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${arcs}</svg>`;
}
function miniBars(items, size) {
  size = size || 44;
  const w = size * 1.5, h = size, items2 = (items || []).filter(i => i.value != null);
  const max = Math.max(...items2.map(i => Math.abs(i.value)), 1);
  const rowH = h / Math.max(items2.length, 1);
  const bars = items2.map((it, i) => {
    const bw = Math.max(2, Math.abs(it.value) / max * (w - 4));
    return `<rect x="2" y="${(i * rowH + rowH * .22).toFixed(1)}" width="${bw.toFixed(1)}" height="${(rowH * .56).toFixed(1)}" rx="1.5" fill="${it.color}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${bars}</svg>`;
}
function miniLine(points, size) {
  size = size || 44;
  const w = size * 1.5, h = size, pad = 3;
  if (!points || points.length < 2) return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${pad}" stroke="${CH.grid}" stroke-width="2"/></svg>`;
  const max = Math.max(...points.map(p => p.cum), 1);
  const X = i => pad + (i / (points.length - 1)) * (w - pad * 2);
  const Y = v => h - pad - (v / max) * (h - pad * 2);
  const line = points.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.cum).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><path d="${line}" fill="none" stroke="#2E86FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function miniRoute(stops, size) {
  size = size || 44;
  const w = size * 1.5, h = size;
  if (!stops || stops.length < 2) return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"></svg>`;
  return routeSvg(stops, { w, h, labels: false, C: CH });
}

/* ---- selectie: welke blokken staan aan (standaard: alles) ---- */
function ensurePptSelection(d) {
  if (!ui.pptSelection) ui.pptSelection = {};
  presentCatalog(d).forEach(g => {
    if (!ui.pptSelection[g.key]) ui.pptSelection[g.key] = {};
    g.blocks.forEach(b => { if (ui.pptSelection[g.key][b.id] === undefined) ui.pptSelection[g.key][b.id] = true; });
  });
  return ui.pptSelection;
}
function buildSlidesFromSelection() {
  const d = compute();
  const sel = ensurePptSelection(d);
  const catalog = presentCatalog(d);
  const slides = [{
    type: 'cover', title: S.trip.name, sub: `${S.trip.dest} · ${fmtDate(S.trip.start)} – ${fmtDate(S.trip.end)}`,
    kpis: [{ l: 'Reizigers', v: String(d.np) }, { l: 'Dagen', v: String(d.days) }, { l: 'Per persoon', v: money0(d.perPersonBuffered) }, { l: 'Totaal', v: money0(d.withBuffer) }]
  }];
  catalog.forEach(g => g.blocks.forEach(b => {
    if (b.disabled) return;
    if (!(sel[g.key] && sel[g.key][b.id])) return;
    if (b.id === 'kerncijfers') return; // zit al in de titelslide
    slides.push(b.build());
  }));
  if (slides.length === 1) slides.push({ type: 'bullets', title: 'Niets geselecteerd', sub: '', bullets: ['Vink op het tabblad Exporteren onderdelen aan om ze hier te zien.'] });
  return { slides, d, title: S.trip.name };
}

/* ---- de kiezer-UI voor het exporttabblad ---- */
function presentPickerHtml(d) {
  const sel = ensurePptSelection(d);
  const catalog = presentCatalog(d);
  const typeLabel = { chart: 'Grafiek', tabel: 'Tabel', lijst: 'Lijst', kpi: 'Kerncijfers' };
  const typeClass = { chart: 'ok', tabel: '', lijst: '', kpi: 'warn' };
  let totalOn = 0, totalAll = 0;
  const groups = catalog.map(g => {
    const rows = g.blocks.map(b => {
      totalAll++; const on = !!sel[g.key][b.id]; if (on) totalOn++;
      const dis = !!b.disabled;
      return `<label class="pick-row ${dis ? 'is-disabled' : ''}">
        <input type="checkbox" data-pick="${g.key}:${b.id}" ${on ? 'checked' : ''} ${dis ? 'disabled' : ''}>
        <span class="pick-prev">${b.preview || ''}</span>
        <span class="pick-label">${esc(b.label)}${dis ? ' <span class="tip">(niet beschikbaar)</span>' : ''}</span>
        <span class="pill ${typeClass[b.type] || ''}">${typeLabel[b.type] || b.type}</span>
      </label>`;
    }).join('');
    const groupOn = g.blocks.filter(b => !b.disabled).every(b => sel[g.key][b.id]);
    const groupAny = g.blocks.some(b => sel[g.key][b.id]);
    return `<div class="pick-group">
      <label class="pick-group-h">
        <input type="checkbox" data-pickgroup="${g.key}" ${groupOn ? 'checked' : ''} data-indeterminate="${groupAny && !groupOn ? '1' : '0'}">
        <strong>${esc(g.label)}</strong>
        <span class="tip flex-end">${g.blocks.filter(b => sel[g.key][b.id]).length}/${g.blocks.length}</span>
      </label>
      <div class="pick-rows">${rows}</div>
    </div>`;
  }).join('');
  return `<div class="card mb"><div class="card-b">
    <div class="flex mb" style="justify-content:space-between">
      <div><div class="eyebrow">Inhoud van de presentatie</div><p class="tip" style="margin:3px 0 0">${totalOn} van ${totalAll} onderdelen geselecteerd, per tabblad. Grafieken tonen een klein voorbeeld.</p></div>
      <div class="flex" style="gap:6px"><button class="btn sm" id="pickAll">Alles</button><button class="btn sm" id="pickNone">Niets</button></div>
    </div>
    <div class="pick-groups">${groups}</div>
  </div></div>`;
}

document.addEventListener('click', ev => {
  if (ev.target.closest('#pickAll') || ev.target.closest('#pickNone')) {
    const on = !!ev.target.closest('#pickAll');
    const d = compute(); const sel = ensurePptSelection(d);
    presentCatalog(d).forEach(g => g.blocks.forEach(b => { if (!b.disabled) sel[g.key][b.id] = on; }));
    render();
  }
});
document.addEventListener('change', ev => {
  const d0 = ev.target.dataset;
  if (d0.pick) {
    const [gk, bk] = d0.pick.split(':');
    ui.pptSelection[gk][bk] = ev.target.checked; render(); return;
  }
  if (d0.pickgroup) {
    const gk = d0.pickgroup, d = compute(); const cat = presentCatalog(d).find(g => g.key === gk);
    const turnOn = ev.target.checked;
    cat.blocks.forEach(b => { if (!b.disabled) ui.pptSelection[gk][b.id] = turnOn; });
    render(); return;
  }
});

/* ============================================================
   19. AGENDA — kalenderoverzicht (maand/jaar) met agendapunten,
   periodes en een beheerbare lijst met belangrijke data
   ============================================================ */
const DOW_NAMES = ['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'];
const MONTH_NAMES = ['Januari', 'Februari', 'Maart', 'April', 'Mei', 'Juni', 'Juli', 'Augustus', 'September', 'Oktober', 'November', 'December'];
const pad2 = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad2(m + 1)}-${pad2(d)}`;
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function mondayIndex(y, m, d) { return (new Date(y, m, d).getDay() + 6) % 7; } // 0 = maandag
function todayYMD() { const t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); }

/* Events die op een gegeven dag (YYYY-MM-DD) actief zijn: exacte datum,
   of een dag binnen [date, endDate] voor periodes. */
function eventsOnDay(dateStr) {
  return (S.events || []).filter(e => {
    if (!e.date) return false;
    const end = e.endDate && e.endDate >= e.date ? e.endDate : e.date;
    return dateStr >= e.date && dateStr <= end;
  });
}
function ensureAgendaDefaults() {
  if (ui.agendaMonth === null || ui.agendaYear === null) {
    const base = S.trip.start ? new Date(S.trip.start) : new Date();
    if (isNaN(base)) { ui.agendaMonth = new Date().getMonth(); ui.agendaYear = new Date().getFullYear(); }
    else { ui.agendaMonth = base.getMonth(); ui.agendaYear = base.getFullYear(); }
  }
}
function shiftAgenda(dir) {
  if (ui.agendaView === 'year') { ui.agendaYear += dir; return; }
  ui.agendaMonth += dir;
  if (ui.agendaMonth > 11) { ui.agendaMonth = 0; ui.agendaYear++; }
  if (ui.agendaMonth < 0) { ui.agendaMonth = 11; ui.agendaYear--; }
}

function isPeriodEvent(e) { return !!(e.endDate && e.endDate !== e.date); }

function monthGrid(year, month) {
  const today = todayYMD();
  const nDays = daysInMonth(year, month);
  const offset = mondayIndex(year, month, 1);
  const cells = [];
  const prevDays = daysInMonth(year, month === 0 ? 11 : month - 1);
  for (let i = 0; i < offset; i++) cells.push({ y: month === 0 ? year - 1 : year, m: month === 0 ? 11 : month - 1, d: prevDays - offset + i + 1, outside: true });
  for (let d = 1; d <= nDays; d++) cells.push({ y: year, m: month, d, outside: false });
  let nextCount = 1;
  while (cells.length % 7 !== 0) {
    const last = cells[cells.length - 1];
    const nm = last.m === 11 ? 0 : last.m + 1, ny = last.m === 11 ? last.y + 1 : last.y;
    cells.push({ y: ny, m: nm, d: nextCount++, outside: true });
  }

  const dow = `<div class="cal-dow">${DOW_NAMES.map(n => `<span>${n}</span>`).join('')}</div>`;
  const grid = cells.map(c => {
    const ds = ymd(c.y, c.m, c.d);
    const evs = c.outside ? [] : eventsOnDay(ds);
    const periods = evs.filter(isPeriodEvent);
    const singles = evs.filter(e => !isPeriodEvent(e));
    const isToday = ds === today;
    const dots = singles.slice(0, 4).map(e => `<span class="dot ${e.deadline ? 'is-deadline' : ''}" style="background:${e.color}"></span>`).join('');
    const bars = periods.slice(0, 3).map(e => {
      const capStart = ds === e.date, capEnd = ds === e.endDate;
      return `<span class="cal-bar ${capStart ? 'cap-start' : ''} ${capEnd ? 'cap-end' : ''}" style="background:${e.color}"></span>`;
    }).join('');
    const label = evs.length ? esc(clip(evs[0].title, 14)) : '';
    const titleAttr = evs.length ? evs.map(e => e.title).join(' · ') : '';
    return `<button type="button" class="cal-day ${c.outside ? 'outside' : ''} ${isToday ? 'is-today' : ''}"
      data-caldate="${ds}" title="${esc(titleAttr)}">
      <span class="dnum">${c.d}</span>
      ${singles.length ? `<div class="dots">${dots}</div>` : ''}
      ${evs.length ? `<div class="evt-label">${label}${evs.length > 1 ? ' +' + (evs.length - 1) : ''}</div>` : ''}
      ${periods.length ? `<div class="cal-bars">${bars}</div>` : ''}
    </button>`;
  }).join('');
  return dow + `<div class="cal-grid">${grid}</div>`;
}

function miniMonth(year, month) {
  const today = todayYMD();
  const nDays = daysInMonth(year, month);
  const offset = mondayIndex(year, month, 1);
  let cells = '';
  for (let i = 0; i < offset; i++) cells += `<span class="cal-mini-day outside"></span>`;
  for (let d = 1; d <= nDays; d++) {
    const ds = ymd(year, month, d);
    const evs = eventsOnDay(ds);
    const period = evs.find(isPeriodEvent);
    const cls = period ? 'has-period' : evs.length ? 'has-event' : '';
    const style = [
      ds === today ? 'box-shadow:0 0 0 1px var(--blue) inset;border-radius:3px' : '',
      period ? `background:${period.color}` : ''
    ].filter(Boolean).join(';');
    cells += `<span class="cal-mini-day ${cls}" title="${esc(evs.map(e => e.title).join(' · '))}" style="${style}">${d}</span>`;
  }
  return `<div class="cal-mini">
    <button type="button" class="cal-mini-h" data-jumpmonth="${month}">${MONTH_NAMES[month]}</button>
    <div class="cal-mini-dow">${DOW_NAMES.map(n => `<span>${n[0]}</span>`).join('')}</div>
    <div class="cal-mini-grid">${cells}</div>
  </div>`;
}

function agendaLegend() {
  return `<div class="cal-legend">
    <span><i class="bar" style="background:var(--green)"></i>Periode (doorlopende balk, eigen kleur)</span>
    <span><i style="background:var(--blue)"></i>Losse dag</span>
    <span><i style="border-radius:2px;background:var(--muted)"></i>Vierkant = deadline</span>
  </div>`;
}
function viewAgenda(d) {
  ensureAgendaDefaults();
  const events = (S.events || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  const todayS = todayYMD();
  const upcoming = events.filter(e => (e.endDate || e.date) >= todayS);
  const nextDeadline = upcoming.find(e => e.deadline);
  const tripDaysLeft = S.trip.start ? Math.ceil((new Date(S.trip.start) - new Date(todayS)) / 864e5) : null;

  const calBody = ui.agendaView === 'year'
    ? `<div class="cal-year">${Array.from({ length: 12 }, (_, m) => miniMonth(ui.agendaYear, m)).join('')}</div>`
    : monthGrid(ui.agendaYear, ui.agendaMonth);

  const title = ui.agendaView === 'year' ? String(ui.agendaYear) : `${MONTH_NAMES[ui.agendaMonth]} ${ui.agendaYear}`;

  const rows = events.length ? events.map(e => {
    const period = e.endDate && e.endDate !== e.date;
    return `<div class="event-row">
      <span class="event-dot" style="background:${e.color};${e.deadline ? 'border-radius:3px' : ''}"></span>
      <div class="event-main">
        <h4>${esc(e.title)}${e.deadline ? '<span class="pill bad">Deadline</span>' : ''}${period ? '<span class="pill">Periode</span>' : ''}</h4>
        <div class="tip">${fmtDate(e.date)}${period ? ' – ' + fmtDate(e.endDate) : ''}</div>
        ${e.desc ? `<div class="tip mt" style="margin-top:5px">${esc(e.desc)}</div>` : ''}
      </div>
      <div class="flex" style="gap:2px;flex-wrap:nowrap">
        <button class="btn ghost icon-btn" data-editevent="${e.id}" title="Bewerken"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="btn ghost icon-btn danger" data-delevent="${e.id}" title="Verwijderen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
      </div>
    </div>`;
  }).join('') : `<div class="empty"><h4>Nog geen data toegevoegd</h4><p>Voeg een deadline, afspraak of periode toe met de knop hierboven.</p></div>`;

  return sectionTitle('Agenda', `${events.length} ${events.length === 1 ? 'agendapunt' : 'agendapunten'}`) + `
  <div class="grid g4 mb">
    ${kpi('Agendapunten', String(events.length), `${events.filter(e => e.deadline).length} deadlines`, true)}
    ${kpi('Eerstvolgende deadline', nextDeadline ? fmtDate(nextDeadline.date) : '—', nextDeadline ? esc(nextDeadline.title) : 'geen open deadlines')}
    ${kpi('Dagen tot vertrek', tripDaysLeft != null ? (tripDaysLeft >= 0 ? String(tripDaysLeft) : 'onderweg/terug') : '—', fmtDate(S.trip.start))}
    ${kpi('Komende items', String(upcoming.length), 'vanaf vandaag')}
  </div>

  <div class="card mb"><div class="card-b">
    <div class="cal-toolbar">
      <div class="seg">
        <button data-agview="month" aria-pressed="${ui.agendaView === 'month'}">Maand</button>
        <button data-agview="year" aria-pressed="${ui.agendaView === 'year'}">Jaar</button>
      </div>
      <div class="cal-nav">
        <button class="btn ghost icon-btn" data-agnav="-1" aria-label="Vorige"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <span class="cal-title">${title}</span>
        <button class="btn ghost icon-btn" data-agnav="1" aria-label="Volgende"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <button class="btn sm" data-agtoday>Vandaag</button>
      <button class="btn sm" data-agtrip>Naar de reis</button>
      <button class="btn primary sm flex-end" data-open-drawer="event">+ Datum toevoegen</button>
    </div>
    ${calBody}
    ${agendaLegend()}
  </div></div>

  ${sectionTitle('Belangrijke data', 'Datum, beschrijving, deadline en kleur zijn aan te passen')}
  ${rows}`;
}

/* ---- drawer: agendapunt toevoegen/bewerken ---- */
function openEventDrawer(id, presetDate) {
  const e = id ? (S.events || []).find(x => x.id === id) : { id: null, title: '', desc: '', date: presetDate || S.trip.start || todayYMD(), endDate: null, deadline: false, color: PALETTE[0] };
  ui.form = JSON.parse(JSON.stringify(e)); ui.editing = id || null; ui.drawer = 'event';
  // Los UI-vinkje, niet onderdeel van de opgeslagen data: bepaalt alleen of het
  // einddatum-veld getoond wordt. Bij bewerken van een bestaande periode staat
  // 'm al aan; bij een nieuw agendapunt staat 'm uit, zodat er nooit per ongeluk
  // een periode ontstaat doordat een einddatum-veld toevallig een waarde heeft.
  ui.form._isPeriod = !!(e.endDate);
  $('#drawerTitle').textContent = id ? 'Agendapunt bewerken' : 'Nieuw agendapunt';
  $('#drawerBody').innerHTML = eventForm();
  $('#drawerFoot').innerHTML = `${id ? '<button class="btn danger" data-eventdel>Verwijderen</button>' : ''}<button class="btn primary flex-end" data-eventsave>${id ? 'Opslaan' : 'Toevoegen'}</button>`;
  $('#drawer').dataset.open = '1'; $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').dataset.open = '1';
}
function eventForm() {
  const e = ui.form, isPeriod = !!e._isPeriod;
  return `
  <label class="f"><span>Titel</span><input type="text" data-ag="title" value="${esc(e.title)}" placeholder="Bijvoorbeeld: Vluchten boeken"></label>
  <label class="f"><span>${isPeriod ? 'Startdatum' : 'Datum'}</span><input type="date" data-ag="date" value="${e.date || ''}"></label>
  <label class="chk" data-on="${isPeriod ? '1' : '0'}" style="width:fit-content"><input type="checkbox" data-agisperiod ${isPeriod ? 'checked' : ''}>Dit is een periode (met een begin- en einddatum)</label>
  ${isPeriod ? `<label class="f"><span>Einddatum</span><input type="date" data-ag="endDate" value="${e.endDate || ''}"></label>` : ''}
  <label class="f"><span>Beschrijving (optioneel)</span><textarea data-ag="desc" rows="2" placeholder="Extra details">${esc(e.desc || '')}</textarea></label>
  <label class="chk" data-on="${e.deadline ? '1' : '0'}" style="width:fit-content"><input type="checkbox" data-agdeadline ${e.deadline ? 'checked' : ''}>Dit is een deadline</label>
  <div><span class="eyebrow" style="display:block;margin-bottom:8px">Kleur</span>
    <div class="flex" style="gap:7px">${PALETTE.map(col => `<button type="button" data-agcolor="${col}" style="width:28px;height:28px;border-radius:8px;background:${col};border:2px solid ${e.color === col ? 'var(--ink)' : 'transparent'}" title="${col}"></button>`).join('')}</div></div>
  <p class="tip">${isPeriod ? 'Een periode wordt als doorlopende balk over meerdere dagen getoond, zoals de reisperiode zelf.' : 'Vink "Dit is een periode" aan om ook een einddatum op te geven.'}</p>`;
}

/* ---- interactie ---- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-agview],[data-agnav],[data-agtoday],[data-agtrip],[data-caldate],[data-jumpmonth],[data-editevent],[data-delevent],[data-eventsave],[data-eventdel],[data-agcolor]');
  if (!t) return;
  const d = t.dataset;
  if (d.agview) { ui.agendaView = d.agview; render(); return; }
  if (d.agnav) { ensureAgendaDefaults(); shiftAgenda(Number(d.agnav)); render(); return; }
  if (d.agtoday !== undefined) { const now = new Date(); ui.agendaMonth = now.getMonth(); ui.agendaYear = now.getFullYear(); ui.agendaView = 'month'; render(); return; }
  if (d.agtrip !== undefined) {
    const base = S.trip.start ? new Date(S.trip.start) : new Date();
    ui.agendaMonth = isNaN(base) ? new Date().getMonth() : base.getMonth();
    ui.agendaYear = isNaN(base) ? new Date().getFullYear() : base.getFullYear();
    ui.agendaView = 'month'; render(); return;
  }
  if (d.jumpmonth !== undefined) { ui.agendaMonth = Number(d.jumpmonth); ui.agendaView = 'month'; render(); return; }
  if (d.caldate) { openEventDrawer(null, d.caldate); return; }
  if (d.editevent) { openEventDrawer(d.editevent); return; }
  if (d.delevent) {
    if (!confirm('Dit agendapunt verwijderen?')) return;
    S.events = S.events.filter(x => x.id !== d.delevent); render(); save(); toast('Agendapunt verwijderd'); return;
  }
  if (d.agcolor) { ui.form.color = d.agcolor; $('#drawerBody').innerHTML = eventForm(); return; }
  if (d.eventsave !== undefined) {
    const f = ui.form;
    const title = String(f.title || '').trim();
    if (!title) { toast('Geef het agendapunt een titel'); return; }
    if (!f.date) { toast('Kies een datum'); return; }
    // _isPeriod is puur UI-state (bepaalt of het einddatum-veld zichtbaar was).
    // Staat die uit, dan negeren we een eventuele einddatum-waarde volledig —
    // zo kan er nooit per ongeluk een periode ontstaan.
    const endDate = f._isPeriod && f.endDate ? f.endDate : null;
    if (endDate && endDate < f.date) { toast('De einddatum kan niet vóór de startdatum liggen'); return; }
    const clean = { title, desc: String(f.desc || '').trim(), date: f.date, endDate, deadline: !!f.deadline, color: f.color };
    if (ui.editing) { const i = S.events.findIndex(x => x.id === ui.editing); S.events[i] = Object.assign(S.events[i], clean); }
    else { clean.id = uid('ag'); S.events.push(clean); }
    closeDrawer(); render(); save(); toast(ui.editing ? 'Agendapunt opgeslagen' : 'Agendapunt toegevoegd'); return;
  }
  if (d.eventdel !== undefined) {
    S.events = S.events.filter(x => x.id !== ui.editing); closeDrawer(); render(); save(); toast('Agendapunt verwijderd'); return;
  }
});
document.addEventListener('input', ev => {
  const d = ev.target.dataset;
  if (d.ag) { ui.form[d.ag] = ev.target.value; return; }
});
document.addEventListener('change', ev => {
  const d = ev.target.dataset;
  if (d.agdeadline !== undefined) { ui.form.deadline = ev.target.checked; ev.target.closest('.chk').dataset.on = ev.target.checked ? '1' : '0'; return; }
  if (d.agisperiod !== undefined) {
    ui.form._isPeriod = ev.target.checked;
    if (!ev.target.checked) ui.form.endDate = null;
    $('#drawerBody').innerHTML = eventForm();
    return;
  }
});

/* ============================================================
   8. RENDEREN
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function renderRail(d) {
  const useBooked = ui.railScope === 'booked';
  const vals = S.cats.map(c => ({ c, v: useBooked ? d.byCat[c.id].booked : d.byCat[c.id].total })).filter(x => x.v > 0);
  const sum = vals.reduce((a, x) => a + x.v, 0);
  const anchor = Math.max(d.limit, d.budget, sum);
  const scale = Math.max(anchor * 1.02, 1);
  let marks = '';
  if (d.limit > 0) marks += `<div class="rail-mark limit" style="left:calc(${(d.limit / scale * 100).toFixed(2)}% - 1px)"><span>Limiet ${money0(d.limit)}</span></div>`;
  if (d.budget > 0 && Math.abs(d.budget - d.limit) / scale > 0.03) marks += `<div class="rail-mark budget" style="left:calc(${(d.budget / scale * 100).toFixed(2)}% - 1px)"></div>`;
  $('#rail').innerHTML = vals.map(x => `<div class="rail-seg" style="width:calc(${(x.v / scale * 100).toFixed(2)}% - 3px);background:${x.c.color}" data-l="${esc(x.c.name)} ${money0(x.v)}" title="${esc(x.c.name)}: ${money0(x.v)}"></div>`).join('') + marks;
  $('#railTotal').textContent = money0(sum);
  const ref = d.limit > 0 ? d.limit : d.budget;
  const rest = ref - sum;
  const label = d.limit > 0 ? 'limiet' : 'budget';
  $('#railTag').innerHTML = `${useBooked ? 'geboekt' : 'geboekt + geschat'} · ${money0(sum / d.np)} p.p. · <span style="color:${rest < 0 ? 'var(--alert)' : 'var(--muted)'}">${rest >= 0 ? money0(rest) + ' onder de ' + label : money0(-rest) + ' boven de ' + label}</span>`;
  $('#railLegend').innerHTML = vals.map(x => `<span class="rl"><i style="background:${x.c.color}"></i>${esc(x.c.name)} <span class="num" style="color:var(--muted)">${pct(x.v, sum)}%</span></span>`).join('');
}

function render() {
  try {
    syncChartColors();
    const d = compute();
    $('#tripName').textContent = 'Barrytravelapp';
    $('#tripSub').textContent = `${S.trip.name || ''} · ${S.trip.dest || '—'} · ${fmtDate(S.trip.start)} – ${fmtDate(S.trip.end)} · ${d.days} dagen · ${d.np} pers.`;
    const shown = S.people.slice(0, 6), extra = S.people.length - shown.length;
    $('#peopleAv').innerHTML = shown.map(p => `<span class="av" style="background:${p.color}" title="${esc(p.name)}">${initials(p.name)}</span>`).join('')
      + (extra > 0 ? `<span class="av more" title="${esc(S.people.slice(6).map(p => p.name).join(', '))}">+${extra}</span>` : '');
    $('#cntExp').textContent = S.expenses.length;
    $('#cntStops').textContent = (S.route || []).length;
    $('#cntPosts').textContent = (S.posts || []).length;
    $('#cntEvents').textContent = (S.events || []).length;
    const saveBtn = $('#saveNowBtn');
    if (saveBtn) saveBtn.title = sync.mode === 'shared' ? 'Nu opslaan (gedeeld)' : 'Nu opslaan op dit toestel — download ook geregeld een back-up via Exporteren, want lokale opslag bij een los bestand is niet altijd betrouwbaar';
    $$('#tabbar .tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab)));
    $$('#railScope button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.scope === ui.railScope)));
    renderRail(d);
    const v = $('#view');
    if (ui.tab !== 'reis' && MAP) { teardownMap(MAP); MAP = null; }
    v.innerHTML = ui.tab === 'start' ? viewStart(d)
      : ui.tab === 'reis' ? viewReis(d)
        : ui.tab === 'info' ? viewInfo(d)
          : ui.tab === 'agenda' ? viewAgenda(d)
            : ui.tab === 'groep' ? viewGroep(d)
              : ui.tab === 'individueel' ? viewIndividueel(d)
                : ui.tab === 'geschat' ? viewGeschat(d)
                  : ui.tab === 'kosten' ? viewKosten(d)
                    : ui.tab === 'budget' ? viewBudget(d)
                      : viewExport(d);
    $$('[data-indeterminate="1"]').forEach(el => { el.indeterminate = true; });
    if (ui.tab === 'info' && ui.jumpTo) {
      const el = document.getElementById('post-' + ui.jumpTo);
      if (el && el.scrollIntoView) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { } }
      ui.jumpTo = null;
    }
    if (ui.tab === 'reis') { if (mapNeedsReinit || !MAP) setTimeout(() => { initMap(); }, 30); mapNeedsReinit = true; }
  } catch (err) {
    // Eén tabblad dat vastloopt mag nooit de rest van de app (of het opslaan
    // hieronder) meeslepen. Toon een duidelijke melding in plaats van een
    // lege of bevroren pagina, en probeer op een ander tabblad terug te vallen.
    try {
      const v = $('#view');
      if (v) v.innerHTML = `<div class="card"><div class="card-b">
        <h3>Dit onderdeel kon niet worden geladen</h3>
        <p class="tip mt">Je gegevens zijn niet kwijt en worden nog steeds opgeslagen. Probeer een ander tabblad te openen, of ververs de pagina.</p>
        <button class="btn sm mt" data-tab="start">Naar Start</button>
        <p class="tip mt" style="font-family:var(--mono);font-size:10.5px;opacity:.7">${esc((err && err.message) || String(err))}</p>
      </div></div>`;
    } catch (e2) { /* als zelfs dit niet lukt, verder niets forceren */ }
  }
  save(); // altijd proberen op te slaan, ook als de weergave hierboven vastliep
}

function toast(msg) {
  const t = $('#toast'); t.innerHTML = msg; t.dataset.on = '1';
  clearTimeout(t._t); t._t = setTimeout(() => t.dataset.on = '0', 3200);
}

    const e = id ? S.expenses.find(x => x.id === id) : { id: null, desc: '', note: '', cat: S.cats[0] && S.cats[0].id, sub: null, amount: 0, unit: 'pp', qty: 1, kind: 'est', payer: null, date: S.trip.start, who: S.people.map(p => p.id) };
    ui.form = JSON.parse(JSON.stringify(e));
    $('#drawerTitle').textContent = id ? 'Kostenpost bewerken' : 'Nieuwe kostenpost';

/* ============================================================
   10. INTERACTIE

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab],[data-scope],[data-open-drawer],[data-edit],[data-dup],[data-del],[data-incl],[data-editcat],[data-delcat],[data-addsub],[data-delsub],[data-color],[data-formsave],[data-formdel],[data-catsave],[data-close],[data-delperson],[data-scope2],[data-fmt],[data-v]');
  if (!t) return;
  const d = t.dataset;

  if (d.tab) { ui.tab = d.tab; ui.jumpTo = d.jumpto || null; render(); if (!d.jumpto) window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (d.scope) { ui.railScope = d.scope; render(); return; }

  if (d.openDrawer === 'event') { openEventDrawer(); return; }

  if (d.close !== undefined) { closeDrawer(); render(); return; }

  if (d.edit) { openDrawer('expense', d.edit); return; }
  if (d.dup) {
    const e = S.expenses.find(x => x.id === d.dup);
    S.expenses.push(Object.assign({}, JSON.parse(JSON.stringify(e)), { id: uid('e'), desc: e.desc + ' (kopie)', createdBy: MY_USER }));
    render(); toast('Kostenpost gedupliceerd'); return;
  }
  if (d.del) {
    const e = S.expenses.find(x => x.id === d.del);
    S.expenses = S.expenses.filter(x => x.id !== d.del);
    render(); toast(`"${esc(e.desc)}" verwijderd`); return;
  }
  if (d.editcat) { openDrawer('cat', d.editcat); return; }
  if (d.delcat) {
    const c = catById(d.delcat);
    const n = S.expenses.filter(e => e.cat === d.delcat).length;
    if (n && !confirm(`"${c.name}" heeft ${n} kostenpost${n === 1 ? '' : 'en'}. Die worden mee verwijderd. Doorgaan?`)) return;
    S.expenses = S.expenses.filter(e => e.cat !== d.delcat);
    S.cats = S.cats.filter(x => x.id !== d.delcat);
    render(); toast('Categorie verwijderd'); return;
  }
  if (d.addsub) {
    const c = catById(d.addsub); if (!c) return;
    const name = prompt(`Nieuwe subcategorie in "${c.name}"`);
    if (name && name.trim()) { c.subs.push({ id: uid('s'), name: name.trim() }); if (ui.drawer === 'cat') { $('#drawerBody').innerHTML = catForm(); } render(); toast('Subcategorie toegevoegd'); }
    return;
  }
  if (d.delsub) {
    const [cid, sid] = d.delsub.split(':');
    const c = catById(cid); if (!c) return;
    c.subs = c.subs.filter(s => s.id !== sid);
    S.expenses.forEach(e => { if (e.sub === sid) e.sub = null; });
    if (ui.drawer === 'cat') $('#drawerBody').innerHTML = catForm();
    render(); return;
  }
  if (d.delperson) {
    if (S.people.length <= 1) { toast('Er moet minstens één reiziger zijn'); return; }
    S.people = S.people.filter(p => p.id !== d.delperson);
    S.expenses.forEach(e => { e.who = e.who.filter(w => w !== d.delperson); if (e.payer === d.delperson) e.payer = null; if (!e.who.length) e.who = S.people.map(p => p.id); });
    $('#drawerBody').innerHTML = tripForm(); render(); return;
  }
  if (d.color) { ui.form.color = d.color; $('#drawerBody').innerHTML = catForm(); return; }
  if (d.v && t.parentElement.dataset.fSeg) { ui.form[t.parentElement.dataset.fSeg] = d.v; $('#drawerBody').innerHTML = expenseForm(); return; }

  if (d.formsave !== undefined) {
    const e = ui.form;
    if (!e.desc.trim()) { toast('Geef de kostenpost een omschrijving'); return; }
    if (!e.who.length) { toast('Vink minstens één reiziger aan'); return; }
    if (ui.editing) { const i = S.expenses.findIndex(x => x.id === ui.editing); S.expenses[i] = Object.assign(S.expenses[i], e); }
    else { e.id = uid('e'); S.expenses.push(e); }
    closeDrawer(); render(); toast(ui.editing ? 'Wijzigingen opgeslagen' : 'Kostenpost toegevoegd'); return;
  }
  if (d.formdel !== undefined) { S.expenses = S.expenses.filter(x => x.id !== ui.editing); closeDrawer(); render(); toast('Kostenpost verwijderd'); return; }
  if (d.catsave !== undefined) {
    const c = ui.form;
    if (!c.name.trim()) { toast('Geef de categorie een naam'); return; }
    if (c.id) { const o = catById(c.id); o.name = c.name.trim(); o.color = c.color; o.budget = Number(c.budget) || 0; }
    else S.cats.push({ id: uid('c'), name: c.name.trim(), color: c.color, budget: Number(c.budget) || 0, subs: [] });
    closeDrawer(); render(); toast(c.id ? 'Categorie opgeslagen' : 'Categorie toegevoegd'); return;
  }
  if (d.scope2) { ui.exportScope = d.scope2; render(); return; }
  if (d.fmt) { ui.exportFmt = d.fmt; render(); return; }
});

function liveLimit(skipInputs) {
  const d = compute();
  const t = $('#limTotal'); if (t) t.textContent = money0(d.limit);
  const s = $('#limSub'); if (s) s.textContent = d.limit ? money0(d.limitPP) + ' per persoon · ' + d.np + ' reizigers' : 'Nog geen limiet ingesteld';
  const r = $('#limRest');
  if (r) { r.textContent = d.limit ? (d.limitLeft >= 0 ? money0(d.limitLeft) + ' onder de limiet' : money0(-d.limitLeft) + ' boven de limiet') : 'Zet de schuif op 0 om zonder limiet te werken'; r.style.color = d.limitLeft < 0 ? 'var(--alert)' : ''; }
  const sc = Math.max(d.limit, d.withBuffer, 1);
  const be = $('[data-limest]'), bb = $('[data-limbooked]');
  if (be) be.style.width = (d.limit ? Math.min(100, d.withBuffer / sc * 100) : 0) + '%';
  if (bb) bb.style.width = (d.limit ? Math.min(100, d.booked / sc * 100) : 0) + '%';
  if (!skipInputs) {
    const a = document.querySelector('[data-limit="total"]'), b = document.querySelector('[data-limit="pp"]');
    if (a) a.value = Math.round(d.limit); if (b) b.value = Math.round(d.limitPP);
  }
  renderRail(d); save();
  clearTimeout(liveLimit._t);
  liveLimit._t = setTimeout(() => { const id = document.activeElement && document.activeElement.id; render(); const n = id && document.getElementById(id); if (n) n.focus(); }, 500);
}
function liveGeschat() {
  const d = compute();
  $('#bufAmt').textContent = money0(d.withBuffer - d.projected);
  renderRail(d); save();
  clearTimeout(liveGeschat._t);
  liveGeschat._t = setTimeout(() => { const s = document.activeElement && document.activeElement.id; render(); const n = s && document.getElementById(s); if (n) n.focus(); }, 420);
}

function exportModel(scope) {
  const d = compute(), cur = S.trip.currency, f = scenarioFactor() * bufferFactor();
  const B = (title, header, rows, moneyCols, total) => ({ title, header, rows, moneyCols: moneyCols || [], total: total || null });
  const cats = S.cats.map(c => ({ c, ...d.byCat[c.id] })).sort((a, b) => b.total - a.total);
  const sheets = [];

  sheets.push({
    name: 'Samenvatting', blocks: [
      B('Reisgegevens', ['Onderdeel', 'Waarde'], [
        ['Naam', S.trip.name], ['Route', S.trip.dest], ['Vertrek', S.trip.start], ['Terug', S.trip.end],
        ['Reisdagen', d.days], ['Reizigers', d.np], ['Bestemmingen', d.route.stops.length],
        ['Totale afstand (km)', Math.round(d.route.km)], ['Reistijd onderweg (uur)', Math.round(d.route.hours * 10) / 10], ['Namen', S.people.map(p => p.name).join(', ')],
        ['Valuta', cur], ['Scenario-opslag', S.trip.scenario + '%'], ['Onvoorzien', S.trip.buffer + '%'],
        ['Totale limiet', d.limit], ['Limiet per persoon', d.limitPP],
        ['Gemaakt op', new Date().toLocaleDateString('nl-NL')]
      ]),
      B('Kerncijfers', ['Kengetal', cur], [

        ['Som categoriebudgetten', d.budget], ['Ruimte t.o.v. budget', d.budget - d.total],
        ['Totale limiet', d.limit], ['Raming incl. buffer', d.withBuffer], ['Ruimte t.o.v. limiet', d.limitLeft],
        ['Per persoon (basis)', d.perPerson], ['Per persoon incl. opslag', d.perPersonBuffered],
        ['Per dag (groep)', d.perDay], ['Per persoon per dag', d.perPersonPerDay],
        ['Aantal kostenposten', S.expenses.length]
      ], [2])
    ]
  });

  sheets.push({
    name: 'Kostenposten', blocks: [
      B('Alle kostenposten', ['Omschrijving', 'Toelichting', 'Categorie', 'Subcategorie', 'Bedrag', 'Eenheid', 'Aantal', 'Deelnemers', 'Totaal ' + cur, 'Per deelnemer', 'Status', 'Voorgeschoten door', 'Datum'],
        S.expenses.slice().sort((a, b) => lineTotal(b) - lineTotal(a)).map(e => {
          const c = catById(e.cat), s = c && subById(c, e.sub), n = (e.who || []).length || d.np, t = lineTotal(e);
          return [e.desc, e.note || '', c ? c.name : '', s ? s.name : '', Number(e.amount) || 0, UNITS[e.unit].label, e.qty || 1, n, t, t / n,
          e.kind === 'booked' ? 'Geboekt' : 'Geschat', e.payer ? (personById(e.payer) || {}).name || '' : '', e.date || ''];
        }), [5, 9, 10], ['Totaal', '', '', '', '', '', '', '', d.total, '', '', '', ''])
    ]
  });

  if (d.route.stops.length) {
    sheets.push({
      name: 'Route', blocks: [
        B('Bestemmingen', ['#', 'Bestemming', 'Nachten', 'Breedte', 'Lengte', 'Notitie'],
          d.route.stops.map((s, i2) => [i2 + 1, s.name, Number(s.nights) || 0, s.lat, s.lng, s.note || ''])),
        B('Etappes', ['Van', 'Naar', 'Vervoer', 'Hemelsbreed km', 'Te rijden km', 'Reisuren'],
          d.route.legs.map(l => [l.from.name, l.to.name, l.mode.label, Math.round(l.straight), Math.round(l.km), Math.round(l.hours * 10) / 10]),

          [2, 3, 4, 5, 6], ['Totaal', d.perPerson, d.perPersonBuffered, d.perPersonBuffered / d.days, d.budget / d.np, d.perPersonBuffered - d.budget / d.np, pct(d.est, d.total) + '%']),
        B('Scenario\u2019s', ['Scenario', 'Afwijking', 'Groep', 'Per persoon', 'Per persoon per dag'],
          [['Meevaller', '-10%', .9], ['Verwacht', '0%', 1], ['Tegenvaller', '+15%', 1.15], ['Worst case', '+30%', 1.3]]
            .map(s => { const v = d.total * bufferFactor() * s[2]; return [s[0], s[1], v, v / d.np, v / d.np / d.days]; }), [3, 4, 5])

    addChart('Opbouw per reiziger', 'COLUMN', ['Reiziger', ...S.cats.map(c => c.name)],
      S.people.map(p => [p.name, ...S.cats.map(c => Math.round(d.byPerson[p.id].byCat[c.id] || 0))]),
      stackedChart(S.people.map(p => ({ label: p.name, values: d.byPerson[p.id].byCat })), S.cats.map(c => ({ key: c.id, label: c.name, color: c.color })), { C: LIGHT_CH }));
  }
  if (scope === 'geschat' || scope === 'alles') {
    addChart('Raming per persoon per categorie', 'COLUMN', ['Categorie', 'Per persoon'], cats.map(x => [x.c.name, Math.round(x.total * f / d.np)]),
      donutChart(cats.map(x => ({ label: x.c.name, value: x.total * f / d.np, color: x.c.color })), { C: LIGHT_CH, center: money0(d.perPersonBuffered), centerSub: 'P.P.' }));
    addChart('Dagbudget per persoon', 'BAR', ['Categorie', 'Per dag'], cats.map(x => [x.c.name, Math.round(x.total * f / d.np / d.days * 100) / 100]),
      hbarChart(cats.map(x => ({ label: x.c.name, value: x.total * f / d.np / d.days, color: x.c.color })), { C: LIGHT_CH }));
  }
  const title = `${S.trip.name} — ${{ alles: 'compleet dossier', groep: 'groepsoverzicht', individueel: 'individueel overzicht', geschat: 'raming per persoon' }[scope]}`;
  return { d, sheets, charts, title, currency: cur };
}

function outMsg(html) { const el = document.getElementById('exportOut'); if (el) el.innerHTML = html; }
function dl(blob, name) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 1500);
}
function svgToPng(svg, bg) {
  return new Promise((res, rej) => {
    const m = svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
    const w = m ? +m[1] : 520, h = m ? +m[2] : 300, sc = 2;
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = w * sc; c.height = h * sc;
      const x = c.getContext('2d'); x.fillStyle = bg || '#ffffff'; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      res({ data: c.toDataURL('image/png').split(',')[1], w, h });
    };
    img.onerror = rej;
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  });
}

async function exportXlsx() {
  if (typeof ExcelJS === 'undefined') { toast('De Excel-bibliotheek kon niet geladen worden — probeer de CSV-knop of de Google-variant'); return; }
  const M = exportModel(ui.exportScope);
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Reisbegroting'; wb.created = new Date();
  const fmt = '#,##0.00';
  M.sheets.forEach(sh => {
    const ws = wb.addWorksheet(sh.name, { views: [{ state: 'frozen', ySplit: 0 }] });
    let r = 1, maxCols = 1;
    sh.blocks.forEach(b => {
      maxCols = Math.max(maxCols, b.header.length);
      const tc = ws.getCell(r, 1); tc.value = b.title;
      tc.font = { bold: true, size: 13, color: { argb: 'FF0E4B43' } }; r++;
      const hr = ws.getRow(r); hr.values = b.header;
      hr.eachCell(c => { c.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 10 }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0E4B43' } }; c.alignment = { vertical: 'middle' }; });
      hr.height = 20; r++;
      b.rows.forEach(row => {
        const rr = ws.getRow(r); rr.values = row;
        row.forEach((v, i) => { const c = rr.getCell(i + 1); if (typeof v === 'number' && b.moneyCols.includes(i + 1)) c.numFmt = fmt; if (i > 0) c.alignment = { horizontal: typeof v === 'number' ? 'right' : 'left' }; });
        r++;
      });
      if (b.total) {
        const tr = ws.getRow(r); tr.values = b.total;
        tr.eachCell(c => { c.font = { bold: true }; c.border = { top: { style: 'medium', color: { argb: 'FF0E4B43' } } }; });
        b.total.forEach((v, i) => { if (typeof v === 'number' && b.moneyCols.includes(i + 1)) tr.getCell(i + 1).numFmt = fmt; });
        r++;
      }
      r += 2;
    });
    ws.columns.forEach((c, i) => { c.width = i === 0 ? 34 : 15; });
  });
  const gs = wb.addWorksheet('Grafieken');
  gs.getCell(1, 1).value = M.title; gs.getCell(1, 1).font = { bold: true, size: 15, color: { argb: 'FF0E4B43' } };
  gs.getColumn(1).width = 4;
  let row = 3;
  for (const ch of M.charts) {
    gs.getCell(row, 2).value = ch.title;
    gs.getCell(row, 2).font = { bold: true, size: 12 };
    try {
      const png = await svgToPng(ch.svg);
      const id = wb.addImage({ base64: png.data, extension: 'png' });
      gs.addImage(id, { tl: { col: 1, row: row }, ext: { width: png.w * 1.05, height: png.h * 1.05 } });
      row += Math.ceil(png.h * 1.05 / 20) + 3;
    } catch (e) { gs.getCell(row + 1, 2).value = '(grafiek kon niet worden meegenomen)'; row += 3; }
  }
  const buf = await wb.xlsx.writeBuffer();
  dl(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), slug(M.title) + '.xlsx');
  toast('Excel-bestand gedownload');
  outMsg( `<div class="ins-item good"><div class="ins-ico">${ICONS.check}</div><div><h4>Klaar</h4><p>${M.sheets.length + 1} werkbladen, waarvan één met ${M.charts.length} grafieken. Wil je hem in Google Drive? Sleep het bestand in Drive en kies <span class="hl">Openen met Google Spreadsheets</span>.</p></div></div>`);
}
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);

function buildAppsScript() {
  const M = exportModel(ui.exportScope);
  let cursor = 1;
  const blocks = M.charts.map((ch, i) => {
    const b = { title: ch.title, header: ch.header, rows: ch.rows, row: cursor, type: ch.type, anchorRow: 1 + i * 17, anchorCol: 8, cols: ch.header.length, n: ch.rows.length };
    cursor += ch.rows.length + 4;
    return b;
  });
  const payload = {
    title: M.title,
    sheets: M.sheets.map(s => ({ name: s.name, blocks: s.blocks.map(b => ({ title: b.title, header: b.header, rows: b.rows, money: b.moneyCols, total: b.total })) })),
    chartSheet: { name: 'Grafieken', blocks }
  };
  return `/**
 * ${M.title}
 * Gegenereerd door de reisbegroting-app op ${new Date().toLocaleString('nl-NL')}.
 * Plak dit in Extensies > Apps Script van een lege Google Spreadsheet en voer bouwOverzicht() uit.
 */
var DATA = ${JSON.stringify(payload)};

function bouwOverzicht() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  ss.rename(DATA.title);
  var HEAD = '#0E4B43', ACC = '#D8A029';

  DATA.sheets.forEach(function (sh) {
    var s = ss.getSheetByName(sh.name) || ss.insertSheet(sh.name);
    s.clear();
    var r = 1, wide = 1;
    sh.blocks.forEach(function (b) {
      wide = Math.max(wide, b.header.length);
      s.getRange(r, 1).setValue(b.title).setFontWeight('bold').setFontSize(12).setFontColor(HEAD);
      r++;
      s.getRange(r, 1, 1, b.header.length).setValues([b.header])
        .setFontWeight('bold').setBackground(HEAD).setFontColor('#FFFFFF');
      r++;
      if (b.rows.length) {
        s.getRange(r, 1, b.rows.length, b.header.length).setValues(b.rows);
        (b.money || []).forEach(function (c) {
          s.getRange(r, c, b.rows.length, 1).setNumberFormat('#,##0.00');
        });
        s.getRange(r, 1, b.rows.length, b.header.length)
          .setBorder(null, null, true, null, null, true, '#E3E6DF', SpreadsheetApp.BorderStyle.SOLID);
        r += b.rows.length;
      }
      if (b.total) {
        s.getRange(r, 1, 1, b.total.length).setValues([b.total]).setFontWeight('bold')
          .setBorder(true, null, null, null, null, null, HEAD, SpreadsheetApp.BorderStyle.SOLID_MEDIUM);
        (b.money || []).forEach(function (c) { s.getRange(r, c).setNumberFormat('#,##0.00'); });
        r++;
      }
      r += 2;
    });
    s.setFrozenRows(2);
    for (var i = 1; i <= wide; i++) s.autoResizeColumn(i);
    s.getRange(1, 1, s.getMaxRows(), wide).setVerticalAlignment('middle');
  });

  var g = ss.getSheetByName(DATA.chartSheet.name) || ss.insertSheet(DATA.chartSheet.name);
  g.clear();
  g.getCharts().forEach(function (c) { g.removeChart(c); });
  DATA.chartSheet.blocks.forEach(function (b) {
    g.getRange(b.row, 1).setValue(b.title).setFontWeight('bold').setFontColor(HEAD);
    g.getRange(b.row + 1, 1, 1, b.header.length).setValues([b.header]).setFontWeight('bold').setBackground('#F1F2ED');
    if (b.rows.length) g.getRange(b.row + 2, 1, b.rows.length, b.header.length).setValues(b.rows);
    if (!b.n) return;
    var range = g.getRange(b.row + 1, 1, b.n + 1, b.cols);
    var chart = g.newChart()
      .setChartType(Charts.ChartType[b.type])
      .addRange(range)
      .setNumHeaders(1)
      .setPosition(b.anchorRow, b.anchorCol, 0, 0)
      .setOption('title', b.title)
      .setOption('width', 520)
      .setOption('height', 300)
      .setOption('colors', ['#0E4B43', '#D8A029', '#6E9B5B', '#B4472F', '#4A7FA5', '#8C6A9F'])
      .setOption('legend', { position: 'right' })
      .build();
    g.insertChart(chart);
  });
  g.setColumnWidth(1, 190);

  var first = ss.getSheets()[0];
  if (first.getLastRow() === 0 && ss.getSheets().length > 1) ss.deleteSheet(first);
  ss.setActiveSheet(ss.getSheetByName(DATA.sheets[0].name));
  SpreadsheetApp.getUi().alert('Klaar! Alle werkbladen en grafieken staan erin.');
}`;
}

function exportCsv() {
  const M = exportModel(ui.exportScope);
  const q = v => typeof v === 'number' ? String(v).replace('.', ',') : '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  M.sheets.forEach((sh, i) => {
    const lines = [];
    sh.blocks.forEach(b => {
      lines.push(q(b.title));
      lines.push(b.header.map(q).join(';'));
      b.rows.forEach(r => lines.push(r.map(q).join(';')));
      if (b.total) lines.push(b.total.map(q).join(';'));
      lines.push('');
    });
    setTimeout(() => dl(new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' }), slug(M.title + ' ' + sh.name) + '.csv'), i * 350);
  });
  toast(`${M.sheets.length} CSV-bestanden gedownload`);
}

    + `<a:fmtScheme name="BT"><a:fillStyleLst>${fill}${fill}${fill}</a:fillStyleLst>`
    + `<a:lnStyleLst>${ln}${ln}${ln}</a:lnStyleLst>`
    + `<a:effectStyleLst><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle></a:effectStyleLst>`
    + `<a:bgFillStyleLst>${fill}${fill}${fill}</a:bgFillStyleLst></a:fmtScheme>`
    + `</a:themeElements><a:objectDefaults/><a:extraClrSchemeLst/></a:theme>`;
}
function pptEmptyTree(tag, extra) {
  return `<p:cSld><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>`
    + `<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>`
    + `</p:spTree></p:cSld>` + (extra || '');
}
function rels(items) {
  return XMLHEAD + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
    + items.map(i => `<Relationship Id="${i.id}" Type="http://schemas.openxmlformats.org/${i.type}" Target="${i.target}"/>`).join('')
    + `</Relationships>`;
}

async function makePptx(slides, meta) {
  const zip = new JSZip();
  const media = [];

  const slideXmls = [];
  for (const sd of slides) {
    const shapes = [];
    let id = 2;
    const myRels = [{ id: 'rId1', type: 'officeDocument/2006/relationships/slideLayout', target: '../slideLayouts/slideLayout1.xml' }];
    for (const el of sd) {
      if (el.k === 'rect') shapes.push(pptRect(id++, el));
      else if (el.k === 'text') shapes.push(pptText(id++, el));
      else if (el.k === 'table') shapes.push(pptTable(id++, el));
      else if (el.k === 'image') {
        const n = media.length + 1;
        media.push(el.data);
        const rid = 'rId' + (myRels.length + 1);
        myRels.push({ id: rid, type: 'officeDocument/2006/relationships/image', target: `../media/image${n}.png` });
        shapes.push(pptPic(id++, Object.assign({ rid }, el)));
      }
    }
    slideXmls.push({ xml: pptSlideXml(shapes, meta.bg), rels: myRels });
  }

  zip.file('[Content_Types].xml', XMLHEAD
    + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`
    + `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`
    + `<Default Extension="xml" ContentType="application/xml"/>`
    + `<Default Extension="png" ContentType="image/png"/>`
    + `<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>`
    + `<Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/>`
    + `<Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/>`
    + `<Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>`
    + slideXmls.map((_, i) => `<Override PartName="/ppt/slides/slide${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>`).join('')
    + `<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>`
    + `<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>`
    + `</Types>`);

  zip.file('_rels/.rels', rels([
    { id: 'rId1', type: 'officeDocument/2006/relationships/officeDocument', target: 'ppt/presentation.xml' },
    { id: 'rId2', type: 'package/2006/relationships/metadata/core-properties', target: 'docProps/core.xml' },
    { id: 'rId3', type: 'officeDocument/2006/relationships/extended-properties', target: 'docProps/app.xml' }
  ]));

  const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  zip.file('docProps/core.xml', XMLHEAD
    + `<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">`
    + `<dc:title>${xesc(meta.title)}</dc:title><dc:creator>Barrytravelapp</dc:creator><cp:lastModifiedBy>Barrytravelapp</cp:lastModifiedBy>`
    + `<dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`);
  zip.file('docProps/app.xml', XMLHEAD
    + `<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">`
    + `<Application>Barrytravelapp</Application><Slides>${slideXmls.length}</Slides><Company>Barrytravelapp</Company></Properties>`);

  zip.file('ppt/presentation.xml', XMLHEAD
    + `<p:presentation ${NS} saveSubsetFonts="1">`
    + `<p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst>`
    + `<p:sldIdLst>${slideXmls.map((_, i) => `<p:sldId id="${256 + i}" r:id="rId${i + 2}"/>`).join('')}</p:sldIdLst>`
    + `<p:sldSz cx="${EMU(SLIDE_W)}" cy="${EMU(SLIDE_H)}"/><p:notesSz cx="${EMU(7.5)}" cy="${EMU(10)}"/></p:presentation>`);

  zip.file('ppt/_rels/presentation.xml.rels', rels([
    { id: 'rId1', type: 'officeDocument/2006/relationships/slideMaster', target: 'slideMasters/slideMaster1.xml' }
  ].concat(slideXmls.map((_, i) => ({ id: 'rId' + (i + 2), type: 'officeDocument/2006/relationships/slide', target: `slides/slide${i + 1}.xml` })))
    .concat([{ id: 'rId' + (slideXmls.length + 2), type: 'officeDocument/2006/relationships/theme', target: 'theme/theme1.xml' }])));

  zip.file('ppt/theme/theme1.xml', pptThemeXml());

  zip.file('ppt/slideMasters/slideMaster1.xml', XMLHEAD + `<p:sldMaster ${NS}>`
    + pptEmptyTree()
    + `<p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/>`
    + `<p:sldLayoutIdLst><p:sldLayoutId id="2147483649" r:id="rId1"/></p:sldLayoutIdLst></p:sldMaster>`);
  zip.file('ppt/slideMasters/_rels/slideMaster1.xml.rels', rels([
    { id: 'rId1', type: 'officeDocument/2006/relationships/slideLayout', target: '../slideLayouts/slideLayout1.xml' },
    { id: 'rId2', type: 'officeDocument/2006/relationships/theme', target: '../theme/theme1.xml' }
  ]));

  zip.file('ppt/slideLayouts/slideLayout1.xml', XMLHEAD + `<p:sldLayout ${NS} type="blank" preserve="1">`
    + pptEmptyTree() + `<p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sldLayout>`);
  zip.file('ppt/slideLayouts/_rels/slideLayout1.xml.rels', rels([
    { id: 'rId1', type: 'officeDocument/2006/relationships/slideMaster', target: '../slideMasters/slideMaster1.xml' }
  ]));

  slideXmls.forEach((s, i) => {
    zip.file(`ppt/slides/slide${i + 1}.xml`, s.xml);
    zip.file(`ppt/slides/_rels/slide${i + 1}.xml.rels`, rels(s.rels));
  });
  media.forEach((b64, i) => zip.file(`ppt/media/image${i + 1}.png`, b64, { base64: true }));

  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.presentationml.presentation', compression: 'DEFLATE' });
}

async function exportPptx() {
  const M = buildSlidesFromSelection();
  if (typeof JSZip === 'undefined') { toast('Zip-bibliotheek niet geladen — ik maak een HTML-presentatie'); return exportDeck(); }
  const BG = '0B1218', INK = 'EAF2F8', MUT = '8296A6', BLUE = '2E86FF', GREEN = '22C58B';
  const slides = [];

  for (const sd of M.slides) {
    const els = [];
    if (sd.type === 'cover') {
      els.push({ k: 'rect', x: 0, y: 0, w: 10, h: .1, fill: BLUE });
      els.push({ k: 'rect', x: 0, y: 5.2, w: 10, h: .06, fill: GREEN });
      els.push({ k: 'text', x: .7, y: .75, w: 8.6, h: .3, text: 'BARRYTRAVELAPP', size: 10.5, bold: true, color: GREEN, spc: 300 });
      els.push({ k: 'text', x: .7, y: 1.15, w: 8.6, h: 1, text: sd.title, size: 36, bold: true, color: INK });
      els.push({ k: 'text', x: .7, y: 2.05, w: 8.6, h: .4, text: sd.sub, size: 14, color: MUT });
      if (sd.kpis) sd.kpis.forEach((kp, i) => {
        els.push({ k: 'text', x: .7 + i * 2.2, y: 3.05, w: 2.1, h: .5, text: kp.v, size: 22, bold: true, color: INK });
        els.push({ k: 'text', x: .7 + i * 2.2, y: 3.55, w: 2.1, h: .3, text: kp.l.toUpperCase(), size: 8.5, color: MUT, spc: 160 });
      });
      if (sd.bullets) els.push({ k: 'text', x: .7, y: 2.85, w: 8.6, h: 2.1, text: sd.bullets, size: 13, color: INK, bullet: true, spcBef: 700 });
    } else {
      els.push({ k: 'rect', x: 0, y: 0, w: 10, h: .07, fill: BLUE });
      els.push({ k: 'text', x: .55, y: .36, w: 8.9, h: .55, text: sd.title, size: 26, bold: true, color: INK });
      if (sd.sub) els.push({ k: 'text', x: .55, y: .95, w: 8.9, h: .35, text: sd.sub, size: 12, color: MUT });
      els.push({ k: 'text', x: .55, y: 5.15, w: 4, h: .3, text: 'Barrytravelapp', size: 8.5, color: MUT, spc: 120 });

      if (sd.type === 'chart') {
        const side = (sd.bullets && sd.bullets.length) || (sd.kpis && sd.kpis.length);
        try {
          const png = await svgToPng(sd.svg, '#' + BG);
          const maxW = side ? 5.2 : 8.9, maxH = 3.4;
          const r = Math.min(maxW / png.w, maxH / png.h);
          els.push({ k: 'image', x: .55, y: 1.45, w: png.w * r, h: png.h * r, data: png.data });
        } catch (e) { }
        if (sd.bullets && sd.bullets.length) els.push({ k: 'text', x: 6.05, y: 1.5, w: 3.4, h: 3.3, text: sd.bullets, size: 11, color: INK, bullet: true, spcBef: 500 });
        else if (sd.kpis) sd.kpis.forEach((kp, i) => {
          els.push({ k: 'text', x: 6.05, y: 1.5 + i * .8, w: 3.4, h: .4, text: kp.v, size: 18, bold: true, color: INK });
          els.push({ k: 'text', x: 6.05, y: 1.93 + i * .8, w: 3.4, h: .3, text: kp.l.toUpperCase(), size: 8, color: MUT, spc: 160 });
        });
      } else if (sd.type === 'table') {
        els.push({ k: 'table', x: .55, y: 1.5, w: 8.9, header: sd.header, rows: sd.rows });
      } else if (sd.type === 'stats') {
        const cols = Math.min(sd.kpis.length, 4);
        sd.kpis.forEach((kp, i) => {
          const col = i % cols, row = Math.floor(i / cols);
          els.push({ k: 'text', x: .7 + col * 2.2, y: 1.7 + row * 1.3, w: 2, h: .5, text: kp.v, size: 24, bold: true, color: INK });
          els.push({ k: 'text', x: .7 + col * 2.2, y: 2.25 + row * 1.3, w: 2, h: .3, text: kp.l.toUpperCase(), size: 9, color: MUT, spc: 160 });
        });
      } else {
        els.push({ k: 'text', x: .55, y: 1.5, w: 8.9, h: 3.4, text: sd.bullets, size: 12, color: INK, bullet: true, spcBef: 900, lineSpc: 105000 });
      }
    }
    slides.push(els);
  }

  const blob = await makePptx(slides, { title: M.title, bg: BG });
  dl(blob, slug('barrytravelapp ' + M.title) + '.pptx');
  toast('PowerPoint gedownload');
  outMsg(`<div class="ins-item good"><div class="ins-ico">${ICONS.check}</div><div><h4>Klaar</h4><p>${M.slides.length} slides als echt .pptx-bestand. Te openen in PowerPoint, Keynote en Google Presentaties (Drive → Openen met Google Presentaties).</p></div></div>`);
}

function exportDeck() {
  const M = buildSlidesFromSelection();
  const slideHtml = M.slides.map((sd, i) => {
    let body = '';
    if (sd.type === 'cover') {
      body = `<div class="eyebrow">Barrytravelapp</div><h1>${esc(sd.title)}</h1><p class="sub">${esc(sd.sub)}</p>
        ${sd.kpis ? `<div class="kpis">${sd.kpis.map(k => `<div><b>${esc(k.v)}</b><span>${esc(k.l)}</span></div>`).join('')}</div>` : ''}
        ${sd.bullets ? `<ul>${sd.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}`;
    } else if (sd.type === 'chart') {
      body = `<h2>${esc(sd.title)}</h2><p class="sub">${esc(sd.sub)}</p>
        <div class="split"><div class="fig">${sd.svg}</div><div class="side">
          ${sd.bullets ? `<ul>${sd.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
          ${sd.kpis && sd.kpis.length ? sd.kpis.map(k => `<div class="k"><b>${esc(k.v)}</b><span>${esc(k.l)}</span></div>`).join('') : ''}
        </div></div>`;
    } else if (sd.type === 'table') {
      body = `<h2>${esc(sd.title)}</h2><p class="sub">${esc(sd.sub)}</p><table><thead><tr>${sd.header.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${sd.rows.map(r => `<tr>${r.map((c, j) => `<td class="${j ? 'r' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    } else if (sd.type === 'stats') {
      body = `<h2>${esc(sd.title)}</h2><p class="sub">${esc(sd.sub)}</p><div class="kpis">${sd.kpis.map(k => `<div><b>${esc(k.v)}</b><span>${esc(k.l)}</span></div>`).join('')}</div>`;
    } else {
      body = `<h2>${esc(sd.title)}</h2><p class="sub">${esc(sd.sub)}</p><ul class="big">${sd.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`;
    }
    return `<section class="slide" ${i ? '' : 'data-active="1"'}><div class="inner">${body}</div><div class="pg">${i + 1} / ${M.slides.length}</div></section>`;
  }).join('');

  const html = `<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(M.title)} — Barrytravelapp</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#060A0D;color:#EAF2F8;font-family:Inter,sans-serif;overflow:hidden}
body::before{content:'';position:fixed;inset:-25%;z-index:0;background:radial-gradient(38% 32% at 16% 10%,rgba(46,134,255,.3),transparent 62%),radial-gradient(34% 28% at 84% 6%,rgba(34,197,139,.24),transparent 62%),radial-gradient(46% 38% at 72% 82%,rgba(76,194,255,.18),transparent 64%);filter:blur(40px)}
.slide{position:fixed;inset:0;display:none;place-items:center;padding:5vh 6vw;z-index:1}
.slide[data-active="1"]{display:grid}
.inner{width:min(1100px,100%);background:rgba(255,255,255,.055);backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:40px 44px;box-shadow:0 40px 90px -30px rgba(0,0,0,.85);max-height:86vh;overflow:auto}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(30px,5vw,52px);letter-spacing:-.045em;margin:10px 0 8px}
h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,3.4vw,34px);letter-spacing:-.04em;margin:0 0 6px}
.sub{color:#8296A6;font-size:15px;margin:0 0 22px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#22C58B}
.kpis{display:flex;gap:34px;flex-wrap:wrap;margin-top:28px}
.kpis b{display:block;font-family:'Space Grotesk',sans-serif;font-size:30px;letter-spacing:-.04em}
.kpis span{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8296A6}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:26px;align-items:center}

@media print{.slide{display:grid!important;position:static;page-break-after:always;height:100vh}.nav{display:none}}
</style></head><body>
${slideHtml}
<div class="nav"><button onclick="go(-1)">←</button><button onclick="go(1)">→</button><button onclick="window.print()">Afdrukken / PDF</button></div>
<script>
var i=0,S=document.querySelectorAll('.slide');
function go(d){S[i].removeAttribute('data-active');i=Math.max(0,Math.min(S.length-1,i+d));S[i].setAttribute('data-active','1')}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});
document.addEventListener('click',function(e){if(!e.target.closest('.nav')&&!e.target.closest('.inner'))go(1)});
<\/script></body></html>`;
  dl(new Blob([html], { type: 'text/html' }), slug('barrytravelapp ' + M.title) + '-presentatie.html');
  toast('Presentatie gedownload — open het bestand en gebruik de pijltjestoetsen');
  outMsg( `<div class="ins-item good"><div class="ins-ico">${ICONS.check}</div><div><h4>Klaar</h4><p>${M.slides.length} slides in één HTML-bestand. Pijltjestoetsen om te bladeren, of afdrukken naar PDF. Werkt in elke browser, ook zonder internet.</p></div></div>`);
}

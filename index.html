<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barrytravelapp</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060A0D;
  --ink:#EAF2F8;
  --ink-soft:#BACADA;
  --muted:#7F94A6;
  --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.18);
  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.10);
  --glass-3:rgba(255,255,255,.16);
  --blue:#2E86FF;
  --cyan:#4CC2FF;
  --green:#22C58B;
  --mint:#7BE0A6;
  --grey:#7F94A6;
  --alert:#FF7A66;
  --blur:blur(20px) saturate(150%);
  --r:18px;
  --r-sm:11px;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 18px 40px -22px rgba(0,0,0,.9);
  --shadow-lg:0 40px 90px -30px rgba(0,0,0,.85);
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --display:'Space Grotesk', var(--sans);
  --aurora-a:rgba(46,134,255,.30);
  --aurora-b:rgba(34,197,139,.24);
  --aurora-c:rgba(76,194,255,.18);
}
[data-theme="light"]{
  --bg:#E9EFF6;
  --ink:#0B1620;
  --ink-soft:#2C3F4F;
  --muted:#5C7286;
  --line:rgba(11,22,32,.10);
  --line-2:rgba(11,22,32,.17);
  --glass:rgba(255,255,255,.60);
  --glass-2:rgba(255,255,255,.78);
  --glass-3:rgba(255,255,255,.92);
  --blue:#1668E3;
  --cyan:#128FD0;
  --green:#0F9E70;
  --mint:#3FBF8B;
  --grey:#5C7286;
  --alert:#D8543C;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 16px 34px -20px rgba(11,22,32,.35);
  --shadow-lg:0 40px 80px -30px rgba(11,22,32,.4);
  --aurora-a:rgba(46,134,255,.30);
  --aurora-b:rgba(34,197,139,.26);
  --aurora-c:rgba(120,190,255,.30);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:-25%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(38% 32% at 16% 10%, var(--aurora-a), transparent 62%),
    radial-gradient(34% 28% at 84% 6%, var(--aurora-b), transparent 62%),
    radial-gradient(46% 38% at 72% 82%, var(--aurora-c), transparent 64%),
    radial-gradient(30% 26% at 8% 76%, var(--aurora-b), transparent 60%);
  filter:blur(40px);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.14) 1px, transparent 0);
  background-size:26px 26px;mask-image:radial-gradient(70% 60% at 50% 0%, #000, transparent 75%);
}
[data-theme="light"] body::after{background-image:radial-gradient(circle at 1px 1px, rgba(11,22,32,.10) 1px, transparent 0)}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.025em;font-weight:600}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--cyan)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.eyebrow{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow)}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:40;background:var(--glass-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:13px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,var(--blue),var(--green));box-shadow:0 8px 22px -8px var(--blue)}
.mark svg{width:19px;height:19px}
.brand h1{font-size:17px;line-height:1.15}
.brand .sub{font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.01em}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.people{display:flex;align-items:center}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;
  color:#04121A;border:2px solid rgba(255,255,255,.25);margin-left:-8px;font-family:var(--mono)}
.av:first-child{margin-left:0}
.av.more{background:var(--glass-3);color:var(--ink)}
.sync{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:20px;background:var(--glass);
  border:1px solid var(--line);font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,139,.2)}
.sync[data-state="saving"] i{background:var(--cyan);box-shadow:0 0 0 3px rgba(76,194,255,.2)}
.sync[data-state="off"] i{background:var(--grey);box-shadow:none}
#saveNowBtn.is-saving svg{animation:save-pulse .6s ease-in-out infinite}
@keyframes save-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.9)}}

/* ---------- signature: kostenbalk ---------- */
.rail-zone{padding:20px 0 18px;position:relative}
.rail-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.rail-total{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.rail-total .big{font-family:var(--display);font-size:38px;font-weight:700;letter-spacing:-.045em;
  background:linear-gradient(96deg,var(--ink) 30%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.rail-total .tag{font-size:12.5px;color:var(--muted)}
.rail{position:relative;height:38px;border-radius:12px;display:flex;overflow:visible;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);padding:5px;gap:3px}
.rail-seg{height:100%;border-radius:7px;position:relative;transition:width .5s cubic-bezier(.2,.8,.2,1);min-width:2px}
.rail-seg::after{content:attr(data-l);position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;font-weight:600;color:#04121A;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden}
.rail-seg:hover::after{opacity:1}
.rail-mark{position:absolute;top:-6px;bottom:-6px;width:2px;z-index:3;transition:left .5s cubic-bezier(.2,.8,.2,1);border-radius:2px}
.rail-mark.limit{background:var(--ink)}
.rail-mark.budget{background:repeating-linear-gradient(180deg,var(--muted) 0 4px,transparent 4px 8px)}
.rail-mark span{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--ink);
  background:var(--glass-2);backdrop-filter:var(--blur);padding:2px 6px;border-radius:6px;border:1px solid var(--line)}
.rail-mark.budget span{color:var(--muted)}
.rail-legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:24px}
.rl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft)}
.rl i{width:9px;height:9px;border-radius:3px;display:block;flex:none}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:63px;z-index:30;padding:6px 0 14px}
.tabs-in{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:14px;padding:5px;box-shadow:var(--shadow)}
.tabs-in::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--muted);
  border-radius:10px;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.18s}
.tab:hover{color:var(--ink);background:var(--glass-2)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--glass-3);box-shadow:0 6px 18px -10px rgba(0,0,0,.7)}
.tab .cnt{font-family:var(--mono);font-size:10px;background:var(--glass-3);padding:1px 6px;border-radius:20px;color:var(--ink-soft)}
[data-theme="light"] .tab[aria-selected="true"]{box-shadow:0 6px 16px -10px rgba(11,22,32,.5)}

/* ---------- layout ---------- */
main{padding:6px 0 100px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:17px 19px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-h h3{font-size:15.5px}
.card-h p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.card-b{padding:16px 19px 19px}
.sec-title{display:flex;align-items:baseline;gap:12px;margin:28px 0 13px;flex-wrap:wrap}
.sec-title h2{font-size:21px}
.sec-title .hint{font-size:12.5px;color:var(--muted)}

/* ---------- kpi ---------- */
.kpi{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.04em;margin-top:8px;line-height:1.1}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:6px}
.kpi.accent{border-color:var(--line-2)}
.kpi.accent::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(46,134,255,.22),rgba(34,197,139,.14));pointer-events:none}
.kpi.accent .v{background:linear-gradient(96deg,var(--ink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi.alert::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,122,102,.20),transparent 70%);pointer-events:none}
.kpi>*{position:relative}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-sm)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--glass-2)}
td.r,th.r{text-align:right}
tfoot td{padding:11px;border-top:1px solid var(--line-2);font-weight:600;background:var(--glass-2)}
tr.sub td{color:var(--muted);font-size:12.5px}
tr.sub td:first-child{padding-left:28px}
tr.group-row td{background:var(--glass-2);font-weight:600}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;
  background:var(--glass-2);border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;display:block;flex:none}
.pill.ok{color:var(--green);border-color:rgba(34,197,139,.35);background:rgba(34,197,139,.10)}
.pill.warn{color:var(--cyan);border-color:rgba(76,194,255,.35);background:rgba(76,194,255,.10)}
.pill.bad{color:var(--alert);border-color:rgba(255,122,102,.38);background:rgba(255,122,102,.12)}
.pill.est{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:11px;
  border:1px solid var(--line);background:var(--glass-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  font-size:13px;font-weight:600;color:var(--ink);transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--glass-3);transform:translateY(-1px)}
.btn svg{width:15px;height:15px}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--green));border-color:transparent;color:#03121A;
  box-shadow:0 10px 26px -14px var(--blue)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:7px 9px}
.btn.ghost:hover{background:var(--glass-2);color:var(--ink);transform:none}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.danger:hover{border-color:var(--alert);color:var(--alert)}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:32px;height:32px;padding:0;border-radius:10px}

/* ---------- forms ---------- */
label.f{display:block}
label.f>span{display:block;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--glass);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:.18s;font-size:13.5px}
select option{background:#0B1218;color:#EAF2F8}
[data-theme="light"] select option{background:#fff;color:#0B1620}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,134,255,.2)}
input[type=number]{font-family:var(--mono)}
.field-row{display:flex;gap:10px;flex-wrap:wrap}
.field-row>*{flex:1;min-width:130px}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:4px;gap:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);transition:.18s}
.seg button[aria-pressed="true"]{background:var(--glass-3);color:var(--ink)}
.chk{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:20px;
  font-size:12.5px;cursor:pointer;user-select:none;background:var(--glass)}
.chk input{margin:0;accent-color:var(--blue)}
.chk[data-on="1"]{border-color:rgba(46,134,255,.4);background:rgba(46,134,255,.12);color:var(--ink)}

/* ---------- slider ---------- */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:20px;padding:0;border:0;
  background:linear-gradient(90deg,var(--blue),var(--green));outline:none}
input[type=range].plain{background:var(--glass-3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--ink);border:3px solid var(--bg);cursor:grab;box-shadow:0 4px 14px -4px rgba(0,0,0,.9)}
input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.1)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);cursor:grab}
input[type=range]:focus-visible{box-shadow:0 0 0 3px rgba(46,134,255,.3)}

/* ---------- budget rows ---------- */
.budget-row{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.budget-row+.budget-row{margin-top:11px}
.br-top{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.br-dot{width:11px;height:11px;border-radius:4px;flex:none}
.br-name{font-weight:600;font-size:15px;font-family:var(--display);letter-spacing:-.02em}
.br-nums{margin-left:auto;display:flex;align-items:baseline;gap:9px}
.br-nums .cur{font-family:var(--mono);font-size:15px;font-weight:600}
.br-nums .of{font-size:12px;color:var(--muted)}
.bar{height:9px;border-radius:20px;background:var(--glass-3);overflow:hidden;margin:12px 0 8px;position:relative}
.bar>i{display:block;height:100%;border-radius:20px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.br-meta{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.sublist{margin-top:13px;padding-top:10px;border-top:1px solid var(--line)}
.sublist-h{display:flex;align-items:center;gap:10px;padding:0 9px 7px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.sub-row{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;font-size:12.5px}
.sub-row:hover{background:var(--glass-2)}
.sub-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-row .nm-edit{flex:1;min-width:0;border:1px solid transparent;background:none;padding:3px 6px;border-radius:6px;
  font-size:12.5px;color:var(--ink);font-family:inherit}
.sub-row .nm-edit:hover{background:var(--glass-3);border-color:var(--line)}
.sub-row .nm-edit:focus{outline:none;background:var(--glass-3);border-color:var(--blue);box-shadow:0 0 0 2px rgba(46,134,255,.15)}
.sub-row .track{width:96px;height:5px;border-radius:20px;background:var(--glass-3);overflow:hidden;flex:none}
.sub-row .track i{display:block;height:100%;border-radius:20px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.sub-row .amt{font-family:var(--mono);font-size:12px;width:86px;text-align:right;flex:none}
.sub-row .pc{font-family:var(--mono);font-size:11px;color:var(--muted);width:38px;text-align:right;flex:none}
.sub-row .x{border:0;background:none;padding:0 4px;color:var(--muted);font-size:15px;line-height:1;border-radius:6px;flex:none}
.sub-row .x:hover{color:var(--alert);background:var(--glass-3)}
.sub-row.rest .nm{color:var(--muted);font-style:italic}
.sub-row.empty-sub .amt,.sub-row.empty-sub .nm{color:var(--muted)}
@media (max-width:560px){.sub-row .track{display:none}.sublist-h span.track{display:none}}
.sub-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 7px 4px 11px;border-radius:20px;
  background:var(--glass-2);border:1px solid var(--line);font-size:12px}
.sub-chip b{font-weight:500}
.sub-chip .x{border:0;background:none;padding:0 3px;color:var(--muted);font-size:14px;line-height:1;border-radius:50%}
.sub-chip .x:hover{color:var(--alert)}
.sub-chip .amt{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ---------- limiet ---------- */
.limit-card{position:relative;overflow:hidden}
.limit-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(46,134,255,.16),rgba(34,197,139,.10) 60%,transparent);pointer-events:none}
.limit-card>*{position:relative}
.limit-meter{height:15px;border-radius:20px;background:var(--glass-3);position:relative;overflow:hidden;margin:14px 0 9px}
.limit-meter i{position:absolute;left:0;top:0;bottom:0;border-radius:20px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.limit-meter i.booked{background:linear-gradient(90deg,var(--blue),var(--cyan));z-index:2}
.limit-meter i.est{background:linear-gradient(90deg,rgba(34,197,139,.75),rgba(123,224,166,.6));z-index:1}

/* ---------- insights ---------- */
.ins{display:grid;gap:10px}
.ins-item{display:flex;gap:12px;padding:13px 15px;background:var(--glass);backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r-sm);position:relative;overflow:hidden}
.ins-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.ins-item.up::before{background:var(--alert)}
.ins-item.good::before{background:var(--green)}
.ins-item.note::before{background:var(--cyan)}
.ins-ico{width:20px;height:20px;flex:none;margin-top:1px;color:var(--muted)}
.ins-item h4{font-size:13.5px;font-family:var(--sans);font-weight:600;margin-bottom:3px}
.ins-item p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,8,12,.55);backdrop-filter:blur(4px);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim[data-open="1"]{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:61;display:flex;flex-direction:column;
  background:var(--glass-2);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
  border-left:1px solid var(--line-2);box-shadow:var(--shadow-lg);transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
[data-theme="dark"] .drawer{background:rgba(10,16,22,.82)}
[data-theme="light"] .drawer{background:rgba(255,255,255,.86)}
.drawer[data-open="1"]{transform:none}
.drawer-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.drawer-h h3{font-size:17px}
.drawer-b{padding:20px;overflow-y:auto;flex:1;display:grid;gap:15px;align-content:start}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px}

/* ---------- misc ---------- */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty h4{font-size:16px;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 0 14px;font-size:13px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:80;opacity:0;pointer-events:none;
  transition:.25s;max-width:90vw;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:500;
  background:var(--glass-3);backdrop-filter:blur(24px);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);color:var(--ink)}
[data-theme="dark"] .toast{background:rgba(14,22,30,.9)}
.toast[data-on="1"]{opacity:1;transform:translate(-50%,0)}
.code-box{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;
  font-family:var(--mono);font-size:11.5px;line-height:1.55;max-height:280px;overflow:auto;white-space:pre;color:var(--ink-soft)}
.steps{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:11px;font-size:13px;color:var(--ink-soft);align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--green));color:#03121A;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;font-weight:600}
.divider{height:1px;background:var(--line);margin:20px 0}
.chart-svg{width:100%;height:auto;display:block}
.tip{font-size:12px;color:var(--muted);line-height:1.5}
.hl{color:var(--ink);font-weight:600}
.flex{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.flex-end{margin-left:auto}
.mt{margin-top:14px}
.mb{margin-bottom:14px}

/* ---------- kaart ---------- */
.map-shell{position:relative;z-index:0;isolation:isolate;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--glass);height:440px}
#map{position:absolute;inset:0;background:transparent}
.leaflet-container{background:rgba(8,14,20,.6);font-family:var(--sans)}
[data-theme="light"] .leaflet-container{background:#dfe8f0}
.leaflet-control-attribution{background:var(--glass-2)!important;color:var(--muted)!important;font-size:9.5px!important;backdrop-filter:blur(10px)}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar a{background:var(--glass-3)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:rgba(12,20,28,.94);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-lg)}
[data-theme="light"] .leaflet-popup-content-wrapper,[data-theme="light"] .leaflet-popup-tip{background:rgba(255,255,255,.96)}
.leaflet-popup-content{margin:11px 13px;font-size:12.5px}
.leaflet-popup-content b{font-family:var(--display);font-size:14px}
.mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;
  font-weight:600;color:#03121A;background:linear-gradient(140deg,var(--blue),var(--green));
  box-shadow:0 0 0 3px rgba(255,255,255,.22),0 6px 16px -6px rgba(0,0,0,.8)}
.mk.mk-done{background:linear-gradient(140deg,#22C58B,#17A34F);color:#fff}
.mk.mk-sm{width:20px;height:20px;font-size:10px}
.map-shell.mini{height:280px}
/* ---------- statische satellietafbeelding (Route in het kort) ---------- */
.static-map{position:relative;width:100%;border-radius:var(--r);overflow:hidden;background:var(--stone-2);
  isolation:isolate;line-height:0}
.static-map img{display:block;width:100%;height:auto;background:var(--stone-2)}
.static-map-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.static-map-fallback{display:none;position:absolute;inset:0;padding:16px;font-size:12px;color:var(--muted);
  background:var(--stone-2);overflow:auto}
.static-map.img-failed img,.static-map.img-failed .static-map-overlay{display:none}
.static-map.img-failed .static-map-fallback{display:block}
.static-map.img-failed{background:var(--stone-2)}
.map-overlay{position:absolute;left:12px;top:12px;z-index:500;display:flex;gap:7px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.map-badge{padding:7px 11px;border-radius:11px;background:var(--glass-2);backdrop-filter:blur(16px);border:1px solid var(--line);
  font-size:11.5px;font-family:var(--mono);color:var(--ink);box-shadow:var(--shadow)}
.map-badge b{color:var(--cyan)}
.map-hint{position:absolute;left:12px;bottom:12px;z-index:500;padding:6px 10px;border-radius:10px;background:var(--glass-2);
  backdrop-filter:blur(16px);border:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.map-tools{position:absolute;right:12px;bottom:38px;z-index:500;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.map-tool-btn{padding:7px 12px;border-radius:11px;background:var(--glass-2);backdrop-filter:blur(16px);border:1px solid var(--line);
  font-size:11.5px;font-weight:600;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;transition:.15s;white-space:nowrap}
.map-tool-btn:hover{background:var(--glass-3);border-color:var(--line-2)}
.map-tool-btn:disabled{opacity:.55;cursor:default}
.map-activate{position:absolute;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:24px;background:rgba(6,10,13,.4);backdrop-filter:blur(1px);cursor:pointer}
.map-activate span{padding:9px 16px;border-radius:20px;background:rgba(15,22,29,.88);color:#fff;font-size:12.5px;font-weight:600;
  border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 30px -12px rgba(0,0,0,.8)}
.leaflet-control-layers{background:var(--glass-2)!important;backdrop-filter:blur(16px);border:1px solid var(--line)!important;
  color:var(--ink)!important;border-radius:10px!important;box-shadow:var(--shadow)!important}
.leaflet-control-layers-toggle{filter:var(--layers-icon-filter,none)}
[data-theme="dark"] .leaflet-control-layers-toggle{filter:invert(1)}
.leaflet-control-layers label{color:var(--ink)!important;font-size:12.5px}
.leaflet-control-scale-line{background:var(--glass-2)!important;border-color:var(--ink-soft)!important;color:var(--ink)!important;
  backdrop-filter:blur(10px)}
.adding .leaflet-container{cursor:crosshair}

/* ---------- stops ---------- */
.stop{display:flex;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--glass);align-items:flex-start;transition:.15s}
.stop.is-visited{background:rgba(34,197,139,.07);border-color:rgba(34,197,139,.3)}
.stop+.stop{margin-top:9px}
.stop-n{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--mono);
  font-size:11px;font-weight:600;color:#03121A;background:linear-gradient(140deg,var(--blue),var(--green));
  border:0;cursor:pointer;transition:.15s;padding:0}
.stop-n:hover{filter:brightness(1.1);transform:scale(1.06)}
.stop.is-visited .stop-n{background:linear-gradient(140deg,#22C58B,#17A34F);color:#fff}
.stop.is-visited .stop-n svg{width:13px;height:13px}
.stop-main{flex:1;min-width:0}
.stop-main h4{font-size:14.5px;font-family:var(--display)}
.leg{display:flex;align-items:center;gap:8px;margin:7px 0 9px 12px;padding-left:14px;border-left:2px dashed var(--line-2);
  font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.search-res{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--glass-2)}
.search-res button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;font-size:12.5px;color:var(--ink)}
.search-res button:hover{background:var(--glass-3)}
.search-res button+button{border-top:1px solid var(--line)}

/* ---------- start ---------- */
.hero{position:relative;overflow:hidden;padding:26px 26px 24px;border-radius:22px;border:1px solid var(--line-2);
  background:var(--glass);backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,rgba(46,134,255,.22),rgba(34,197,139,.14) 55%,transparent);pointer-events:none}
.hero>*{position:relative}
.hero h2{font-size:32px;letter-spacing:-.045em;margin:8px 0 6px}
.hero .lede{font-size:14px;color:var(--ink-soft);max-width:64ch}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:20px}
.hero-stat .n{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-.04em}
.hero-stat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.todo{display:grid;gap:8px}
.tasklist{display:grid;gap:2px}
.task{display:flex;align-items:flex-start;gap:11px;padding:9px 10px;border-radius:10px;transition:.15s}
.task:hover{background:var(--glass-2)}
.task .box{width:19px;height:19px;border-radius:6px;flex:none;margin-top:1px;border:1.5px solid var(--line-2);
  background:var(--glass-2);display:grid;place-items:center;cursor:pointer;transition:.15s}
.task .box svg{width:12px;height:12px;opacity:0;color:#03121A;transition:.15s}
.task[data-done="1"] .box{background:linear-gradient(140deg,var(--blue),var(--green));border-color:transparent}
.task[data-done="1"] .box svg{opacity:1}
.task .txt{flex:1;min-width:0;font-size:13.5px;line-height:1.45;cursor:pointer}
.task[data-done="1"] .txt{color:var(--muted);text-decoration:line-through}
.task .x{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:1px 6px;border-radius:7px;
  opacity:0;flex:none;transition:.15s}
.task:hover .x{opacity:1}
.task .x:hover{color:var(--alert);background:var(--glass-3)}
.task-add{display:flex;gap:9px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.task-add input{flex:1}
.progress-line{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.progress-line .track{flex:1;height:7px;border-radius:20px;background:var(--glass-3);overflow:hidden}
.progress-line .track i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .4s cubic-bezier(.2,.8,.2,1)}

/* ---------- info / blog ---------- */
.post-card{scroll-margin-top:150px}
.post-date{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.post-body{font-size:13.5px;line-height:1.65;color:var(--ink-soft)}
.post-body p{margin:0 0 11px}
.post-body p:last-child{margin-bottom:0}
.checklist-box{margin-top:16px;padding:14px 15px;border-radius:var(--r-sm);background:var(--glass-2);border:1px solid var(--line)}
.cl-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.cl-title{flex:1;min-width:0;border:0;background:none;font-family:var(--display);font-size:14.5px;font-weight:600;
  color:var(--ink);padding:3px 2px;border-radius:6px;border-bottom:1.5px solid transparent}
.cl-title:hover{background:var(--glass-3)}
.cl-title:focus{outline:none;border-bottom-color:var(--blue);background:var(--glass-3)}
.cl-frac{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;flex:none}
.checklist-box .progress-line{margin-bottom:9px}
.checklist-box .track{height:5px}
.checklist-box .task-add{margin-top:9px;padding-top:0;border-top:0}
.post-empty{text-align:center;padding:30px 16px}
.tag-filter-pill{display:inline-flex;align-items:center;padding:6px 13px;border-radius:20px;font-size:11.5px;font-weight:600;
  background:var(--glass);border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;transition:.15s}
.tag-filter-pill:hover{border-color:var(--line-2);color:var(--ink)}
.summary-cl-row{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 9px;border-radius:10px;cursor:pointer}
.summary-cl-row:hover{background:var(--glass-2)}
.summary-cl-top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.summary-cl-top .nm{font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary-cl-top .src{font-size:10.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.summary-cl-track{height:5px;border-radius:20px;background:var(--glass-3);overflow:hidden}
.summary-cl-track i{display:block;height:100%;border-radius:20px}

/* ---------- agenda / kalender ---------- */
.cal-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal-nav{display:inline-flex;align-items:center;gap:4px}
.cal-title{font-family:var(--display);font-size:16px;font-weight:700;min-width:150px;text-align:center}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.cal-dow span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{position:relative;min-height:68px;border-radius:10px;padding:5px 6px 9px;background:var(--glass);
  border:1px solid var(--line);cursor:pointer;transition:.15s;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.cal-day:hover{background:var(--glass-2);border-color:var(--line-2)}
.cal-day.outside{opacity:.32}
.cal-day.is-today{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.cal-day .dnum{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink)}
.cal-day .dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.cal-day .dot{width:6px;height:6px;border-radius:50%;flex:none}
.cal-day .dot.is-deadline{border-radius:2px}
.cal-day .evt-label{font-size:9px;line-height:1.3;margin-top:3px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:var(--ink-soft)}
.cal-bars{position:absolute;left:6px;right:6px;bottom:5px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.cal-bar{height:6px;margin:0 -6px;opacity:.9}
.cal-bar.cap-start{margin-left:0;border-top-left-radius:4px;border-bottom-left-radius:4px}
.cal-bar.cap-end{margin-right:0;border-top-right-radius:4px;border-bottom-right-radius:4px}
.cal-year{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cal-mini{border:1px solid var(--line);border-radius:12px;padding:9px;background:var(--glass)}
.cal-mini-h{font-family:var(--display);font-size:12.5px;font-weight:600;margin-bottom:7px;cursor:pointer;
  border:0;background:none;color:var(--ink);padding:0;width:100%;text-align:left}
.cal-mini-h:hover{color:var(--blue)}
.cal-mini-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.cal-mini-dow span{font-family:var(--mono);font-size:6.5px;color:var(--muted);text-align:center}
.cal-mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-mini-day{aspect-ratio:1;border-radius:3px;font-size:7.5px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-family:var(--mono)}
.cal-mini-day.has-event{background:var(--glass-3);color:var(--ink);font-weight:600}
.cal-mini-day.has-period{color:#fff;font-weight:600}
.cal-mini-day.outside{opacity:0}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft)}
.cal-legend i{width:8px;height:8px;border-radius:50%;flex:none}
.cal-legend i.bar{width:16px;height:6px;border-radius:3px}
.event-row{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--glass);align-items:flex-start}
.event-row+.event-row{margin-top:9px}
.event-dot{width:11px;height:11px;border-radius:4px;flex:none;margin-top:3px}
.event-main{flex:1;min-width:0}
.event-main h4{font-size:14px;font-family:var(--display);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.event-main .tip{margin-top:2px}
@media (max-width:768px){.cal-year{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){
  .cal-day{min-height:44px;padding:4px}
  .cal-day .evt-label{display:none}
  .cal-year{grid-template-columns:1fr}
  .cal-title{min-width:0}
}

/* ---------- presentatie-kiezer ---------- */
.pick-groups{display:grid;gap:14px}
.pick-group{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--glass)}
.pick-group-h{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--glass-2);cursor:pointer;user-select:none}
.pick-group-h input{width:17px;height:17px;accent-color:var(--blue);flex:none}
.pick-group-h strong{font-family:var(--display);font-size:13.5px;font-weight:600}
.pick-rows{display:grid}
.pick-row{display:flex;align-items:center;gap:11px;padding:9px 13px;border-top:1px solid var(--line);cursor:pointer}
.pick-row:hover{background:var(--glass-2)}
.pick-row input{width:16px;height:16px;accent-color:var(--blue);flex:none}
.pick-row.is-disabled{opacity:.45;cursor:not-allowed}
.pick-prev{flex:none;width:44px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:7px;
  background:var(--glass-3);overflow:hidden}
.pick-prev:empty{background:none}
.pick-prev svg{max-width:100%;max-height:100%}
.pick-label{flex:1;min-width:0;font-size:13px}

/* ---------- filter/sorteerbalk ---------- */
.filterbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filterbar .f{flex:1;min-width:150px}
.filterbar .f-sm{flex:0 0 auto;min-width:130px}
.filterbar .count{font-size:12px;color:var(--muted);white-space:nowrap;padding-bottom:9px}
@media (max-width:560px){.filterbar{gap:8px}.filterbar .f,.filterbar .f-sm{flex:1 1 100%;min-width:0}}
.todo-item{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-soft)}
.todo-item i{width:16px;height:16px;border-radius:5px;flex:none;margin-top:2px;border:1px solid var(--line-2);background:var(--glass-2)}
.todo-item.done i{background:linear-gradient(140deg,var(--blue),var(--green));border-color:transparent}

@media (max-width:960px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.g-2-1{grid-template-columns:1fr}.rail-total .big{font-size:30px}}
@media (max-width:560px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero h2{font-size:25px}
  .hero{padding:20px 18px 18px}
  .hero-stats{gap:16px 22px}
  .map-shell{height:300px}
  .map-overlay,.map-hint{display:none}
  .wrap{padding:0 12px}
  nav.tabs{position:static}
  header.top{position:static}
  .card-h{padding:14px 14px 0}
  .card-b{padding:13px 14px 15px}
  .kpi{padding:13px 14px}
  .kpi .v{font-size:21px}
  .sec-title{margin:22px 0 11px}
  .sec-title h2{font-size:18px}
  .top-in{gap:9px}

const ORDER = { people: 'sort', categories: 'sort', subcategories: 'sort', route_stops: 'sort', todos: 'sort',
  posts: 'sort', checklists: 'sort', checklist_items: 'sort', events: 'event_date', expenses: 'created_at' };
const MEMBER_WRITES = ['expenses', 'expense_people', 'todos', 'checklist_items'];   // wat een lid mag schrijven
const TICK_ONLY = ['todos', 'checklist_items'];                                     // daar mag een lid alleen vinken

const keyOf = (t, r) => t === 'expense_people' ? r.expense_id + ':' + r.person_id : r.id;
const orNull = v => (v === '' || v === undefined || v === null) ? null : v;
const numOrNull = v => (v === '' || v === undefined || v === null || isNaN(Number(v))) ? null : Number(v);
const canWrite = t => ROLE === 'admin' || MEMBER_WRITES.includes(t);
const canEditExpense = e => ROLE === 'admin' || !e.createdBy || e.createdBy === MY_USER;

function migrate(p) {
  if (!p || !p.cats || !p.people) return null;
  if (!p.route) p.route = seed().route;
  if (!p.country) p.country = 'Madagaskar';
  if (!p.todos) p.todos = seed().todos;
  if (!p.posts) p.posts = seed().posts;
  p.posts.forEach(post => { if (!post.tags) post.tags = []; if (!post.people) post.people = []; });
  if (!p.events) p.events = [];
  if (!p.trip.mapLayer) p.trip.mapLayer = 'Satelliet';
  return p;
}

/* ---------- 1. VERTALEN: app-state S  <->  database-rijen ---------- */
function toRows(S, T) {
  const r = {};
  r.trips = [{
    id: T, name: S.trip.name || '', dest: S.trip.dest || '', country: S.country || '',
    start_date: orNull(S.trip.start), end_date: orNull(S.trip.end), currency: S.trip.currency || 'EUR',
    buffer_pct: Number(S.trip.buffer) || 0, scenario_pct: Number(S.trip.scenario) || 0,
    limit_total: Number(S.trip.limit) || 0, limit_mode: S.trip.limitMode || 'pp', map_layer: S.trip.mapLayer || 'Satelliet'
  }];
  r.people = S.people.map((p, i) => ({ id: p.id, trip_id: T, name: p.name, color: p.color, sort: i }));
  r.categories = S.cats.map((c, i) => ({ id: c.id, trip_id: T, name: c.name, color: c.color, budget: Number(c.budget) || 0, sort: i }));
  r.subcategories = S.cats.flatMap(c => c.subs.map((s, i) => ({ id: s.id, trip_id: T, category_id: c.id, name: s.name, sort: i })));
  r.route_stops = (S.route || []).map((s, i) => ({
    id: s.id, trip_id: T, name: s.name, lat: Number(s.lat), lng: Number(s.lng), nights: Number(s.nights) || 0,
    mode: s.mode || '4x4', note: s.note || '', km: numOrNull(s.km), hours: numOrNull(s.hours), visited: !!s.visited, sort: i
  }));
  r.todos = (S.todos || []).map((t, i) => ({ id: t.id, trip_id: T, text: t.text, done: !!t.done, sort: i }));
  r.posts = (S.posts || []).map((p, i) => ({
    id: p.id, trip_id: T, post_date: orNull(p.date), title: p.title, body: p.body || '',
    tags: p.tags || [], people: p.people || [], sort: i
  }));
  r.checklists = (S.posts || []).flatMap(p => (p.checklists || []).map((c, i) => ({ id: c.id, trip_id: T, post_id: p.id, title: c.title, sort: i })));
  r.checklist_items = (S.posts || []).flatMap(p => (p.checklists || []).flatMap(c =>
    c.items.map((it, i) => ({ id: it.id, trip_id: T, checklist_id: c.id, text: it.text, done: !!it.done, sort: i }))));
  r.events = (S.events || []).map(e => ({
    id: e.id, trip_id: T, title: e.title, description: e.desc || '', event_date: e.date,
    end_date: orNull(e.endDate), deadline: !!e.deadline, color: e.color || '#2E86FF'
  }));
  r.expenses = S.expenses.map(e => ({
    id: e.id, trip_id: T, description: e.desc, note: e.note || '', category_id: e.cat || null,
    subcategory_id: e.sub || null, amount: Number(e.amount) || 0, unit: e.unit || 'total', qty: Number(e.qty) || 1,
    kind: e.kind === 'booked' ? 'booked' : 'est', payer_id: e.payer || null, expense_date: orNull(e.date),
    created_by: e.createdBy || MY_USER
  }));
  r.expense_people = S.expenses.flatMap(e => (e.who || []).map(pid => ({ expense_id: e.id, person_id: pid, trip_id: T })));
  return r;
}

function fromRows(R) {
  const t = R.trips[0];
  const subsOf = {}; R.subcategories.forEach(s => (subsOf[s.category_id] = subsOf[s.category_id] || []).push({ id: s.id, name: s.name }));
  const whoOf = {}; R.expense_people.forEach(x => (whoOf[x.expense_id] = whoOf[x.expense_id] || []).push(x.person_id));
  const listsOf = {}; R.checklists.forEach(c => (listsOf[c.post_id] = listsOf[c.post_id] || []).push({ id: c.id, title: c.title, items: [] }));
  const listById = {}; Object.values(listsOf).forEach(a => a.forEach(c => (listById[c.id] = c)));
  R.checklist_items.forEach(it => { const c = listById[it.checklist_id]; if (c) c.items.push({ id: it.id, text: it.text, done: !!it.done }); });
  return migrate({
    trip: {
      name: t.name, dest: t.dest, start: t.start_date || '', end: t.end_date || '', currency: t.currency,
      buffer: Number(t.buffer_pct), scenario: Number(t.scenario_pct), limit: Number(t.limit_total),
      limitMode: t.limit_mode, mapLayer: t.map_layer
    },
    country: t.country,
    people: R.people.map(p => ({ id: p.id, name: p.name, color: p.color })),
    cats: R.categories.map(c => ({ id: c.id, name: c.name, color: c.color, budget: Number(c.budget), subs: subsOf[c.id] || [] })),
    route: R.route_stops.map(s => ({
      id: s.id, name: s.name, lat: s.lat, lng: s.lng, nights: s.nights, mode: s.mode, note: s.note,
      km: s.km, hours: s.hours, visited: !!s.visited
    })),
    todos: R.todos.map(x => ({ id: x.id, text: x.text, done: !!x.done })),
    posts: R.posts.map(p => ({
      id: p.id, date: p.post_date || '', title: p.title, body: p.body, tags: p.tags || [], people: p.people || [],
      checklists: listsOf[p.id] || []
    })),
    events: R.events.map(e => ({
      id: e.id, title: e.title, desc: e.description, date: e.event_date, endDate: e.end_date, deadline: !!e.deadline, color: e.color
    })),
    expenses: R.expenses.map(e => ({
      id: e.id, desc: e.description, note: e.note, cat: e.category_id, sub: e.subcategory_id,
      amount: Number(e.amount), unit: e.unit, qty: Number(e.qty), kind: e.kind, payer: e.payer_id,
      date: e.expense_date || '', who: whoOf[e.id] || [], createdBy: e.created_by
    }))
  });
}

/* ---------- 2. SNAPSHOTS EN VERSCHIL ---------- */
const snapTable = (t, rows) => new Map(rows.map(r => [keyOf(t, r), JSON.stringify(r)]));
const snapAll = rows => { const m = {}; TABLES.forEach(t => (m[t] = snapTable(t, rows[t]))); return m; };
function sameTable(t, rows, snap) {
  if (rows.length !== snap.size) return false;
  return rows.every(r => snap.get(keyOf(t, r)) === JSON.stringify(r));
}
function diffRows(cur, last) {
  const ups = {}, dels = {};
  TABLES.forEach(t => {
    ups[t] = []; dels[t] = [];
    if (!canWrite(t)) return;
    const seen = new Set();
    cur[t].forEach(r => { const k = keyOf(t, r); seen.add(k); if (last[t].get(k) !== JSON.stringify(r)) ups[t].push(r); });
    dels[t] = [...last[t].keys()].filter(k => !seen.has(k));
    if (ROLE !== 'admin' && TICK_ONLY.includes(t)) {            // lid: alleen bestaande vinkjes wijzigen
      ups[t] = ups[t].filter(r => last[t].has(keyOf(t, r)));
      dels[t] = [];
    }
  });
  return { ups, dels };
}

/* ---------- 3. NAAR SUPABASE SCHRIJVEN ---------- */
async function runUpserts(t, rows) {
  if (!rows.length) return;
  if (t === 'trips') {                                              // trips: alleen UPDATE (er is geen insert-recht)
    for (const r of rows) { const { id, ...rest } = r; const { error } = await sb.from(t).update(rest).eq('id', id); if (error) throw error; }
    return;
  }
  if (ROLE !== 'admin' && TICK_ONLY.includes(t)) {                  // lid: alleen het vinkje bijwerken
    for (const r of rows) { const { error } = await sb.from(t).update({ done: r.done }).eq('id', r.id); if (error) throw error; }
    return;
  }
  if (t === 'expense_people') {
    const { error } = await sb.from(t).upsert(rows, { onConflict: 'expense_id,person_id', ignoreDuplicates: true });
    if (error) throw error; return;
  }
  for (let i = 0; i < rows.length; i += 200) {
    const { error } = await sb.from(t).upsert(rows.slice(i, i + 200), { onConflict: 'id' });
    if (error) throw error;
  }
}
async function runDeletes(t, keys) {
  if (!keys.length) return;
  if (t === 'expense_people') {
    for (const k of keys) { const [e, p] = k.split(':'); const { error } = await sb.from(t).delete().eq('expense_id', e).eq('person_id', p); if (error) throw error; }
    return;
  }
  for (let i = 0; i < keys.length; i += 100) {
    const { error } = await sb.from(t).delete().in('id', keys.slice(i, i + 100)); if (error) throw error;
  }
}

function setSync(state, txt) {
  const c = document.getElementById('syncChip'); if (!c) return;
  c.dataset.state = state; document.getElementById('syncTxt').textContent = txt;
}
function stampTxt(t) {
  const time = t ? new Date(t).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) : '';
  return (ROLE === 'admin' ? 'Beheerder' : 'Lid') + (t ? ' · opgeslagen ' + time : ' · online');
}

let saveInFlight = null;
async function doSave() {
  if (!TRIP_ID || !lastRows) return false;
  if (saveInFlight) return saveInFlight;
  saveInFlight = (async () => {
    await null;            // zorgt dat 'saveInFlight' eerst gezet is, ook als er niets te doen valt
    let ok = true;
    try {
      while (true) {
        const v = editVersion;
        const cur = toRows(S, TRIP_ID);
        const d = diffRows(cur, lastRows);
        const n = TABLES.reduce((a, t) => a + d.ups[t].length + d.dels[t].length, 0);
        if (n === 0) { if (v === editVersion) sync.dirty = false; break; }
        sync.busy = true; setSync('saving', 'Opslaan…');
        for (const t of TABLES) await runUpserts(t, d.ups[t]);                   // ouders eerst
        for (const t of [...TABLES].reverse()) await runDeletes(t, d.dels[t]);    // kinderen eerst
        TABLES.forEach(t => { if (canWrite(t)) lastRows[t] = snapTable(t, cur[t]); });
        quietUntil = Date.now() + 2500;
        sync.stamp = Date.now(); sync.on = true;
        setSync('on', stampTxt(sync.stamp));
        if (v === editVersion) { sync.dirty = false; break; }                    // geen nieuwe edits tijdens het opslaan
      }
    } catch (e) { ok = false; await handleSaveError(e); }
    sync.busy = false; saveInFlight = null;
    return ok;
  })();
  return saveInFlight;
}
async function handleSaveError(e) {
  console.error('Opslaan mislukt:', e);
  const msg = (e && (e.message || e.details)) || String(e);
  const denied = e && (e.code === '42501' || /row-level security|permission denied|Alleen de beheerder/i.test(msg));
  if (denied) {
    toast('Geen rechten voor deze wijziging — je scherm wordt teruggezet.');
    sync.dirty = false;
    await reloadFromServer();
  } else {
    setSync('off', 'Geen verbinding — probeert opnieuw');
    clearTimeout(save._t); save._t = setTimeout(doSave, 5000);
  }
}
async function save() {
  editVersion++; sync.dirty = true;
  clearTimeout(save._t);
  save._t = setTimeout(() => { doSave(); }, 700);
}
async function saveNow() {
  clearTimeout(save._t);
  const btn = document.getElementById('saveNowBtn');
  if (btn) btn.classList.add('is-saving');
  const ok = await doSave();
  if (btn) btn.classList.remove('is-saving');
  toast(ok ? 'Opgeslagen in de database' : 'Opslaan is niet gelukt — zie de melding bij het bolletje');
  return ok;
}

/* ---------- 4. UIT SUPABASE LEZEN ---------- */
async function fetchRows() {
  const res = await Promise.all(TABLES.map(t => {
    let q = sb.from(t).select('*');
    q = t === 'trips' ? q.eq('id', TRIP_ID) : q.eq('trip_id', TRIP_ID);
    if (ORDER[t]) q = q.order(ORDER[t], { ascending: true });
    return q;
  }));
  const out = {};
  res.forEach((r, i) => { if (r.error) throw r.error; out[TABLES[i]] = r.data || []; });
  return out;
}
function applyRows(R) {
  S = fromRows(R);
  lastRows = snapAll(toRows(S, TRIP_ID));
  sync.stamp = Date.now(); sync.on = true; sync.dirty = false;
  setSync('on', stampTxt(sync.stamp));
}
async function reloadFromServer() { applyRows(await fetchRows()); render(); }

async function pull(announce) {
  if (!TRIP_ID) return false;
  if (!announce && (sync.dirty || sync.busy)) return false;      // nooit eigen, nog niet opgeslagen werk overschrijven
  if (announce && sync.dirty) await doSave();
  try {
    const R = await fetchRows();
    const S2 = fromRows(R);
    const rows2 = toRows(S2, TRIP_ID);
    if (TABLES.every(t => sameTable(t, rows2[t], lastRows[t]))) {
      setSync('on', stampTxt(sync.stamp)); if (announce) toast('Je hebt al de nieuwste versie'); return false;
    }
    if (sync.dirty || sync.busy) return false;                  // intussen zelf iets gewijzigd
    S = S2; lastRows = snapAll(rows2); sync.stamp = Date.now(); sync.on = true;
    setSync('on', stampTxt(sync.stamp));
    if (announce) { render(); toast('Bijgewerkt met de nieuwste versie'); }
    return true;
  } catch (e) {
    console.error(e); setSync('off', 'Geen verbinding'); if (announce) toast('Ophalen mislukt — controleer je verbinding');
    return false;
  }
}

/* ---------- 5. REALTIME: wijzigingen van anderen verschijnen vanzelf ---------- */
let remoteTimer = null;
function onRemoteChange() {
  if (Date.now() < quietUntil) return;                          // echo van onze eigen opslag
  clearTimeout(remoteTimer);
  remoteTimer = setTimeout(async () => {
    const changed = await pull(false);
    if (changed) { render(); toast('Bijgewerkt: iemand anders heeft iets gewijzigd'); }
  }, 600);
}
function startRealtime() {
  if (window.__rt) return;
  const ch = sb.channel('reis-' + TRIP_ID);
  TABLES.forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, onRemoteChange));
  ch.subscribe(); window.__rt = ch;
}

/* ---------- 6. IMPORT VAN BESTAANDE DATA (eenmalig, door de beheerder) ---------- */
function convertLegacy(p) {
  p = migrate(JSON.parse(JSON.stringify(p)));
  const map = new Map();
  const nid = old => { if (!old) return null; if (!map.has(old)) map.set(old, newId()); return map.get(old); };
  p.people.forEach(x => (x.id = nid(x.id)));
  p.cats.forEach(c => { c.id = nid(c.id); c.subs.forEach(s => (s.id = nid(s.id))); });
  p.route.forEach(r => (r.id = nid(r.id)));
  p.todos.forEach(t => (t.id = nid(t.id)));
  p.posts.forEach(po => {
    po.id = nid(po.id); po.people = (po.people || []).map(nid);
    (po.checklists || []).forEach(cl => { cl.id = nid(cl.id); cl.items.forEach(i => (i.id = nid(i.id))); });
  });
  p.events.forEach(ev => (ev.id = nid(ev.id)));
  p.expenses.forEach(e => {
    e.id = nid(e.id); e.cat = nid(e.cat); e.sub = e.sub ? nid(e.sub) : null; e.payer = e.payer ? nid(e.payer) : null;
    e.who = (e.who || []).map(nid); delete e.createdBy;
  });
  delete p._t;
  return p;
}
async function importState(raw) {
  S = convertLegacy(raw);
  lastRows = {}; TABLES.forEach(t => (lastRows[t] = new Map()));
  lastRows.trips = new Map([[TRIP_ID, '']]);                    // de reis-rij bestaat al, de rest is nieuw
  sync.dirty = true; editVersion++;
  hideAuth(); render();
  const ok = await doSave();
  if (ok) { startRealtime(); toast('Import gelukt: alles staat nu in de database'); }
  return ok;
}

/* ---------- 7. INLOGGEN ---------- */
function showAuth(html) {
  const o = document.getElementById('authOverlay'); if (!o) return;
  document.getElementById('authBox').innerHTML = html; o.dataset.open = '1';
}
function hideAuth() { const o = document.getElementById('authOverlay'); if (o) o.dataset.open = '0'; }
function loginHtml(msg) {
  return `<h2>Barrytravelapp</h2><p class="tip">Log in met het account dat je van de beheerder hebt gekregen.</p>
    <form id="loginForm" class="grid" style="gap:12px;margin-top:14px">
      <label class="f"><span>E-mail</span><input type="email" id="loginEmail" autocomplete="username" required></label>
      <label class="f"><span>Wachtwoord</span><input type="password" id="loginPw" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Inloggen</button>
      <p class="tip" id="loginMsg" style="color:var(--alert);min-height:1.2em">${msg || ''}</p>
    </form>`;
}
function importHtml() {
  return `<h2>De database is nog leeg</h2>
    <p class="tip">Je bent ingelogd als beheerder. Kies hoe je de reis vult. Dit doe je maar één keer.</p>
    <div class="grid" style="gap:10px;margin-top:14px">
      <button class="btn primary" id="importSeed">Beginnen met de voorbeeld-begroting</button>
      <label class="btn" style="cursor:pointer">Eigen back-upbestand (.json) kiezen
        <input type="file" id="importFile" accept="application/json" style="display:none"></label>
      <p class="tip" id="importMsg" style="min-height:1.2em"></p>
    </div>`;
}
async function startApp(user) {
  try {
    MY_USER = user.id;
    const { data: mem, error } = await sb.from('members').select('trip_id, role, person_id').eq('user_id', user.id).limit(1);
    if (error) throw error;
    if (!mem || !mem.length) { showAuth(loginHtml('Dit account is nog niet gekoppeld aan de reis. Vraag de beheerder om je toe te voegen.')); return; }
    TRIP_ID = mem[0].trip_id; ROLE = mem[0].role; MY_PERSON = mem[0].person_id;
    document.body.dataset.role = ROLE;
    const R = await fetchRows();
    if (!R.trips.length) { showAuth(loginHtml('De reis kon niet worden gevonden.')); return; }
    if (!R.people.length && !R.categories.length && !R.expenses.length) {
      if (ROLE === 'admin') { showAuth(importHtml()); return; }
      showAuth(loginHtml('De beheerder heeft de reis nog niet gevuld. Probeer het later opnieuw.')); return;
    }
    applyRows(R); hideAuth(); render(); startRealtime();
  } catch (e) { console.error(e); showAuth(loginHtml('Er ging iets mis: ' + ((e && e.message) || e))); }
}
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'loginForm') return;
  ev.preventDefault();
  const msg = document.getElementById('loginMsg'); msg.textContent = 'Bezig met inloggen…'; msg.style.color = 'var(--muted)';
  const { data, error } = await sb.auth.signInWithPassword({
    email: document.getElementById('loginEmail').value.trim(), password: document.getElementById('loginPw').value
  });
  if (error) { msg.style.color = 'var(--alert)'; msg.textContent = 'Inloggen mislukt: ' + error.message; return; }
  startApp(data.user);
});
document.addEventListener('click', async ev => {
  if (ev.target.closest('#importSeed')) { await importState(seed()); }
  if (ev.target.closest('#logoutBtn')) { await sb.auth.signOut(); location.reload(); }
});
document.addEventListener('change', ev => {
  if (ev.target.id !== 'importFile' || !ev.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = async () => {
    try { const p = JSON.parse(fr.result); if (!p.cats || !p.people) throw new Error('geen begroting'); await importState(p); }
    catch (x) { document.getElementById('importMsg').textContent = 'Dit bestand kon niet worden gelezen.'; }
  };
  fr.readAsText(ev.target.files[0]);
});


/* ============================================================
   2. HELPERS
   ============================================================ */
const CUR = { EUR: '€', USD: '$', GBP: '£', MGA: 'Ar', CHF: 'CHF' };
const sym = () => CUR[S.trip.currency] || S.trip.currency;
function money(n, dec) {
  const d = dec === undefined ? 0 : dec;
  return sym() + ' ' + (Math.round(n * 100) / 100).toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function money0(n) { return money(n, 0); }
const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* catById/personById worden overal (tientallen keren, vaak per tabelrij)
   aangeroepen. In plaats van telkens S.cats/S.people lineair te doorzoeken
   (O(n) per aanroep) houden we een kleine Map bij die aan het begin van elke
   compute()-aanroep wordt ververst — dat gebeurt sowieso al bij elke render
   en elke export, dus de cache is nooit ouder dan de laatste wijziging.
   Mocht een id er toch niet in staan (bijv. cache nog niet gebouwd), dan valt
   de functie automatisch terug op de oude, altijd-correcte lineaire zoektocht. */
let _catMap = null, _personMap = null;
function rebuildLookupCaches() {
  _catMap = new Map(S.cats.map(c => [c.id, c]));
  _personMap = new Map(S.people.map(p => [p.id, p]));
}
const catById = id => (_catMap && _catMap.has(id)) ? _catMap.get(id) : S.cats.find(c => c.id === id);
const subById = (c, id) => c && c.subs.find(s => s.id === id);
const personById = id => (_personMap && _personMap.has(id)) ? _personMap.get(id) : S.people.find(p => p.id === id);
const initials = n => n.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();

function tripDays() {
  const a = new Date(S.trip.start), b = new Date(S.trip.end);
  if (isNaN(a) || isNaN(b)) return 1;
  return Math.max(1, Math.round((b - a) / 864e5) + 1);
}
function fmtDate(d) {
  if (!d) return '—';
  const x = new Date(d); if (isNaN(x)) return '—';

/* ============================================================
   3. BEREKENINGEN
   ============================================================ */
function lineTotal(e) {
  const n = (e.who && e.who.length) ? e.who.length : S.people.length;
  const q = e.qty || 1;
  let t = (Number(e.amount) || 0) * q;
  if (e.unit === 'pp' || e.unit === 'ppday') t *= n;
  return t;
}
/* ---- route ---- */
const MODES = {
  start: { label: 'Startpunt', speed: 0, factor: 1, icon: '◆' },
  auto: { label: 'Over de weg', speed: 50, factor: 1.35, icon: '⟶' },
  '4x4': { label: '4x4 / onverhard', speed: 40, factor: 1.45, icon: '⟶' },
  boot: { label: 'Boot', speed: 25, factor: 1.15, icon: '≈' },
  trein: { label: 'Trein', speed: 30, factor: 1.20, icon: '⟶' },
  vlucht: { label: 'Vlucht', speed: 450, factor: 1.0, overhead: 1.5, icon: '✈' }
};
function haversine(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function legInfo(from, to) {
  const m = MODES[to.mode] || MODES.auto;
  const straight = haversine(from, to);
  const km = (to.km != null && to.km !== '') ? Number(to.km) : straight * m.factor;
  const hours = (to.hours != null && to.hours !== '') ? Number(to.hours) : (m.speed ? km / m.speed + (m.overhead || 0) : 0);
  return { straight, km, hours, mode: m, modeKey: to.mode || 'auto' };
}
function routeInfo() {
  const stops = S.route || [];
  const legs = [];
  let km = 0, hours = 0;
  for (let i = 1; i < stops.length; i++) {
    const l = legInfo(stops[i - 1], stops[i]);
    l.from = stops[i - 1]; l.to = stops[i]; l.index = i;
    legs.push(l); km += l.km; hours += l.hours;
  }
  const nights = stops.reduce((a, s) => a + (Number(s.nights) || 0), 0);
  const longest = legs.slice().sort((a, b) => b.km - a.km)[0] || null;
  const flightKm = legs.filter(l => l.modeKey === 'vlucht').reduce((a, l) => a + l.km, 0);
  return { stops, legs, km, hours, nights, longest, flightKm, roadKm: km - flightKm };
}
function hhmm(h) {
  if (!h) return '0 u';
  const t = Math.round(h * 60), u = Math.floor(t / 60), m = t % 60;
  return u ? (u + ' u' + (m ? ' ' + m + ' m' : '')) : m + ' m';
}
const km0 = k => Math.round(k).toLocaleString('nl-NL') + ' km';

function scenarioFactor() { return 1 + (Number(S.trip.scenario) || 0) / 100; }
function bufferFactor() { return 1 + (Number(S.trip.buffer) || 0) / 100; }

function compute() {
  rebuildLookupCaches();
  const days = tripDays(), np = Math.max(1, S.people.length);
  const byCat = {}, bySub = {}, byPerson = {}, paidBy = {};
  S.cats.forEach(c => { byCat[c.id] = { booked: 0, est: 0, total: 0, budget: Number(c.budget) || 0, cat: c }; c.subs.forEach(s => bySub[s.id] = { booked: 0, est: 0, total: 0 }); });
  S.people.forEach(p => { byPerson[p.id] = { booked: 0, est: 0, total: 0, byCat: {}, bySub: {} }; paidBy[p.id] = 0; });

  let booked = 0, est = 0;
  S.expenses.forEach(e => {
    const t = lineTotal(e), k = e.kind === 'booked' ? 'booked' : 'est';
    if (k === 'booked') booked += t; else est += t;
    if (byCat[e.cat]) { byCat[e.cat][k] += t; byCat[e.cat].total += t; }
    if (e.sub && bySub[e.sub]) { bySub[e.sub][k] += t; bySub[e.sub].total += t; }
    // Eerder werd hier voor élke reiziger shareOf(e, p.id) aangeroepen, wat
    // lineTotal(e) — die we hierboven al hebben — én de deelnemerslijst nog
    // eens per persoon herberekende. Nu lopen we één keer over de daadwerkelijke
    // deelnemers (meestal een kleinere of gelijke groep dan alle reizigers) en
    // hergebruiken we t en het aandeel, zonder dubbel werk of een membership-
    // check per reiziger.
    const who = (e.who && e.who.length) ? e.who : S.people.map(p => p.id);
    if (who.length) {
      const share = t / who.length;
      who.forEach(pid => {
        const bp = byPerson[pid]; if (!bp) return;
        bp[k] += share; bp.total += share;
        bp.byCat[e.cat] = (bp.byCat[e.cat] || 0) + share;
        const sk = e.sub || ('none:' + e.cat);
        bp.bySub[sk] = (bp.bySub[sk] || 0) + share;
      });
    }
    if (e.payer && paidBy[e.payer] !== undefined && k === 'booked') paidBy[e.payer] += t;
  });

  const total = booked + est;
  const budget = S.cats.reduce((a, c) => a + (Number(c.budget) || 0), 0);
  const limit = Number(S.trip.limit) || 0;

  const bal = S.people.map(p => ({ id: p.id, name: p.name, paid: paidBy[p.id], owes: byPerson[p.id].booked, net: paidBy[p.id] - byPerson[p.id].booked }));
  const debt = bal.filter(b => b.net < -0.01).map(b => ({ ...b })).sort((a, b) => a.net - b.net);
  const cred = bal.filter(b => b.net > 0.01).map(b => ({ ...b })).sort((a, b) => b.net - a.net);
  const settle = [];
  let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const amt = Math.min(-debt[i].net, cred[j].net);
    if (amt > 0.5) settle.push({ fromId: debt[i].id, from: debt[i].name, toId: cred[j].id, to: cred[j].name, amount: amt });
    debt[i].net += amt; cred[j].net -= amt;
    if (Math.abs(debt[i].net) < 0.01) i++;
    if (Math.abs(cred[j].net) < 0.01) j++;
  }

  const dates = {};
  S.expenses.forEach(e => { const d = e.date || S.trip.start; dates[d] = (dates[d] || 0) + lineTotal(e); });
  const timeline = Object.keys(dates).sort().reduce((acc, d) => {
    const prev = acc.length ? acc[acc.length - 1].cum : 0;
    acc.push({ date: d, amount: dates[d], cum: prev + dates[d] }); return acc;
  }, []);

  const projected = total * scenarioFactor();
  const withBuffer = projected * bufferFactor();

  return {
    days, np, byCat, bySub, byPerson, paidBy, booked, est, total, budget, limit,
    limitPP: limit / np, unassigned: limit - budget,
    perPerson: total / np, perDay: total / days, perPersonPerDay: total / np / days,
    settle, bal, timeline, projected, withBuffer, perPersonBuffered: withBuffer / np, route: routeInfo(),
    limitLeft: limit - withBuffer, limitUsed: limit > 0 ? withBuffer / limit : 0
  };
}

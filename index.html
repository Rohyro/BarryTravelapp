  let lx = pl, leg = '';
  series.forEach(s => {
    leg += `<rect x="${lx}" y="${o.h - 14}" width="8" height="8" rx="2" fill="${s.color}"/><text x="${lx + 12}" y="${o.h - 7}" fill="${c.muted}" font-size="10.5" ${FS}>${esc(clip(s.label, 14))}</text>`;
    lx += 20 + clip(s.label, 14).length * 5.6;
  });
  return svgWrap(o.w, o.h, grid + bars + leg);
}

/* ============================================================
   5. INZICHTEN
   ============================================================ */
const ICONS = {
  trend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>',
  coins: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>'
};
function insightCards(list) {
  if (!list.length) return '';
  return `<div class="ins">${list.map(i => `<div class="ins-item ${i.tone || ''}"><div class="ins-ico">${ICONS[i.icon || 'info']}</div><div><h4>${i.title}</h4><p>${i.body}</p></div></div>`).join('')}</div>`;
}
function insightsFor(view, d) {
  const out = [];
  const cats = S.cats.map(c => ({ c, ...d.byCat[c.id] })).sort((a, b) => b.total - a.total);
  const top = cats[0];
  const over = cats.filter(x => x.budget > 0 && x.total > x.budget);
  const under = cats.filter(x => x.budget > 0 && x.total < x.budget * 0.7);
  const estShare = d.total ? Math.round(d.est / d.total * 100) : 0;

  if (view === 'groep') {
    if (top && top.total > 0) out.push({ icon: 'trend', tone: 'note', title: `${esc(top.c.name)} is de grootste post`, body: `Deze categorie is <span class="hl">${money0(top.total)}</span> — ${pct(top.total, d.total)}% van de hele reis. Een besparing van 10% hier scheelt ${money0(top.total * .1)} voor de groep, oftewel ${money0(top.total * .1 / d.np)} per persoon.` });
    if (d.limit > 0) {
      const l = d.limitLeft;
      out.push(l >= 0
        ? { icon: 'check', tone: 'good', title: `Je blijft ${money0(l)} onder de limiet`, body: `De limiet staat op <span class="hl">${money0(d.limit)}</span> (${money0(d.limitPP)} p.p.). Inclusief ${S.trip.buffer}% buffer kom je uit op ${money0(d.withBuffer)} — ${money0(l / d.np)} speling per persoon.` }
        : { icon: 'alert', tone: 'up', title: `Limiet met ${money0(-l)} overschreden`, body: `Inclusief buffer kom je op ${money0(d.withBuffer)} terwijl de limiet ${money0(d.limit)} is. Om erbinnen te blijven moet er ${money0(-l / d.np)} per persoon af.` });
      if (Math.abs(d.unassigned) > 1) out.push({ icon: 'coins', tone: 'note', title: d.unassigned > 0 ? `${money0(d.unassigned)} van de limiet is nog niet verdeeld` : `Categoriebudgetten staan ${money0(-d.unassigned)} boven de limiet`, body: d.unassigned > 0 ? `De categoriebudgetten tellen op tot ${money0(d.budget)}. Er is dus nog ruimte om aan een categorie toe te wijzen.` : `De som van de categoriebudgetten (${money0(d.budget)}) past niet binnen de limiet van ${money0(d.limit)}.` });
    }
    if (d.budget > 0) {
      const rest = d.budget - d.total;
      out.push(rest >= 0
        ? { icon: 'check', tone: 'good', title: 'Je zit binnen het totale budget', body: `Er is nog <span class="hl">${money0(rest)}</span> ruimte over de hele reis (${pct(rest, d.budget)}% van het budget). Dat is ${money0(rest / d.np)} per persoon.` }
        : { icon: 'alert', tone: 'up', title: `Budget overschreden met ${money0(-rest)}`, body: `De begroting staat op ${money0(d.budget)}, de kosten op ${money0(d.total)}. Verhoog het budget of schrap ${money0(-rest / d.np)} per persoon.` });
    }
    if (over.length) out.push({ icon: 'alert', tone: 'up', title: `${over.length} ${over.length === 1 ? 'categorie zit' : 'categorieën zitten'} over budget`, body: over.map(x => `<span class="hl">${esc(x.c.name)}</span> +${money0(x.total - x.budget)}`).join(' · ') + '.' });
    if (under.length) out.push({ icon: 'coins', tone: 'good', title: 'Ruimte in de begroting', body: `Bij ${under.map(x => esc(x.c.name)).join(', ')} gebruik je nog geen 70% van het budget. Samen ${money0(under.reduce((a, x) => a + (x.budget - x.total), 0))} speelruimte.` });
    out.push({ icon: 'info', title: 'Kosten per dag', body: `Over ${d.days} reisdagen kost de groep gemiddeld <span class="hl">${money0(d.perDay)} per dag</span> — ${money0(d.perPersonPerDay)} per persoon per dag.` });
    if (estShare > 0) out.push({ icon: 'info', tone: 'note', title: `${estShare}% van de begroting is nog een schatting`, body: `${money0(d.booked)} is vastgelegd, ${money0(d.est)} is geraamd. Hoe meer je boekt, hoe kleiner de onzekerheid in de kolom "Geschat".` });
  }

  if (view === 'individueel') {
    const arr = S.people.map(p => ({ p, ...d.byPerson[p.id] })).sort((a, b) => b.total - a.total);
    if (arr.length > 1 && arr[0].total > 0) {
      const spread = arr[0].total - arr[arr.length - 1].total;
      out.push(spread < 1
        ? { icon: 'check', tone: 'good', title: 'Iedereen betaalt evenveel', body: `Alle kosten worden gelijk verdeeld: <span class="hl">${money0(arr[0].total)}</span> per persoon.` }
        : { icon: 'trend', tone: 'note', title: `${esc(arr[0].p.name)} draagt het meest`, body: `Het verschil tussen de hoogste (${money0(arr[0].total)}) en laagste (${money0(arr[arr.length - 1].total)}) bijdrage is <span class="hl">${money0(spread)}</span>. Dat komt door kostenposten die niet met iedereen worden gedeeld.` });
    }
    const paidTop = [...d.bal].sort((a, b) => b.paid - a.paid)[0];
    if (paidTop && paidTop.paid > 0) out.push({ icon: 'coins', title: `${esc(paidTop.name)} heeft het meest voorgeschoten`, body: `<span class="hl">${money0(paidTop.paid)}</span> aan geboekte kosten. ${d.settle.length ? `Er ${d.settle.length === 1 ? 'is 1 betaling' : `zijn ${d.settle.length} betalingen`} nodig om alles glad te trekken.` : 'De boel staat al gelijk.'}` });
    if (!d.settle.length && d.booked > 0) out.push({ icon: 'check', tone: 'good', title: 'Niets te verrekenen', body: 'Op basis van de geboekte kosten is iedereen quitte.' });
    if (d.booked === 0) out.push({ icon: 'info', title: 'Nog niets voorgeschoten', body: 'Zet kostenposten op "Geboekt" en vul in wie betaald heeft — dan rekent de verrekening zichzelf uit.' });
  }

  if (view === 'geschat') {
    out.push({ icon: 'trend', tone: 'note', title: `Reken op ${money0(d.perPersonBuffered)} per persoon`, body: `Basisraming ${money0(d.perPerson)} per persoon, plus ${S.trip.scenario}% scenario en ${S.trip.buffer}% onvoorzien. Dat is <span class="hl">${money0(d.perPersonBuffered / d.days)} per persoon per dag</span>.` });
    const risky = cats.filter(x => x.est > x.booked && x.est > 0).sort((a, b) => b.est - a.est)[0];
    if (risky) out.push({ icon: 'alert', tone: 'up', title: `${esc(risky.c.name)} is het onzekerst`, body: `<span class="hl">${money0(risky.est)}</span> hiervan is nog niet vastgelegd. Als deze post 20% tegenvalt, kost dat ${money0(risky.est * .2 / d.np)} extra per persoon.` });
    const bufAmt = d.withBuffer - d.projected;
    if (bufAmt > 0) out.push({ icon: 'coins', title: 'Wat de buffer je oplevert', body: `De buffer van ${S.trip.buffer}% reserveert <span class="hl">${money0(bufAmt)}</span> voor de groep (${money0(bufAmt / d.np)} p.p.) voor kapotte banden, tegenvallende koersen en een extra excursie.` });
    if (d.limit > 0) {
      const diff = d.perPersonBuffered - d.limitPP;
      out.push({ icon: diff > 0 ? 'alert' : 'check', tone: diff > 0 ? 'up' : 'good', title: diff > 0 ? `${money0(diff)} p.p. boven de limiet` : `${money0(-diff)} p.p. onder de limiet`, body: `De limiet komt neer op <span class="hl">${money0(d.limitPP)} per persoon</span>. Bij het huidige scenario reken je op ${money0(d.perPersonBuffered)} per persoon.` });
    }
    out.push({ icon: 'info', title: 'Wisselkoers en contant geld', body: `Reken per persoon op ruwweg ${money0(d.perPersonBuffered * .35)} contant voor eten, fooien en entrees — pinnen kan buiten de grote steden slecht.` });
  }
  return out;
}

/* ============================================================
   6. WEERGAVE — de drie overzichten
   ============================================================ */
function kpi(eyebrow, value, desc, accent, alert) {
  return `<div class="kpi ${accent ? 'accent' : ''} ${alert ? 'alert' : ''}"><div class="eyebrow">${eyebrow}</div><div class="v num">${value}</div><div class="d">${desc}</div></div>`;
}
function limitStrip(d) {
  if (!d.limit) return '';
  const sc = Math.max(d.limit, d.withBuffer) * 1.02;
  const wB = Math.min(100, d.booked / sc * 100), wT = Math.min(100, d.total / sc * 100), wA = Math.min(100, d.withBuffer / sc * 100);
  const lp = Math.min(100, d.limit / sc * 100);
  const over = d.limitLeft < 0;
  return `<div class="card limit-card mt"><div class="card-b">
    <div class="flex" style="align-items:baseline">
      <span class="eyebrow">Totale limiet</span>
      <span class="pill ${over ? 'bad' : d.limitUsed > .9 ? 'warn' : 'ok'}">${Math.round(d.limitUsed * 100)}% gebruikt</span>
      <span class="flex-end num" style="font-family:var(--display);font-size:19px;font-weight:700">${money0(d.limit)}</span>
      <span class="tip">${money0(d.limitPP)} p.p.</span>
    </div>
    <div class="limit-meter">
      <i class="est" style="width:${wA}%"></i><i class="booked" style="width:${wB}%"></i>
      <span style="position:absolute;left:${lp}%;top:-4px;bottom:-4px;width:2px;background:var(--ink);z-index:3"></span>
    </div>
    <div class="br-meta">
      <span>Geboekt ${money0(d.booked)} · begroot ${money0(d.total)} · met buffer ${money0(d.withBuffer)}</span>
      <span style="${over ? 'color:var(--alert)' : ''}">${over ? money0(-d.limitLeft) + ' boven de limiet · ' + money0(-d.limitLeft / d.np) + ' p.p. te veel' : money0(d.limitLeft) + ' onder de limiet · ' + money0(d.limitLeft / d.np) + ' p.p. speling'}</span>
    </div>
  </div></div>`;
}
function card(title, sub, body, actions) {
  return `<div class="card"><div class="card-h"><div><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ''}</div>${actions || ''}</div><div class="card-b">${body}</div></div>`;
}
function sectionTitle(t, hint) { return `<div class="sec-title"><h2>${t}</h2>${hint ? `<span class="hint">${hint}</span>` : ''}</div>`; }

function viewGroep(d) {
  const cats = sortedCats(d, ui.groepSort, ui.groepFilter);
  const donut = donutChart(cats.map(x => ({ label: x.c.name, value: x.total, color: x.c.color })), { center: money0(d.total), centerSub: 'TOTAAL' });
  const bvs = budgetVsChart(cats.map(x => ({ label: x.c.name, spent: x.total, budget: x.budget, color: x.c.color })));
  const line = lineChart(d.timeline, { budget: d.budget });
  const rows = cats.length ? cats.map(x => {
    const subs = x.c.subs.map(s => ({ s, ...(d.bySub[s.id] || { total: 0, booked: 0, est: 0 }) })).filter(z => z.total > 0);
    const overP = pct(x.total, x.budget);
    return `<tr class="group-row"><td><span class="pill"><i style="background:${x.c.color}"></i>${esc(x.c.name)}</span></td>
      <td class="r num">${money0(x.booked)}</td><td class="r num">${money0(x.est)}</td><td class="r num">${money0(x.total)}</td>
      <td class="r num">${money0(x.budget)}</td>
      <td class="r">${x.budget ? `<span class="pill ${overP > 100 ? 'bad' : overP > 85 ? 'warn' : 'ok'}">${overP}%</span>` : '<span class="pill">—</span>'}</td>
      <td class="r num">${money0(x.total / d.np)}</td></tr>` +
      subs.map(z => `<tr class="sub"><td>${esc(z.s.name)}</td><td class="r num">${money0(z.booked)}</td><td class="r num">${money0(z.est)}</td><td class="r num">${money0(z.total)}</td><td></td><td></td><td class="r num">${money0(z.total / d.np)}</td></tr>`).join('');
  }).join('') : `<tr><td colspan="7"><div class="empty" style="padding:24px"><p style="margin:0">Geen categorieën binnen dit filter.</p></div></td></tr>`;
  const catTotal = cats.reduce((a, x) => a + x.total, 0);

  return sectionTitle('Groepsoverzicht', `${d.np} reizigers · ${d.days} dagen · ${S.expenses.length} kostenposten`) + `
  <div class="grid g4">
    ${kpi('Totale reissom', money0(d.total), `${money0(d.perDay)} per dag · ${money0(d.perPerson)} p.p.`, true)}
    ${kpi('Geboekt', money0(d.booked), `${pct(d.booked, d.total)}% vastgelegd`)}
    ${kpi('Nog geschat', money0(d.est), `${pct(d.est, d.total)}% raming`)}
    ${kpi('Ruimte tot limiet', money0(d.limitLeft), d.limit ? `van ${money0(d.limit)} limiet` : 'geen limiet ingesteld', false, d.limitLeft < 0)}
  </div>
  ${limitStrip(d)}
  ${filterSortBar([
    `<label class="f"><span>Sorteren</span>${sortSelect('groepSortSel', SORT_CAT_OPTIONS, ui.groepSort)}</label>`,
    `<label class="f"><span>Filteren</span>${sortSelect('groepFilterSel', FILTER_CAT_OPTIONS, ui.groepFilter)}</label>`,
    `<span class="count">${cats.length} van ${S.cats.length} categorieën · ${money0(catTotal)}</span>`
  ])}
  <div class="grid g2 mt">
    ${card('Waar gaat het geld heen?', 'Aandeel per categorie, geboekt én geschat', donut)}
    ${card('Budget versus werkelijkheid', 'Bovenste balk is uitgegeven, onderste is budget', bvs)}
  </div>
  ${sectionTitle('Categorieën', 'Subcategorieën met kosten worden uitgeklapt')}
  ${card('Kosten per categorie', '', `<div class="tbl-wrap"><table>
    <thead><tr><th>Categorie</th><th class="r">Geboekt</th><th class="r">Geschat</th><th class="r">Totaal</th><th class="r">Budget</th><th class="r">Benut</th><th class="r">Per persoon</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>Totaal</td><td class="r num">${money0(d.booked)}</td><td class="r num">${money0(d.est)}</td><td class="r num">${money0(d.total)}</td><td class="r num">${money0(d.budget)}</td><td class="r">${pct(d.total, d.budget)}%</td><td class="r num">${money0(d.perPerson)}</td></tr></tfoot>
  </table></div>`)}
  <div class="grid mt">
    ${card('Uitgaven in de tijd', 'Cumulatief, op datum van de kostenpost', line)}
  </div>
  ${sectionTitle('Trends & inzichten', 'Automatisch bijgewerkt bij elke wijziging')}
  ${insightCards(insightsFor('groep', d))}`;
}

function viewIndividueel(d) {
  const incl = ui.indivIncl;
  const val = p => incl === 'booked' ? d.byPerson[p.id].booked : d.byPerson[p.id].total;
  const people = sortedPeople(d, ui.indivSort);
  const totalShown = S.people.reduce((a, p) => a + val(p), 0);
  const cols = people.map(p => ({ label: p.name, values: d.byPerson[p.id].byCat }));
  const series = S.cats.map(c => ({ key: c.id, label: c.name, color: c.color }));
  const stacked = stackedChart(cols, series);
  const bars = hbarChart(people.map(p => ({ label: p.name, value: val(p), color: p.color })));

  const head = `<tr><th>Reiziger</th>${S.cats.map(c => `<th class="r">${esc(clip(c.name, 14))}</th>`).join('')}<th class="r">Aandeel</th><th class="r">Betaald</th><th class="r">Saldo</th></tr>`;
  const body = people.map(p => {
    const b = d.bal.find(x => x.id === p.id);

    return `<tr><td><span class="pill"><i style="background:${p.color}"></i>${esc(p.name)}</span></td>
      ${S.cats.map(c => `<td class="r num">${money0(d.byPerson[p.id].byCat[c.id] || 0)}</td>`).join('')}
      <td class="r num"><strong>${money0(val(p))}</strong></td>
      <td class="r num">${money0(b.paid)}</td>
      <td class="r"><span class="pill ${net > 0.5 ? 'ok' : net < -0.5 ? 'bad' : ''}">${net > 0 ? '+' : ''}${money0(net)}</span></td></tr>`;
  }).join('');

  const settle = d.settle.length
    ? `<div class="grid" style="gap:9px">${d.settle.map(s => `<div class="flex" style="padding:10px 13px;background:var(--stone);border-radius:9px">
        <span class="pill"><i style="background:${(personById(S.people.find(p => p.name === s.from).id) || {}).color}"></i>${esc(s.from)}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <span class="pill"><i style="background:${(personById(S.people.find(p => p.name === s.to).id) || {}).color}"></i>${esc(s.to)}</span>
        <strong class="num flex-end">${money(s.amount, 2)}</strong></div>`).join('')}</div>`
    : `<div class="empty" style="padding:24px"><p style="margin:0">Op basis van de geboekte kosten hoeft niemand iets terug te betalen.</p></div>`;

  return sectionTitle('Individueel overzicht', 'Wat elke reiziger draagt, betaalt en nog moet verrekenen') + `
  ${filterSortBar([
    `<div class="f-sm"><span class="eyebrow" style="display:block;margin-bottom:6px">Meetellen</span><div class="seg" id="indivScope">
      <button data-incl="all" aria-pressed="${incl === 'all'}">Alles</button>
      <button data-incl="booked" aria-pressed="${incl === 'booked'}">Alleen geboekt</button>
    </div></div>`,
    `<label class="f"><span>Sorteren</span>${sortSelect('indivSortSel', SORT_PERSON_OPTIONS, ui.indivSort)}</label>`,
    `<span class="count">Kosten worden gedeeld door de reizigers die je bij een post aanvinkt.</span>`
  ])}
  <div class="grid g4">
    ${kpi('Gemiddeld per persoon', money0(totalShown / d.np), `over ${d.np} reizigers`, true)}
    ${kpi('Hoogste bijdrage', money0(val(people[0]) || 0), esc(people[0] ? people[0].name : '—'))}
    ${kpi('Laagste bijdrage', money0(val(people[people.length - 1]) || 0), esc(people.length ? people[people.length - 1].name : '—'))}
    ${kpi('Te verrekenen', money0(d.settle.reduce((a, s) => a + s.amount, 0)), `${d.settle.length} ${d.settle.length === 1 ? 'betaling' : 'betalingen'}`)}
  </div>
  <div class="grid g2 mt">
    ${card('Bijdrage per reiziger', 'Opgebouwd uit categorieën', stacked)}
    ${card('Totaal per reiziger', incl === 'booked' ? 'Alleen geboekte kosten' : 'Geboekt én geschat', bars)}
  </div>
  ${sectionTitle('Budget versus werkelijkheid', 'Per reiziger afgezet tegen zijn deel van het budget')}
  ${indivBudgetSection(d)}
  ${sectionTitle('Verdeling per categorie')}
  ${card('Wie draagt wat', 'Saldo = voorgeschoten min eigen aandeel, over geboekte kosten', `<div class="tbl-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`)}
  ${sectionTitle('Verrekenen', 'Kortste route naar quitte')}
  ${card('Wie betaalt wie', '', settle)}
  ${sectionTitle('Trends & inzichten')}
  ${insightCards(insightsFor('individueel', d))}`;
}

function indivBudgetSection(d) {
  const pid = (ui.indivPerson && S.people.some(p => p.id === ui.indivPerson)) ? ui.indivPerson : S.people[0].id;
  const p = personById(pid);
  const mine = d.byPerson[pid];
  const sortOpts = {
    total_desc: { label: 'Hoogste aandeel eerst', cmp: (a, b) => b.spent - a.spent },
    total_asc: { label: 'Laagste aandeel eerst', cmp: (a, b) => a.spent - b.spent },
    name_asc: { label: 'Naam (A-Z)', cmp: (a, b) => a.c.name.localeCompare(b.c.name) },
    over_desc: { label: 'Meest over budget eerst', cmp: (a, b) => (b.spent - b.budget) - (a.spent - a.budget) }
  };
  const rows = S.cats.map(c => ({
    c, spent: mine.byCat[c.id] || 0, budget: (Number(c.budget) || 0) / d.np
  })).sort((sortOpts[ui.indivBudgetSort] || sortOpts.total_desc).cmp);
  const mineTotal = mine.total, budgetTotal = d.budget / d.np;
  const chart = budgetVsChart(rows.map(r => ({ label: r.c.name, spent: r.spent, budget: r.budget, color: r.c.color })));
  const donut = donutChart(rows.map(r => ({ label: r.c.name, value: r.spent, color: r.c.color })), { center: money0(mineTotal), centerSub: esc(p.name).toUpperCase() });

  const table = rows.map(r => {
    const subs = r.c.subs.map(s => ({ s, v: mine.bySub[s.id] || 0 })).filter(z => z.v > 0);
    const none = mine.bySub['none:' + r.c.id] || 0;
    const overP = pct(r.spent, r.budget);
    return `<tr class="group-row">
      <td><span class="pill"><i style="background:${r.c.color}"></i>${esc(r.c.name)}</span></td>
      <td class="r num">${money0(r.spent)}</td>
      <td class="r num">${money0(r.budget)}</td>
      <td class="r"><span class="pill ${overP > 100 ? 'bad' : overP > 85 ? 'warn' : 'ok'}">${overP}%</span></td>
      <td class="r num">${money0(r.budget - r.spent)}</td>

  return `
  ${filterSortBar([
    `<label class="f"><span>Reiziger</span><select id="indivPerson">${S.people.map(x => `<option value="${x.id}" ${x.id === pid ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>`,
    `<label class="f"><span>Sorteren</span>${sortSelect('indivBudgetSortSel', sortOpts, ui.indivBudgetSort)}</label>`,
    `<span class="count">Het budget per reiziger is het categoriebudget gedeeld door ${d.np} reizigers.</span>`
  ])}
  <div class="grid g4 mb">
    ${kpi('Aandeel van ' + esc(p.name), money0(mineTotal), `${money(mineTotal / d.days, 2)} per dag`, true)}
    ${kpi('Budget per persoon', money0(budgetTotal), `${pct(mineTotal, budgetTotal)}% benut`)}
    ${kpi('Ruimte over', money0(budgetTotal - mineTotal), budgetTotal - mineTotal >= 0 ? 'binnen budget' : 'overschreden', false, budgetTotal - mineTotal < 0)}
    ${kpi('Voorgeschoten', money0((d.bal.find(b => b.id === pid) || {}).paid || 0), 'aan geboekte kosten')}
  </div>
  <div class="grid g2 mb">
    ${card('Budget versus werkelijkheid', `Voor ${esc(p.name)} — bovenste balk is zijn aandeel, onderste zijn budget`, chart)}
    ${card('Kosten per categorie', `Waar het geld van ${esc(p.name)} heen gaat`, donut)}
  </div>
  ${card('Kosten per categorie', `Subcategorieën met kosten voor ${esc(p.name)}`, `<div class="tbl-wrap"><table>
    <thead><tr><th>Categorie</th><th class="r">Aandeel</th><th class="r">Budget p.p.</th><th class="r">Benut</th><th class="r">Verschil</th><th class="r">Per dag</th></tr></thead>
    <tbody>${table}</tbody>
    <tfoot><tr><td>Totaal</td><td class="r num">${money0(mineTotal)}</td><td class="r num">${money0(budgetTotal)}</td><td class="r">${pct(mineTotal, budgetTotal)}%</td><td class="r num">${money0(budgetTotal - mineTotal)}</td><td class="r num">${money(mineTotal / d.days, 2)}</td></tr></tfoot>
  </table></div>`)}`;
}

function viewGeschat(d) {
  const f = scenarioFactor() * bufferFactor();
  const geschatSortOpts = {
    total_desc: { label: 'Hoogste eerst', cmp: (a, b) => b.ppAdj - a.ppAdj },
    total_asc: { label: 'Laagste eerst', cmp: (a, b) => a.ppAdj - b.ppAdj },
    name_asc: { label: 'Naam (A-Z)', cmp: (a, b) => a.c.name.localeCompare(b.c.name) },
    over_desc: { label: 'Grootste verschil met budget', cmp: (a, b) => (b.ppAdj - b.budgetPP) - (a.ppAdj - a.budgetPP) },
    onzeker_desc: { label: 'Meest onzeker eerst', cmp: (a, b) => pct(b.est, b.total) - pct(a.est, a.total) }
  };
  const geschatFilterOpts = {
    all: { label: 'Alle categorieën', test: () => true },
    over: { label: 'Boven budget p.p.', test: x => x.ppAdj > x.budgetPP },
    onzeker: { label: 'Meer dan helft nog geschat', test: x => pct(x.est, x.total) >= 50 }
  };
  let cats = S.cats.map(c => {
    const x = d.byCat[c.id];
    return { c, pp: x.total / d.np, ppAdj: x.total * f / d.np, budgetPP: x.budget / d.np, est: x.est, booked: x.booked, total: x.total };
  });
  cats = cats.filter((geschatFilterOpts[ui.geschatFilter] || geschatFilterOpts.all).test);
  cats.sort((geschatSortOpts[ui.geschatSort] || geschatSortOpts.total_desc).cmp);
  const donut = donutChart(cats.map(x => ({ label: x.c.name, value: x.ppAdj, color: x.c.color })), { center: money0(d.perPersonBuffered), centerSub: 'P.P.' });
  const bvs = budgetVsChart(cats.map(x => ({ label: x.c.name, spent: x.ppAdj, budget: x.budgetPP, color: x.c.color })));
  const perDay = hbarChart(cats.map(x => ({ label: x.c.name, value: x.ppAdj / d.days, color: x.c.color })));

  const rows = cats.length ? cats.map(x => `<tr>
    <td><span class="pill"><i style="background:${x.c.color}"></i>${esc(x.c.name)}</span></td>
    <td class="r num">${money0(x.pp)}</td>
    <td class="r num"><strong>${money0(x.ppAdj)}</strong></td>
    <td class="r num">${money(x.ppAdj / d.days, 2)}</td>
    <td class="r num">${money0(x.budgetPP)}</td>
    <td class="r"><span class="pill ${x.ppAdj > x.budgetPP ? 'bad' : 'ok'}">${x.ppAdj > x.budgetPP ? '+' : ''}${money0(x.ppAdj - x.budgetPP)}</span></td>
    <td class="r num">${pct(x.est, x.total)}%</td></tr>`).join('') : `<tr><td colspan="7"><div class="empty" style="padding:24px"><p style="margin:0">Geen categorieën binnen dit filter.</p></div></td></tr>`;

  const scen = [
    { k: 'Meevaller', f: 0.9 }, { k: 'Verwacht', f: 1 }, { k: 'Tegenvaller', f: 1.15 }, { k: 'Worst case', f: 1.3 }
  ].map(s => {
    const v = d.total * bufferFactor() * s.f;
    return `<tr><td>${s.k}</td><td class="r num">${(s.f * 100 - 100 > 0 ? '+' : '') + Math.round(s.f * 100 - 100)}%</td><td class="r num">${money0(v)}</td><td class="r num"><strong>${money0(v / d.np)}</strong></td><td class="r num">${money(v / d.np / d.days, 2)}</td></tr>`;
  }).join('');

  return sectionTitle('Geschatte kosten per persoon', 'Basisraming plus scenario en buffer') + `
  ${card('Stel je raming bij', 'Beide schuiven werken direct door in alle bedragen hieronder', `
    <div class="grid g2">
      <div>
        <div class="flex" style="justify-content:space-between"><span class="eyebrow">Scenario</span><strong class="num" id="scenVal">${S.trip.scenario > 0 ? '+' : ''}${S.trip.scenario}%</strong></div>
        <input type="range" min="-25" max="50" step="5" value="${S.trip.scenario}" id="scenSlider" class="mt">
        <p class="tip mt" style="margin:8px 0 0">Reken alle posten omhoog of omlaag, bijvoorbeeld voor een duurdere maand of een gunstige wisselkoers.</p>
      </div>
      <div>
        <div class="flex" style="justify-content:space-between"><span class="eyebrow">Onvoorzien</span><strong class="num" id="bufVal">${S.trip.buffer}%</strong></div>
        <input type="range" min="0" max="40" step="5" value="${S.trip.buffer}" id="bufSlider" class="mt">
        <p class="tip mt" style="margin:8px 0 0">Reserve bovenop de raming: <span class="hl" id="bufAmt">${money0(d.withBuffer - d.projected)}</span> voor de groep.</p>
      </div>
    </div>`)}
  <div class="grid g4 mt">
    ${kpi('Per persoon', money0(d.perPersonBuffered), 'inclusief scenario en buffer', true)}
    ${kpi('Per persoon per dag', money(d.perPersonBuffered / d.days, 2), `over ${d.days} dagen`)}
    ${kpi('Basisraming p.p.', money0(d.perPerson), 'zonder opslag')}
    ${kpi('Limiet per persoon', d.limit ? money0(d.limitPP) : '—', d.limit ? (d.perPersonBuffered <= d.limitPP ? money0(d.limitPP - d.perPersonBuffered) + ' speling' : money0(d.perPersonBuffered - d.limitPP) + ' te veel') : 'niet ingesteld', false, d.limit > 0 && d.perPersonBuffered > d.limitPP)}
  </div>
  <div class="grid g2 mt">
    ${card('Opbouw per persoon', 'Inclusief scenario en buffer', donut)}
    ${card('Raming versus budget per persoon', 'Budget gedeeld door aantal reizigers', bvs)}
  </div>
  <div class="grid g2 mt">
    ${card('Dagbudget per persoon', 'Handig om mee op pad te gaan', perDay)}
    ${card('Scenariovergelijking', 'Alle vier de uitkomsten naast elkaar', `<div class="tbl-wrap"><table><thead><tr><th>Scenario</th><th class="r">Afwijking</th><th class="r">Groep</th><th class="r">Per persoon</th><th class="r">P.p. per dag</th></tr></thead><tbody>${scen}</tbody></table></div>`)}
  </div>
  ${sectionTitle('Raming per categorie')}
  ${filterSortBar([
    `<label class="f"><span>Sorteren</span>${sortSelect('geschatSortSel', geschatSortOpts, ui.geschatSort)}</label>`,
    `<label class="f"><span>Filteren</span>${sortSelect('geschatFilterSel', geschatFilterOpts, ui.geschatFilter)}</label>`,
    `<span class="count">${cats.length} van ${S.cats.length} categorieën</span>`
  ])}
  ${card('Wat kost elke categorie jou', '', `<div class="tbl-wrap"><table>
    <thead><tr><th>Categorie</th><th class="r">Basis p.p.</th><th class="r">Met opslag</th><th class="r">Per dag</th><th class="r">Budget p.p.</th><th class="r">Verschil</th><th class="r">Onzeker</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>Totaal</td><td class="r num">${money0(d.perPerson)}</td><td class="r num">${money0(d.perPersonBuffered)}</td><td class="r num">${money(d.perPersonBuffered / d.days, 2)}</td><td class="r num">${money0(d.budget / d.np)}</td><td class="r num">${money0(d.perPersonBuffered - d.budget / d.np)}</td><td class="r num">${pct(d.est, d.total)}%</td></tr></tfoot>
  </table></div>`)}
  ${sectionTitle('Trends & inzichten')}
  ${insightCards(insightsFor('geschat', d))}`;
}

function viewKosten(d) {
  const q = ui.expFilter.toLowerCase();
  const EXP_SORT_OPTIONS = {
    amount_desc: { label: 'Hoogste bedrag eerst', cmp: (a, b) => lineTotal(b) - lineTotal(a) },
    amount_asc: { label: 'Laagste bedrag eerst', cmp: (a, b) => lineTotal(a) - lineTotal(b) },
    date_desc: { label: 'Nieuwste datum eerst', cmp: (a, b) => (b.date || '').localeCompare(a.date || '') },
    date_asc: { label: 'Oudste datum eerst', cmp: (a, b) => (a.date || '').localeCompare(b.date || '') },
    name_asc: { label: 'Naam (A-Z)', cmp: (a, b) => a.desc.localeCompare(b.desc) }
  };
  let list = S.expenses.filter(e => {
    if (ui.expCat !== 'all' && e.cat !== ui.expCat) return false;
    if (ui.expKind !== 'all' && (e.kind || 'est') !== ui.expKind) return false;
    if (q) {
      const c = catById(e.cat), s = c && subById(c, e.sub);
      const hay = (e.desc + ' ' + (c ? c.name : '') + ' ' + (s ? s.name : '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((EXP_SORT_OPTIONS[ui.expSort] || EXP_SORT_OPTIONS.amount_desc).cmp);
  const shown = list.reduce((a, e) => a + lineTotal(e), 0);

  const rows = list.length ? list.map(e => {
    const c = catById(e.cat), s = c && subById(c, e.sub), t = lineTotal(e);
    const payer = e.payer ? personById(e.payer) : null;
    const nWho = (e.who || []).length || S.people.length;
    return `<tr data-eid="${e.id}">
      <td><div style="font-weight:600">${esc(e.desc)}</div><div class="tip">${fmtDate(e.date)} · ${nWho}/${S.people.length} reizigers</div>${e.note ? `<div class="tip" style="margin-top:3px;font-style:italic">${esc(e.note)}</div>` : ''}</td>
      <td><span class="pill"><i style="background:${c ? c.color : '#999'}"></i>${esc(c ? c.name : '—')}</span>${s ? `<div class="tip" style="margin-top:3px">${esc(s.name)}</div>` : ''}</td>
      <td class="r num">${money(e.amount, 2)}</td>
      <td><span class="pill">${UNITS[e.unit].short}${e.qty > 1 ? ' ×' + e.qty : ''}</span></td>
      <td class="r num"><strong>${money0(t)}</strong><div class="tip num">${money0(t / d.np)} p.p.</div></td>
      <td><span class="pill ${e.kind === 'booked' ? 'ok' : 'est'}">${e.kind === 'booked' ? 'Geboekt' : 'Geschat'}</span></td>
      <td>${payer ? `<span class="pill"><i style="background:${payer.color}"></i>${esc(payer.name)}</span>` : '<span class="tip">—</span>'}</td>
      <td class="r"><div class="flex" style="justify-content:flex-end;gap:3px;flex-wrap:nowrap">
        ${canEditExpense(e) ? `<button class="btn ghost icon-btn" data-edit="${e.id}" title="Bewerken"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>` : ''}
        <button class="btn ghost icon-btn" data-dup="${e.id}" title="Dupliceren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
        ${canEditExpense(e) ? `<button class="btn ghost icon-btn" data-del="${e.id}" title="Verwijderen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>` : ''}
      </div></td></tr>`;
  }).join('') : `<tr><td colspan="8"><div class="empty"><h4>Geen kostenposten gevonden</h4><p>Pas het filter aan of voeg een nieuwe post toe.</p><button class="btn primary" data-open-drawer="expense">Kostenpost toevoegen</button></div></td></tr>`;

  return sectionTitle('Kostenposten', `${list.length} van ${S.expenses.length} zichtbaar · ${money0(shown)}`) + `
  <div class="card mb"><div class="card-b">
    <div class="field-row">
      <label class="f" style="flex:2"><span>Zoeken</span><input type="text" id="expSearch" value="${esc(ui.expFilter)}" placeholder="Zoek op omschrijving of categorie"></label>
      <label class="f"><span>Categorie</span><select id="expCatF"><option value="all">Alle categorieën</option>${S.cats.map(c => `<option value="${c.id}" ${ui.expCat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label class="f"><span>Status</span><select id="expKindF"><option value="all" ${ui.expKind === 'all' ? 'selected' : ''}>Alles</option><option value="booked" ${ui.expKind === 'booked' ? 'selected' : ''}>Geboekt</option><option value="est" ${ui.expKind === 'est' ? 'selected' : ''}>Geschat</option></select></label>
      <label class="f"><span>Sorteren</span>${sortSelect('expSortF', EXP_SORT_OPTIONS, ui.expSort)}</label>
    </div>
    <div class="flex mt"><button class="btn primary" data-open-drawer="expense">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Kostenpost toevoegen</button></div>
  </div></div>
  ${card('Alle posten', 'Bedrag × eenheid × aantal bepaalt het totaal', `<div class="tbl-wrap"><table>
    <thead><tr><th>Omschrijving</th><th>Categorie</th><th class="r">Bedrag</th><th>Eenheid</th><th class="r">Totaal</th><th>Status</th><th>Voorgeschoten</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`)}`;
}

function viewBudget(d) {
  const rows = S.cats.map(c => ({ c, ...d.byCat[c.id] }));
  const budgetSortOpts = {
    natural: { label: 'Toevoegvolgorde', cmp: null },
    budget_desc: { label: 'Hoogste budget eerst', cmp: (a, b) => (b.budget || 0) - (a.budget || 0) },
    name_asc: { label: 'Naam (A-Z)', cmp: (a, b) => a.c.name.localeCompare(b.c.name) },
    over_desc: { label: 'Meest overschreden eerst', cmp: (a, b) => (b.total - b.budget) - (a.total - a.budget) }
  };
  const sortedRows = budgetSortOpts[ui.budgetSort] && budgetSortOpts[ui.budgetSort].cmp ? [...rows].sort(budgetSortOpts[ui.budgetSort].cmp) : rows;
  const rowsHtml = sortedRows.map(({ c, ...x }) => {
    const p = pct(x.total, x.budget);
    const maxSlider = Math.max(1000, Math.ceil(Math.max(x.total * 1.8, x.budget * 1.6) / 500) * 500);
    const subTotals = c.subs.map(s => ({ s, t: (d.bySub[s.id] || { total: 0 }).total }));
    const assigned = subTotals.reduce((a2, z) => a2 + z.t, 0);
    const rest = x.total - assigned;
    const maxSub = Math.max(...subTotals.map(z => z.t), rest, 1);
    const subRows = subTotals.sort((a2, b2) => b2.t - a2.t).map(z => `
      <div class="sub-row ${z.t ? '' : 'empty-sub'}">
        <input class="nm-edit" type="text" value="${esc(z.s.name)}" data-subname="${c.id}:${z.s.id}" aria-label="Naam van de subcategorie">
        <span class="track"><i style="width:${Math.round(z.t / maxSub * 100)}%;background:${c.color}"></i></span>
        <span class="amt">${money0(z.t)}</span>
        <span class="pc">${pct(z.t, x.total)}%</span>
        <button class="x" data-delsub="${c.id}:${z.s.id}" title="Subcategorie verwijderen">×</button>
      </div>`).join('');
    const restRow = rest > 0.5 ? `
      <div class="sub-row rest">
        <span class="nm">Niet ingedeeld</span>
        <span class="track"><i style="width:${Math.round(rest / maxSub * 100)}%;background:var(--grey)"></i></span>
        <span class="amt">${money0(rest)}</span>
        <span class="pc">${pct(rest, x.total)}%</span>
        <span style="width:23px"></span>
      </div>` : '';
    const subs = `<div class="sublist">
      <div class="sublist-h"><span class="nm" style="flex:1">Subcategorie</span><span class="track"></span><span style="width:86px;text-align:right">Begroot</span><span style="width:38px;text-align:right">Deel</span><span style="width:23px"></span></div>
      ${subTotals.length || rest > 0.5 ? subRows + restRow : '<div class="sub-row"><span class="nm tip">Nog geen subcategorieën.</span></div>'}
      <div style="padding:9px 9px 0"><button class="btn sm" data-addsub="${c.id}">+ Subcategorie</button></div>
    </div>`;
    return `<div class="budget-row" data-cat="${c.id}">
      <div class="br-top">
        <span class="br-dot" style="background:${c.color}"></span>
        <span class="br-name">${esc(c.name)}</span>
        <span class="pill ${p > 100 ? 'bad' : p > 85 ? 'warn' : 'ok'}" data-pctlabel>${p}% benut</span>
        <span class="br-nums">
          <span class="cur" data-spent>${money0(x.total)}</span>
          <span class="of">van</span>
          <input type="number" min="0" step="50" value="${Math.round(c.budget)}" data-budgetnum="${c.id}" style="width:104px;text-align:right;font-weight:600">
        </span>
        <button class="btn ghost icon-btn" data-editcat="${c.id}" title="Categorie bewerken"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="btn ghost icon-btn danger" data-delcat="${c.id}" title="Categorie verwijderen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
      </div>
      <div class="bar"><i data-fill style="width:${Math.min(100, p)}%;background:${p > 100 ? 'var(--clay)' : c.color}"></i></div>
      <input type="range" min="0" max="${maxSlider}" step="50" value="${Math.round(c.budget)}" data-budget="${c.id}" aria-label="Budget ${esc(c.name)}">
      <div class="br-meta">
        <span>Geboekt ${money0(x.booked)} · geschat ${money0(x.est)}</span>
        <span data-rest>${x.budget - x.total >= 0 ? `Nog ${money0(x.budget - x.total)} te besteden · ${money0((x.budget - x.total) / d.np)} p.p.` : `${money0(x.total - x.budget)} over budget · ${money0((x.total - x.budget) / d.np)} p.p.`}</span>
      </div>
      ${subs}
    </div>`;
  }).join('');

  const budgetDonut = donutChart(S.cats.map(c => ({ label: c.name, value: Number(c.budget) || 0, color: c.color })), { center: money0(d.budget), centerSub: 'BUDGET' });

  const maxLimit = Math.max(60000, Math.ceil(Math.max(d.withBuffer * 1.6, d.limit * 1.4) / 5000) * 5000);
  return sectionTitle('Budget & limiet', 'Zet een plafond voor de hele reis en verdeel dat over categorieën') + `
  <div class="card limit-card mb"><div class="card-b">
    <div class="flex" style="align-items:flex-start">
      <div>
        <span class="eyebrow">Totale limiet voor de reis</span>
        <div class="num" style="font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.04em;margin-top:6px" id="limTotal">${money0(d.limit)}</div>
        <div class="tip" id="limSub">${d.limit ? money0(d.limitPP) + ' per persoon · ' + d.np + ' reizigers' : 'Nog geen limiet ingesteld'}</div>
      </div>
      <div class="flex-end field-row" style="max-width:330px">
        <label class="f"><span>Totaal</span><input type="number" min="0" step="500" value="${Math.round(d.limit)}" data-limit="total"></label>
        <label class="f"><span>Per persoon</span><input type="number" min="0" step="50" value="${Math.round(d.limitPP)}" data-limit="pp"></label>

let MAP = null, mapView = null, addMode = false, searchResults = [];
// Standaard altijd een volledige heropbouw van de kaart bij render() (veilig,
// dekt route-wijzigingen af). Handlers die weten dat alleen kleuren/iconen
// hoeven te wijzigen (bijv. een bezocht-toggle) zetten dit vooraf op false
// nadat ze zelf al een lichte update via refreshVisitedStyling() deden.
let mapNeedsReinit = true;

function popupBtn(label, onclick) {
  return `<button type="button" class="btn sm mt" style="width:100%;justify-content:center" onclick="${onclick}">${label}</button>`;
}
window.mapAddFromPopup = function (lat, lng, name) {
  addStopAt(lat, lng, decodeURIComponent(name));
  if (MAP) MAP.closePopup();
};
window.mapDrawRadius = function (lat, lng, km, name) {
  if (!MAP) return;
  if (window.__radiusCircle) { MAP.removeLayer(window.__radiusCircle); window.__radiusCircle = null; }
  window.__radiusCircle = L.circle([lat, lng], { radius: km * 1000, color: '#22C58B', weight: 1.5, fillOpacity: .08 }).addTo(MAP);
  toast(`Cirkel van ${km} km rond ${decodeURIComponent(name)} getekend`);

};

async function reverseGeocode(lat, lng) {
  const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=12&accept-language=nl`;
  const r = await fetch(url, { headers: { Accept: 'application/json' } });
  const j = await r.json();
  if (!j || j.error) throw new Error('geen resultaat');
  const a = j.address || {};
  const name = j.name || a.village || a.town || a.city || a.county || a.state || j.display_name.split(',')[0];
  return { name, full: j.display_name };
}
async function handleMapClick(lat, lng) {
  if (addMode) { addStopAt(lat, lng); return; }
  const p = L.popup({ maxWidth: 260 }).setLatLng([lat, lng])
    .setContent(`<div style="font-size:12.5px">Zoeken naar deze plek…</div>`).openOn(MAP);
  try {
    const g = await reverseGeocode(lat, lng);
    const enc = encodeURIComponent(g.name);
    p.setContent(`<b>${esc(g.name)}</b><div class="tip" style="margin:3px 0 8px">${esc(g.full)}</div>
      ${popupBtn('Voeg toe als bestemming', `mapAddFromPopup(${lat},${lng},'${enc}')`)}
      ${popupBtn('Toon 10 km straal', `mapDrawRadius(${lat},${lng},10,'${enc}')`)}`);
  } catch (e) {
    p.setContent(`<div style="font-size:12.5px">Kon deze plek niet opzoeken (geen verbinding met Nominatim).</div>${popupBtn('Voeg toch toe als bestemming', `mapAddFromPopup(${lat},${lng},'${encodeURIComponent('Nieuwe bestemming')}')`)}`);
  }
}

let ROAD_LAYER = null, roadsLoading = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function osrmRoute(a, b) {
  const url = `https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('osrm fout');
  const j = await r.json();
  if (j.code !== 'Ok' || !j.routes || !j.routes[0]) throw new Error('geen route gevonden');
  const route = j.routes[0];
  return { latlngs: route.geometry.coordinates.map(([lng, lat]) => [lat, lng]), km: route.distance / 1000, hours: route.duration / 3600 };
}
async function toggleRoads() {
  const btn = document.getElementById('roadsBtn'); if (!btn) return;
  if (ROAD_LAYER) { MAP.removeLayer(ROAD_LAYER); ROAD_LAYER = null; btn.textContent = '🛣️ Route via wegen'; return; }
  if (roadsLoading || !MAP) return;
  const stops = (S.route || []).filter(s => typeof s.lat === 'number');
  const legs = [];
  for (let i = 1; i < stops.length; i++) {
    const mode = stops[i].mode;
    if (mode === 'auto' || mode === '4x4') legs.push({ from: stops[i - 1], to: stops[i] });
  }
  if (!legs.length) { toast('Geen etappes over de weg om te tekenen (alleen vlucht/boot in deze route)'); return; }
  roadsLoading = true; btn.textContent = `Wegen laden 0/${legs.length}…`; btn.disabled = true;
  ROAD_LAYER = L.layerGroup().addTo(MAP);
  let ok = 0, failed = 0;
  for (let i = 0; i < legs.length; i++) {
    const leg = legs[i];
    try {
      const res = await osrmRoute(leg.from, leg.to);
      L.polyline(res.latlngs, { color: '#22C58B', weight: 4, opacity: .8 })
        .bindPopup(`<b>${esc(leg.from.name)} → ${esc(leg.to.name)}</b><br>Via de weg: ${km0(res.km)} · ${hhmm(res.hours)}<div class="tip" style="margin-top:4px">Route: OSRM · Kaartdata: © OpenStreetMap-bijdragers (ODbL)</div>`, { maxWidth: 240 })
        .addTo(ROAD_LAYER);
      ok++;
    } catch (e) { failed++; }
    btn.textContent = `Wegen laden ${i + 1}/${legs.length}…`;
    if (i < legs.length - 1) await sleep(1100); // eerlijk-gebruik: max 1 verzoek per seconde
  }
  if (MAP.attributionControl && ok) MAP.attributionControl.addAttribution('Routing &copy; <a href="https://project-osrm.org" target="_blank" rel="noopener">OSRM</a>');
  btn.textContent = `${ok} ${ok === 1 ? 'weg' : 'wegen'} getekend — verbergen`;
  btn.disabled = false; roadsLoading = false;
  if (failed) toast(`${failed} van de ${legs.length} etappes kon niet via de weg worden opgehaald`);
  if (!ok) { toast('Kon geen route via de weg ophalen (geen verbinding met OSRM)'); MAP.removeLayer(ROAD_LAYER); ROAD_LAYER = null; btn.textContent = '🛣️ Route via wegen'; }
}

async function togglePois() {
  const btn = document.getElementById('poiBtn'); if (!btn) return;
  if (POI_LAYER) { MAP.removeLayer(POI_LAYER); POI_LAYER = null; btn.textContent = 'Plekken in de buurt'; return; }
  if (poiLoading || !MAP) return;
  poiLoading = true; btn.textContent = 'Laden…'; btn.disabled = true;
  try {
    const b = MAP.getBounds();
    const bbox = `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
    const q = `[out:json][timeout:25][bbox:${bbox}];(node["tourism"~"attraction|viewpoint|museum|zoo|national_park|artwork"];node["amenity"~"hospital|pharmacy|fuel"];);out body 80;`;
    const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q) });
    if (!r.ok) throw new Error('overpass fout');
    const j = await r.json();
    POI_LAYER = L.layerGroup();
    const iconFor = tags => tags.amenity === 'hospital' ? { e: '🏥', c: '#FF7A66' } : tags.amenity === 'pharmacy' ? { e: '💊', c: '#FF7A66' } : tags.amenity === 'fuel' ? { e: '⛽', c: '#8296A6' } : { e: '📍', c: '#22C58B' };
    (j.elements || []).forEach(el => {
      if (!el.lat || !el.lon) return;
      const tags = el.tags || {}; const name = tags.name || tags['name:nl'] || 'Naamloos punt';
      const ic = iconFor(tags);
      L.marker([el.lat, el.lon], { icon: L.divIcon({ className: '', html: `<div class="mk" style="background:${ic.c};width:22px;height:22px;font-size:12px">${ic.e}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }) })
        .bindPopup(`<b>${esc(name)}</b><div class="tip" style="margin-top:2px">${esc(tags.tourism || tags.amenity || '')}</div>`)
        .addTo(POI_LAYER);
    });
    POI_LAYER.addTo(MAP);
    btn.textContent = `${(j.elements || []).length} plekken — verbergen`;
    if (!(j.elements || []).length) toast('Geen relevante plekken gevonden in dit kaartgebied');
  } catch (e) {
    toast('Kon geen plekken laden (geen verbinding met OpenStreetMap)');
    btn.textContent = 'Plekken in de buurt';

}

function locateMe() {
  if (!navigator.geolocation) { toast('Locatiebepaling wordt niet ondersteund door deze browser'); return; }

function baseLayers(dark) {
  const std = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark ? 'dark_all' : 'light_all'}/{z}/{x}/{y}{r}.png`,
    { maxZoom: 18, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO' });

    { maxZoom: 17, subdomains: 'abc', attribution: '&copy; OpenStreetMap &copy; OpenTopoMap (CC-BY-SA)' });

function routeSvg(stops, opts) {
  const o = Object.assign({ w: 560, h: 340, C: CH, labels: true }, opts || {});
  const c = o.C;
  if (!stops.length) return svgWrap(o.w, 140, `<text x="${o.w / 2}" y="74" text-anchor="middle" fill="${c.muted}" font-size="13" ${FS}>Nog geen bestemmingen</text>`);
  const lats = stops.map(s => s.lat), lngs = stops.map(s => s.lng);
  const midLat = (Math.min(...lats) + Math.max(...lats)) / 2;
  const kx = Math.cos(midLat * Math.PI / 180);
  let dLat = Math.max(Math.max(...lats) - Math.min(...lats), 0.4);
  let dLng = Math.max((Math.max(...lngs) - Math.min(...lngs)) * kx, 0.4);
  const pad = 42, iw = o.w - pad * 2, ih = o.h - pad * 2;
  const sc = Math.min(iw / dLng, ih / dLat);
  const cLat = (Math.min(...lats) + Math.max(...lats)) / 2, cLng = (Math.min(...lngs) + Math.max(...lngs)) / 2;
  const X = s => o.w / 2 + (s.lng - cLng) * kx * sc;
  const Y = s => o.h / 2 - (s.lat - cLat) * sc;
  let grid = '';
  for (let i = 0; i <= 6; i++) {
    grid += `<line x1="${(o.w / 6 * i).toFixed(1)}" y1="0" x2="${(o.w / 6 * i).toFixed(1)}" y2="${o.h}" stroke="${c.grid}" stroke-width=".7"/>`;
    grid += `<line x1="0" y1="${(o.h / 6 * i).toFixed(1)}" x2="${o.w}" y2="${(o.h / 6 * i).toFixed(1)}" stroke="${c.grid}" stroke-width=".7"/>`;
  }
  let paths = '', dots = '';
  stops.forEach((s, i) => {
    if (i) {
      const a = stops[i - 1], fly = s.mode === 'vlucht';
      const x1 = X(a), y1 = Y(a), x2 = X(s), y2 = Y(s);
      const mx = (x1 + x2) / 2 + (y2 - y1) * (fly ? .18 : .07), my = (y1 + y2) / 2 - (x2 - x1) * (fly ? .18 : .07);
      const done = !!s.visited;
      paths += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${done ? '#22C58B' : '#2E86FF'}" stroke-width="2" ${fly ? 'stroke-dasharray="6 5" stroke-opacity=".75"' : (done ? '' : '')}/>`;
    }
    const x = X(s), y = Y(s), done = !!s.visited;
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="${done ? '#22C58B' : '#2E86FF'}" fill-opacity=".18"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7.5" fill="${done ? '#22C58B' : '#2E86FF'}" stroke="${c.paper}" stroke-width="1.6"/>
      ${done
        ? `<path d="M${(x - 3).toFixed(1)} ${y.toFixed(1)}l2 2.4l4.2-5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`
        : `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="middle" fill="#FFFFFF" font-size="8.5" font-weight="600" ${FF}>${i + 1}</text>`}`;
    if (o.labels) {
      const left = x > o.w * .62;
      dots += `<text x="${(x + (left ? -13 : 13)).toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${left ? 'end' : 'start'}" fill="${c.ink}" font-size="11.5" ${FS}>${esc(clip(s.name, 18))}</text>`;
    }
  });
  return svgWrap(o.w, o.h, grid + paths + dots);
}

/* ============================================================
   STATISCHE SATELLIETAFBEELDING — geen kaart-initialisatie nodig,
   dus geen enkel faalpunt qua containergrootte/tijdlijn/CORS-gevoelige
   live kaart. Werkt met een simpele <img> via Esri's publieke,
   sleutelloze "export"-operatie op de World_Imagery-service.
   ============================================================ */
function routeBBox(stops, w, h, padFactor) {
  const pad = padFactor || 0.18;
  if (!stops.length) return { minLat: -25.6, maxLat: -11.9, minLng: 43.2, maxLng: 50.5, wrap: false };
  const lats = stops.map(s => s.lat);
  const rawLngs = stops.map(s => s.lng);
  // Datumgrens-correctie: bij een schijnbaar zeer grote lengtegraadspreiding
  // (>180°) ligt de route vermoedelijk over de ±180°-grens; reken dan door
  // met verschoven waarden zodat de bbox niet per ongeluk de halve aarde beslaat.
  const wrap = (Math.max(...rawLngs) - Math.min(...rawLngs)) > 180;
  const lngs = wrap ? rawLngs.map(lng => lng < 0 ? lng + 360 : lng) : rawLngs;
  let minLat = Math.min(...lats), maxLat = Math.max(...lats), minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  const midLat = (minLat + maxLat) / 2, kx = Math.max(Math.cos(midLat * Math.PI / 180), 0.15);
  let dLat = Math.max(maxLat - minLat, 0.12), dLng = Math.max((maxLng - minLng), 0.12 / kx);
  dLat *= (1 + pad); dLng *= (1 + pad);
  // aspectverhouding van de afbeelding aanhouden zodat de route niet vervormd wordt
  const wantRatio = w / h, curRatio = (dLng * kx) / dLat;
  if (curRatio < wantRatio) dLng = (dLat * wantRatio) / kx; else dLat = (dLng * kx) / wantRatio;
  dLat = Math.min(dLat, 170); // nooit voorbij de polen
  const cLat = (minLat + maxLat) / 2, cLng = (minLng + maxLng) / 2;
  return {
    minLat: Math.max(cLat - dLat / 2, -89), maxLat: Math.min(cLat + dLat / 2, 89),
    minLng: cLng - dLng / 2, maxLng: cLng + dLng / 2, wrap
  };
}
function esriStaticUrl(bbox, w, h) {
  return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export`
    + `?bbox=${bbox.minLng},${bbox.minLat},${bbox.maxLng},${bbox.maxLat}&bboxSR=4326&imageSR=4326`
    + `&size=${w},${h}&format=png24&transparent=false&f=image`;
}
function staticSatelliteBlock(stops, w, h, idHint) {
  const bbox = routeBBox(stops, w, h);
  const imgUrl = esriStaticUrl(bbox, Math.round(w), Math.round(h));
  const lngOf = s => (bbox.wrap && s.lng < 0) ? s.lng + 360 : s.lng;
  const X = s => (lngOf(s) - bbox.minLng) / (bbox.maxLng - bbox.minLng) * w;
  const Y = s => h - (s.lat - bbox.minLat) / (bbox.maxLat - bbox.minLat) * h;
  let paths = '', dots = '';
  stops.forEach((s, i) => {
    if (i) {
      const a = stops[i - 1], fly = a.mode === 'vlucht' || s.mode === 'vlucht', done = !!s.visited;
      const x1 = X(a), y1 = Y(a), x2 = X(s), y2 = Y(s);
      paths += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none"
        stroke="${done ? '#22C58B' : '#2E86FF'}" stroke-width="3" stroke-linecap="round"
        ${fly ? 'stroke-dasharray="7 6"' : ''} style="filter:drop-shadow(0 0 2px rgba(0,0,0,.7))"/>`;
    }
    const x = X(s), y = Y(s), done = !!s.visited;
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="${done ? '#22C58B' : '#2E86FF'}" stroke="#fff" stroke-width="2" style="filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))"/>
      ${done
        ? `<path d="M${(x - 3.2).toFixed(1)} ${y.toFixed(1)}l2.2 2.6l4.4-5.2" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`
        : `<text x="${x.toFixed(1)}" y="${(y + 3.2).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" ${FF}>${i + 1}</text>`}`;
  });
  const overlay = stops.length ? `<svg class="static-map-overlay" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${paths}${dots}</svg>` : '';
  const uid2 = idHint || ('sm' + Math.random().toString(36).slice(2, 8));
  return `<div class="static-map">
    <img src="${imgUrl}" width="${Math.round(w)}" height="${Math.round(h)}" loading="lazy" decoding="async" alt="Satellietbeeld van de route"
      onerror="this.parentElement.classList.add('img-failed')">
    ${overlay}
    <div class="static-map-fallback">Geen verbinding met de satellietbeelddienst — hieronder de getekende route in plaats daarvan.<br>${routeSvg(stops, { w: Math.round(w), h: Math.round(h - 40) })}</div>
  </div>`;
}

/* ---- mobiel: kaart pas actief na een tik, zodat vegen over de pagina niet
   per ongeluk als slepen van de kaart wordt opgevat ---- */
const isTouchDevice = () => window.matchMedia ? window.matchMedia('(pointer:coarse)').matches : ('ontouchstart' in window || navigator.maxTouchPoints > 0);
function addTapToActivate(shellEl, map, forwardClick) {
  if (!isTouchDevice()) return;
  map.dragging.disable(); map.touchZoom.disable(); map.doubleClickZoom.disable();
  const ov = document.createElement('div');
  ov.className = 'map-activate';
  ov.innerHTML = '<span>Tik om de kaart te gebruiken</span>';
  shellEl.appendChild(ov);
  const activate = ev => {
    map.dragging.enable(); map.touchZoom.enable(); map.doubleClickZoom.enable();
    ov.remove();
    if (forwardClick && ev) {
      const rect = shellEl.getBoundingClientRect();
      const t = ev.changedTouches ? ev.changedTouches[0] : ev;
      const pt = L.point(t.clientX - rect.left, t.clientY - rect.top);
      try { const latlng = map.containerPointToLatLng(pt); forwardClick(latlng.lat, latlng.lng); } catch (e) { }
    }
  };
  ov.addEventListener('click', activate);
}

/* ---- mobiel: Leaflet tekent soms grijs/leeg als de container nog geen
   afmeting had op het moment van initialiseren (vaak op mobiel door
   tragere layout of het in/uitklappen van de adresbalk). We forceren
   daarom een paar keer opnieuw meten, plus een observer die reageert
   zodra de afmeting van de kaart echt verandert. ---- */
function keepMapSized(map, el) {
  const fix = () => { try { map.invalidateSize(); } catch (e) { } };
  [0, 60, 200, 500, 1200].forEach(ms => setTimeout(fix, ms));
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(fix);
    ro.observe(el);
    map._sizeObserver = ro;
  }
  const onWinChange = () => fix();
  window.addEventListener('resize', onWinChange);
  window.addEventListener('orientationchange', onWinChange);
  map._sizeCleanup = () => { window.removeEventListener('resize', onWinChange); window.removeEventListener('orientationchange', onWinChange); };
}
function teardownMap(mapVar) {
  if (!mapVar) return;
  try { mapVar._sizeObserver && mapVar._sizeObserver.disconnect(); } catch (e) { }
  try { mapVar._sizeCleanup && mapVar._sizeCleanup(); } catch (e) { }
  try { mapVar.remove(); } catch (e) { }
}

function initMap() {
  const el = document.getElementById('map'); if (!el) return;
  const shell = el.closest('.map-shell');
  const stops = (S.route || []).filter(s => typeof s.lat === 'number');
  if (typeof L === 'undefined') { el.innerHTML = routeSvg(stops, { w: 700, h: 430 }); return; }
  teardownMap(MAP); MAP = null;
  POI_LAYER = null; locateMarker = null; ROAD_LAYER = null;
  MAP = L.map(el, { zoomControl: true, scrollWheelZoom: true });
  MAP._markers = {}; MAP._legs = {};
  const dark = document.documentElement.dataset.theme !== 'light';
  const layers = baseLayers(dark);
  const startLayerName = layers[S.trip.mapLayer] ? S.trip.mapLayer : 'Satelliet';
  layers[startLayerName].addTo(MAP);
  L.control.layers(layers, null, { position: 'topright', collapsed: true }).addTo(MAP);
  MAP.on('baselayerchange', ev => { S.trip.mapLayer = ev.name; save(); });
  L.control.scale({ position: 'bottomright', imperial: false }).addTo(MAP);
  const pts = [];
  stops.forEach((s, i) => {
    if (i) {
      const prev = stops[i - 1], l = legInfo(prev, s), done = !!s.visited;
      const leg = L.polyline([[prev.lat, prev.lng], [s.lat, s.lng]], {
        color: done ? '#22C58B' : '#2E86FF', weight: 3, opacity: .85,
        dashArray: l.modeKey === 'vlucht' ? '7 7' : null
      }).addTo(MAP).bindPopup(`<b>${esc(prev.name)} → ${esc(s.name)}</b><br>${l.mode.label} · ${km0(l.km)} · ${hhmm(l.hours)}${done ? ' · <span style="color:#22C58B">al gereden</span>' : ''}`, { maxWidth: 240 });
      MAP._legs[s.id] = leg;
    }
    const done = !!s.visited;
    const marker = L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', html: `<div class="mk ${done ? 'mk-done' : ''}">${done ? '✓' : i + 1}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] }) })
      .addTo(MAP)
      .bindPopup(`<b>${esc(s.name)}</b><br>${s.nights || 0} ${(s.nights || 0) === 1 ? 'nacht' : 'nachten'}${s.note ? '<br>' + esc(s.note) : ''}<br><span style="opacity:.6">${s.lat.toFixed(3)}, ${s.lng.toFixed(3)}</span>
        ${popupBtn(done ? 'Markeer als nog te gaan' : 'Markeer als bezocht', `mapToggleVisited('${s.id}')`)}
        ${popupBtn('Toon 10 km straal', `mapDrawRadius(${s.lat},${s.lng},10,'${encodeURIComponent(s.name)}')`)}`, { maxWidth: 240 });
    MAP._markers[s.id] = marker;
    pts.push([s.lat, s.lng]);
  });
  if (mapView) MAP.setView(mapView.center, mapView.zoom);
  else if (pts.length > 1) MAP.fitBounds(pts, { padding: [45, 45] });
  else if (pts.length) MAP.setView(pts[0], 8);
  else MAP.setView([-18.9, 47.5], 5);
  MAP.on('moveend', () => { mapView = { center: MAP.getCenter(), zoom: MAP.getZoom() }; });
  MAP.on('click', e => { handleMapClick(e.latlng.lat, e.latlng.lng); });
  if (shell) addTapToActivate(shell, MAP, (lat, lng) => handleMapClick(lat, lng));
  keepMapSized(MAP, el);
  mapNeedsReinit = false;
}

/* Werkt alleen de kleur/icoon van markers en lijnen bij op basis van de
   huidige S.route-data, zonder de kaart (tegels, lagen, event listeners)
   opnieuw op te bouwen. Gebruikt bij een simpele bezocht/nog-te-gaan-wissel,
   waarvoor een volledige heropbouw van de kaart onnodig netwerkverkeer en
   DOM-werk zou kosten. Geeft false terug als de kaart niet (meer) overeenkomt
   met de route-data, zodat de aanroeper dan alsnog een volledige herinit forceert. */
function refreshVisitedStyling() {
  if (!MAP || !MAP._markers) return false;
  const stops = (S.route || []).filter(s => typeof s.lat === 'number');
  for (let i = 0; i < stops.length; i++) {
    const s = stops[i], mk = MAP._markers[s.id];
    if (!mk) return false;
    const done = !!s.visited;
    mk.setIcon(L.divIcon({ className: '', html: `<div class="mk ${done ? 'mk-done' : ''}">${done ? '✓' : i + 1}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] }));
    mk.setPopupContent(`<b>${esc(s.name)}</b><br>${s.nights || 0} ${(s.nights || 0) === 1 ? 'nacht' : 'nachten'}${s.note ? '<br>' + esc(s.note) : ''}<br><span style="opacity:.6">${s.lat.toFixed(3)}, ${s.lng.toFixed(3)}</span>
      ${popupBtn(done ? 'Markeer als nog te gaan' : 'Markeer als bezocht', `mapToggleVisited('${s.id}')`)}
      ${popupBtn('Toon 10 km straal', `mapDrawRadius(${s.lat},${s.lng},10,'${encodeURIComponent(s.name)}')`)}`);
    if (i) {
      const prev = stops[i - 1], leg = MAP._legs[s.id];
      if (!leg) return false;
      const l = legInfo(prev, s);
      leg.setStyle({ color: done ? '#22C58B' : '#2E86FF' });
      leg.setPopupContent(`<b>${esc(prev.name)} → ${esc(s.name)}</b><br>${l.mode.label} · ${km0(l.km)} · ${hhmm(l.hours)}${done ? ' · <span style="color:#22C58B">al gereden</span>' : ''}`);
    }
  }
  return true;
}

window.mapToggleVisited = function (id) {
  const s = (S.route || []).find(x => x.id === id);
  if (s) {
    s.visited = !s.visited;
    if (refreshVisitedStyling()) mapNeedsReinit = false;
    render(); save(); if (MAP) MAP.closePopup();
  }
};

function addStopAt(lat, lng, name) {
  const n = name || prompt('Naam van de bestemming');
  if (!n || !n.trim()) return;
  S.route = S.route || [];
  S.route.push({ id: uid('r'), name: n.trim(), lat: Math.round(lat * 1e4) / 1e4, lng: Math.round(lng * 1e4) / 1e4, nights: 1, mode: S.route.length ? '4x4' : 'start', note: '', visited: false });
  addMode = false; mapView = null; render(); save(); toast(`${esc(n)} toegevoegd aan de route`);
}

function tripSummaryBullets(d, R) {
  const first = R.stops[0], last = R.stops[R.stops.length - 1];
  const flightLegs = R.legs.filter(l => l.modeKey === 'vlucht').length;
  const items = [];
  if (first) items.push(`Start in <b>${esc(first.name)}</b>${last && last !== first ? `, eindigt in <b>${esc(last.name)}</b>` : ''}`);
  items.push(`<b>${R.stops.length}</b> bestemmingen over <b>${d.days}</b> dagen (${fmtDate(S.trip.start)} – ${fmtDate(S.trip.end)})`);
  items.push(`<b>${km0(R.km)}</b> in totaal — ${km0(R.roadKm)} over land${R.flightKm ? ` en ${km0(R.flightKm)} door de lucht` : ''}`);
  items.push(`Zo'n <b>${hhmm(R.hours)}</b> onderweg, verdeeld over ${R.legs.length} ${R.legs.length === 1 ? 'etappe' : 'etappes'}${flightLegs ? ` (waarvan ${flightLegs} ${flightLegs === 1 ? 'vlucht' : 'vluchten'})` : ''}`);
  if (R.longest) items.push(`Langste etappe: <b>${esc(R.longest.from.name)} → ${esc(R.longest.to.name)}</b> (${km0(R.longest.km)})`);
  items.push(`<b>${R.nights}</b> overnachtingen gepland`);
  const done = R.stops.filter(s => s.visited).length;
  if (done) items.push(`Al <b>${done} van de ${R.stops.length}</b> bestemmingen bezocht`);
  return `<ul class="steps" style="counter-reset:none">${items.map(t => `<li style="align-items:flex-start">${t}</li>`).join('')}</ul>`;
}

          <button class="btn ghost icon-btn" data-movestop="${s.id}:1" title="Omlaag" ${i === stops.length - 1 ? 'disabled' : ''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="m6 9 6 6 6-6"/></svg></button>
          <button class="btn ghost icon-btn" data-editstop="${s.id}" title="Bewerken"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
          <button class="btn ghost icon-btn danger" data-delstop="${s.id}" title="Verwijderen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>

    <div class="map-overlay">

      <span class="map-badge"><b>${hhmm(R.hours)}</b> onderweg</span>
      <span class="map-badge"><b>${visitedCount}/${stops.length}</b> bezocht</span>
      ${R.longest ? `<span class="map-badge">langste etappe <b>${esc(R.longest.to.name)}</b> ${km0(R.longest.km)}</span>` : ''}
    </div>
    <div class="map-tools">
      <button class="map-tool-btn" id="roadsBtn" title="Teken de route via echte wegen (OSRM/OpenStreetMap)">🛣️ Route via wegen</button>
      <button class="map-tool-btn" id="locateBtn" title="Toon mijn huidige locatie">📍 Mijn locatie</button>
      <button class="map-tool-btn" id="poiBtn" title="Laad interessante plekken uit OpenStreetMap in dit kaartgebied">Plekken in de buurt</button>
    </div>
    <div class="map-hint">${addMode ? 'Klik op de kaart om een bestemming te plaatsen' : 'Klik op de kaart om een plek op te zoeken · sleep om te verschuiven · scroll om te zoomen'}</div>
  </div>
  <p class="tip mb">Groen = al bezocht, blauw = nog te gaan. Klik op het rondje met het volgnummer bij een bestemming (of hieronder in de lijst) om 'm af te strepen.</p>

  <div class="grid g-2-1">

          <label class="f"><span>Land</span><input type="text" id="countryInp" value="${esc(S.country || '')}" placeholder="Madagaskar"></label>
        </div>
        <div class="flex mt" style="justify-content:flex-end">
          <button class="btn primary" id="doSearch">Zoeken</button>
          <button class="btn ${addMode ? 'primary' : ''}" id="mapAddBtn">${addMode ? 'Klik op de kaart…' : 'Op kaart aanwijzen'}</button>

    </div>
    <div>
      ${card('Route in het kort', 'Satellietbeeld van de hele route — altijd statisch, laadt zonder kaart-initialisatie', staticSatelliteBlock(stops, 460, 300))}
      <div class="card mt"><div class="card-b">
        <div class="eyebrow mb">Samenvatting van de reis</div>
        ${tripSummaryBullets(d, R)}
      </div></div>
      <div class="card mt"><div class="card-b">
        <div class="eyebrow mb">Hoe de reistijd wordt berekend</div>
        <p class="tip">Hemelsbrede afstand × een omwegfactor per vervoerswijze, gedeeld door een realistische snelheid. Op Madagaskar rekent de app met 40 km/u voor 4x4-etappes en 50 km/u over asfalt — de RN7 is beter dan zijn reputatie, maar geen snelweg. Vluchten krijgen anderhalf uur extra voor inchecken en transfers. Klopt een etappe niet? Vul bij die bestemming een eigen aantal kilometers of uren in.</p>
      </div></div>
    </div>
  </div>

  ${sectionTitle('Etappes')}
  ${card('Van stop naar stop', 'Hemelsbreed versus werkelijk af te leggen', `<div class="tbl-wrap"><table>
    <thead><tr><th>Etappe</th><th>Vervoer</th><th class="r">Hemelsbreed</th><th class="r">Te rijden</th><th class="r">Reistijd</th></tr></thead>
    <tbody>${legRows}</tbody>
    <tfoot><tr><td>Totaal over ${R.legs.length} etappes</td><td></td><td class="r num">—</td><td class="r num">${km0(R.km)}</td><td class="r num">${hhmm(R.hours)}</td></tr></tfoot>
  </table></div>`)}
  ${sectionTitle('Trends & inzichten')}
  ${insightCards(routeInsights(d))}`;
}

function routeInsights(d) {
  const R = d.route, out = [];
  if (!R.stops.length) return [{ icon: 'info', title: 'Begin met je eerste bestemming', body: 'Zodra er twee stops staan, rekent de app afstanden, reistijden en de kosten per kilometer uit.' }];
  if (R.legs.length) {
    out.push({ icon: 'trend', tone: 'note', title: `${km0(R.km)} af te leggen in ${hhmm(R.hours)}`, body: `Dat is gemiddeld <span class="hl">${hhmm(R.hours / R.legs.length)}</span> per etappe over ${R.legs.length} verplaatsingen. ${R.flightKm ? `Daarvan gaat ${km0(R.flightKm)} door de lucht — zonder die vlucht zou je er dagen langer over doen.` : ''}` });
    if (R.longest) out.push({ icon: 'alert', tone: 'up', title: `Langste etappe: ${esc(R.longest.from.name)} → ${esc(R.longest.to.name)}`, body: `<span class="hl">${km0(R.longest.km)}</span> en ${hhmm(R.longest.hours)}. Plan hier een volle dag voor, of hak hem in tweeën met een tussenstop.` });
    const share = R.hours / (d.days * 10);
    out.push({ icon: 'info', title: `Je zit ${Math.round(share * 100)}% van je wakkere uren onderweg`, body: `${hhmm(R.hours)} reistijd verdeeld over ${d.days} dagen. ${share > .25 ? 'Dat is fors — overweeg een bestemming te schrappen.' : 'Dat laat genoeg tijd over om ergens te blijven hangen.'}` });
  }
  const diff = R.nights - (d.days - 1);
  out.push(diff === 0
    ? { icon: 'check', tone: 'good', title: 'Overnachtingen kloppen met de reisduur', body: `${R.nights} nachten voor een reis van ${d.days} dagen. Alles sluit aan.` }
    : { icon: 'alert', tone: 'up', title: diff > 0 ? `${diff} ${diff === 1 ? 'nacht' : 'nachten'} te veel gepland` : `${-diff} ${-diff === 1 ? 'nacht' : 'nachten'} niet ingevuld`, body: `Je route telt ${R.nights} overnachtingen, terwijl de reis van ${fmtDate(S.trip.start)} tot ${fmtDate(S.trip.end)} er ${d.days - 1} toelaat.` });
  const transport = S.cats.find(c => /vervoer/i.test(c.name));
  if (transport && R.km) {
    const t = d.byCat[transport.id].total;
    out.push({ icon: 'coins', title: 'Wat een kilometer kost', body: `Met ${money0(t)} aan ${esc(transport.name.toLowerCase())} over ${km0(R.km)} kom je op <span class="hl">${money(t / R.km, 2)} per kilometer</span> — ${money(t / R.km / d.np, 2)} per persoon.` });
  }
  return out;
}

async function doPlaceSearch() {
  const q = (document.getElementById('stopSearch') || {}).value || '';
  const out = document.getElementById('searchOut');
  if (!q.trim()) { out.innerHTML = '<p class="tip">Typ eerst een plaatsnaam.</p>'; return; }
  out.innerHTML = '<p class="tip">Zoeken…</p>';
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=6&q=' + encodeURIComponent(q + (S.country ? ', ' + S.country : ''));
    const r = await fetch(url, { headers: { Accept: 'application/json' } });
    const j = await r.json();
    if (!j.length) { out.innerHTML = '<p class="tip">Niets gevonden. Probeer een andere spelling, of wijs de plek aan op de kaart.</p>'; return; }
    searchResults = j.map(x => ({ name: x.display_name.split(',')[0], full: x.display_name, lat: +x.lat, lng: +x.lon }));
    out.innerHTML = `<div class="search-res">${searchResults.map((x, i) => `<button data-pick="${i}"><strong>${esc(x.name)}</strong><br><span class="tip">${esc(x.full)}</span></button>`).join('')}</div>`;
  } catch (e) {
    out.innerHTML = '<p class="tip">Zoeken lukt hier niet (geen verbinding met de plaatsendienst). Gebruik <span class="hl">Op kaart aanwijzen</span> of voer de coördinaten handmatig in.</p>';
  }
}

/* ---- interactie takenlijst ---- */
function addTodoFromInput() {
  const el = document.getElementById('todoInput');
  if (!el || !el.value.trim()) return;
  S.todos = S.todos || [];
  S.todos.push({ id: uid('t'), text: el.value.trim(), done: false });
  render(); save();
  const n = document.getElementById('todoInput'); if (n) n.focus();
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-toggletodo],[data-deltodo],#addTodo,#clearDone');
  if (!t) return;
  if (t.dataset.toggletodo) {
    const x = (S.todos || []).find(z => z.id === t.dataset.toggletodo);
    if (x) { x.done = !x.done; render(); save(); }
    return;
  }
  if (t.dataset.deltodo) { S.todos = (S.todos || []).filter(z => z.id !== t.dataset.deltodo); render(); save(); return; }
  if (t.id === 'addTodo') { addTodoFromInput(); return; }
  if (t.id === 'clearDone') {
    const n = (S.todos || []).filter(z => z.done).length;
    S.todos = (S.todos || []).filter(z => !z.done);
    render(); save(); toast(`${n} afgeronde ${n === 1 ? 'taak' : 'taken'} opgeruimd`); return;
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'todoInput') { ev.preventDefault(); addTodoFromInput(); }
  if ((ev.key === ' ' || ev.key === 'Enter') && ev.target.dataset && ev.target.dataset.toggletodo) {
    ev.preventDefault(); ev.target.click();
  }
});

/* ---- interactie Reis-tab ---- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-addstop],[data-editstop],[data-delstop],[data-movestop],[data-togglevisited],[data-pick],[data-stopsave],[data-stopdel],#mapAddBtn,#doSearch,#locateBtn,#poiBtn,#roadsBtn');
  if (!t) return;
  const d = t.dataset;
  if (d.addstop !== undefined && t.hasAttribute('data-addstop')) { openStopDrawer(); return; }
  if (d.editstop) { openStopDrawer(d.editstop); return; }
  if (d.togglevisited) {
    const s = S.route.find(x => x.id === d.togglevisited);
    if (s) {
      s.visited = !s.visited;
      if (refreshVisitedStyling()) mapNeedsReinit = false;
      render(); save(); toast(s.visited ? `${esc(s.name)} gemarkeerd als bezocht` : `${esc(s.name)} weer op "nog te gaan" gezet`);
    }
    return;
  }
  if (d.delstop) {
    const i = S.route.findIndex(x => x.id === d.delstop);
    const n = S.route[i].name;
    S.route.splice(i, 1);
    if (S.route.length) S.route[0].mode = 'start';
    mapView = null; render(); save(); toast(`${esc(n)} verwijderd uit de route`); return;
  }
  if (d.movestop) {
    const [id, dir] = d.movestop.split(':');
    const i = S.route.findIndex(x => x.id === id), j = i + Number(dir);
    if (j < 0 || j >= S.route.length) return;
    const a = S.route[i]; S.route[i] = S.route[j]; S.route[j] = a;
    S.route.forEach((s, k) => { if (k === 0) s.mode = 'start'; else if (s.mode === 'start') s.mode = '4x4'; });
    render(); save(); return;
  }
  if (d.pick) { const x = searchResults[+d.pick]; if (x) addStopAt(x.lat, x.lng, x.name); return; }
  if (t.id === 'mapAddBtn') { addMode = !addMode; render(); return; }
  if (t.id === 'doSearch') { doPlaceSearch(); return; }
  if (t.id === 'locateBtn') { locateMe(); return; }
  if (t.id === 'poiBtn') { togglePois(); return; }
  if (t.id === 'roadsBtn') { toggleRoads(); return; }
  if (d.stopsave !== undefined) {
    const s = ui.form;
    if (!s.name.trim()) { toast('Geef de bestemming een naam'); return; }
    ['km', 'hours'].forEach(k => { if (s[k] === '' || s[k] === null) s[k] = null; });
    if (ui.editing) { const i = S.route.findIndex(x => x.id === ui.editing); S.route[i] = Object.assign(S.route[i], s); }
    else { s.id = uid('r'); S.route.push(s); }
    closeDrawer(); mapView = null; render(); save(); toast(ui.editing ? 'Bestemming opgeslagen' : 'Bestemming toegevoegd'); return;
  }
  if (d.stopdel !== undefined) {
    S.route = S.route.filter(x => x.id !== ui.editing);
    if (S.route.length) S.route[0].mode = 'start';
    closeDrawer(); mapView = null; render(); save(); toast('Bestemming verwijderd'); return;
  }
});
document.addEventListener('input', ev => {
  const el = ev.target, d = el.dataset;
  if (d.s) { ui.form[d.s] = (d.s === 'lat' || d.s === 'lng' || d.s === 'nights') ? Number(el.value) : (d.s === 'km' || d.s === 'hours') ? (el.value === '' ? null : Number(el.value)) : el.value; return; }
  if (el.id === 'countryInp') { S.country = el.value; save(); return; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'stopSearch') { ev.preventDefault(); doPlaceSearch(); }
});

function tagPillHtml(t, active, attr) {

function allChecklists() {
  const out = [];

function bodyToHtml(text) {
  const paras = String(text || '').split(/\n\s*\n/);
  return paras.map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('') || '<p class="tip">Geen tekst.</p>';
}
function excerpt(text, n) {
  const t = String(text || '').replace(/\s+/g, ' ').trim();
  if (t.length <= n) return t || 'Geen tekst.';
  const cut = t.slice(0, n);
  const sp = cut.lastIndexOf(' ');
  return (sp > n * 0.6 ? cut.slice(0, sp) : cut) + '…';
}
function checklistBox(post, cl) {

      <span class="txt" data-togglepostitem="${post.id}:${cl.id}:${it.id}">${esc(it.text)}</span>
      <button class="x" data-delpostitem="${post.id}:${cl.id}:${it.id}" title="Verwijderen" aria-label="Verwijderen">×</button>
    </div>`).join('') : '<div class="tip" style="padding:8px 10px">Nog geen punten.</div>';
  return `<div class="checklist-box" data-clbox="${post.id}:${cl.id}">
    <div class="cl-head">
